function ringSVG(lv){
  var C = 2 * Math.PI * 63;
  var off = C * (1 - lv / 5);
  return '<svg width="152" height="152" viewBox="0 0 152 152">' +
    '<circle cx="76" cy="76" r="63" fill="none" stroke="rgba(201,162,75,.22)" stroke-width="7.5"/>' +
    '<circle cx="76" cy="76" r="63" fill="none" stroke="#C9A24B" stroke-width="7.5" stroke-linecap="round" ' +
    'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg>';
}

function radarSVG(S){
  var cx = 320, cy = 200, R = 140, n = 6;
  var weak = 0;
  for (var w = 1; w < n; w++) if (S[w] < S[weak]) weak = w;
  function pt(idx, val){
    var ang = -Math.PI / 2 + idx * 2 * Math.PI / n;
    var rr = R * val / 4;
    return [cx + rr * Math.cos(ang), cy + rr * Math.sin(ang)];
  }
  var svg = '<svg width="432" height="270" viewBox="0 0 640 400" style="max-width:100%">';
  for (var ring = 1; ring <= 4; ring++) {
    var pts = [];
    for (var i = 0; i < n; i++) pts.push(pt(i, ring).join(","));
    svg += '<polygon points="' + pts.join(" ") + '" fill="none" stroke="#C9A24B" stroke-opacity="' + (ring === 4 ? 0.6 : 0.22) + '" stroke-width="' + (ring === 4 ? 1.6 : 1.1) + '"/>';
  }
  for (var a = 0; a < n; a++) {
    var p = pt(a, 4);
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="#C9A24B" stroke-opacity="0.22" stroke-width="1.1"/>';
  }
  var poly = [];
  for (var v = 0; v < n; v++) poly.push(pt(v, Math.max(0.25, S[v])).join(","));
  svg += '<polygon points="' + poly.join(" ") + '" fill="rgba(20,58,107,.2)" stroke="#143A6B" stroke-width="3" stroke-linejoin="round"/>';
  for (var d = 0; d < n; d++) {
    var dp = pt(d, Math.max(0.25, S[d]));
    svg += '<circle cx="' + dp[0] + '" cy="' + dp[1] + '" r="6" fill="#fff" stroke="#C9A24B" stroke-width="2.5"/>';
  }
  for (var l = 0; l < n; l++) {
    var lp = pt(l, 5.05);
    var anchor = "middle";
    if (lp[0] < cx - 50) anchor = "end";
    if (lp[0] > cx + 50) anchor = "start";
    svg += '<text x="' + lp[0] + '" y="' + (lp[1] + 7) + '" text-anchor="' + anchor + '" font-size="20" font-weight="700" fill="' + (l === weak ? "#B08A2E" : "#1C2733") + '">' + AXES[l] + '</text>';
  }
  svg += '</svg>';
  return svg;
}

  var n = "<b>" + esc(name) + "さん</b>";

  /* P1 現在地の言い当て（事実の反射） */
  var where = "";
  if (p.freelance) where = "会社に属さず働く";
  else if (p.jobLabel && p.posLabel) where = p.jobLabel + "の現場で、" + p.posLabel + "として働く";
  else if (p.jobLabel) where = p.jobLabel + "の現場で働く";
  var ai = p.aiFar ? "AIとの距離はまだ遠く、これから触れていく段階"
         : p.aiSome ? "AIは調べ物や文章づくりで、たまに使う程度"
         : p.aiDaily ? "AIは資料作成や壁打ちで日常的に使っている"
         : p.aiFlow ? "AIをすでに業務の一部のフローに組み込んでいる"
         : p.aiAuto ? "自動化・仕組み化まで自分で作り込んでいる" : "AIと日々向き合っている";
  var change = p.noChange ? "ただ、目に見える変化はまだ出ていない"
             : p.faster ? "自分の作業が少し速くなった手応えはある"
             : p.quality ? "成果物の質が上がった実感もある"
             : p.flowDone ? "業務フローを1つ改善するところまで来ている"
             : p.teamDone ? "チーム・部署の業務まで変えている" : "";
  var emp = EMPATHY_BY_Q5[ans[4]] || "AIとの距離を、これからキャリアの力に変えていく位置にいます。";
  if (p.evalNone && change) emp = "ただ、その変化がキャリアに効いている実感は、まだないはずです。多くの人がここから始めて、90日で景色を変えています。";
  var p1 = where + n + "。" + ai + "。" + (change ? change + "。" : "") + emp;

  var p2 = "";
  if (p.hopeOuter && (p.outNo || p.outVague)) {
    p2 = "「" + esc(p.hope) + "」という方向が、すでに見えています。そのうえで「外で通用する力を、まだ言葉にできていない」とも感じている。動く気持ちと、確かめたい気持ち。この2つが同時にあるのは自然なことで、外に見せられる実績が1本あれば、両方が同時に解けます。";
  } else if ((p.evalNext || p.evalSame) && p.wantEval) {
    p2 = "いちばん変えたいのは、評価と役割。AIはすでに使えている。だからこそ、次に必要なのはスキルの上乗せではなく、出している成果を「評価される言葉」に変換する工程です。ここが加わるだけで、同じ仕事が実績に変わり始めます。";
  } else if ((p.lifeNo || p.life10) && p.wantPrep) {
    p2 = "大きな不満があるわけではない。ただ「この働き方を、この先も続けられるか」という問いを持っている。人に話すほどのことではなくても、ふとした瞬間に戻ってくる問いではないでしょうか。この感覚を持てていること自体が、備えられる人の証拠です。";
  } else if (p.wantTime && (p.t15 || p.t60)) {
    p2 = "変えたいのは働き方と時間。使える時間は" + (p.t15 ? "1日15分ほど" : "1日1時間まで") + "。時間がないからこそ、時間の使い方を変えたい。この順番のはずです。だからこそ、まとまった時間を待たずに始められる設計が、あなたに合っています。";
  } else if (p.wantEnv && p.envLimit) {
    p2 = "変えたいのは環境。会社のAI活用にも制約がある。ただ、制約の中で作った実績は、環境に左右されない自分の手札になります。環境が整うのを待たずに、いまの裁量の範囲で始められることがある。そこに目が向いているのではないでしょうか。";
  } else if (p.wantValue) {
    p2 = "変えたいのは、自分の市場価値。いまの会社での評価とは別に「外に出たとき、自分は何者か」を確かめたい気持ちがある。" + (p.outUnsorted ? "実績はすでにあります。あとは整理して見せる形にするだけです。" : "その答えは、これから作る実績の中にあります。作れる位置に、すでにいます。");
  } else if (p.lifeNo || p.life10) {
    p2 = "いまの働き方を「ずっと続ける」とは考えていない。目の前の仕事は回っているからこそ、この問いは後回しになりやすい。ただ、こうして診断を受けている時点で、すでに向き合い始めています。その一歩が、いちばん大きい一歩です。";
  } else if (p.wantPrep) {
    p2 = "いま大きく困っているわけではない。ただ「備えておきたい」と感じている。この感覚を持てていること自体が、実は少数派です。多くの人は必要に迫られてから動きます。あなたはその前に動ける位置にいます。";
  } else if (p.roleAssigned || p.roleWill) {
    p2 = "推進する側に立とうとしている。自分がAIを使えることと、組織で成果を出すことは別の仕事だということも、すでに感じ始めているのではないでしょうか。その感覚がある人ほど、任せる・判断する・展開するの切り分けが早く身につきます。";
  } else {
    p2 = "「" + esc(p.year1 || "いまより一歩先の状態") + "」。目指す姿が見えているのは、それだけで前提が整っているということです。あとは、そこへ届く順番を設計するだけです。";
  }

  /* P3 本人が気づいていない強み（最も高い軸＋立ち位置） */
  var p3 = "本人が思っているより評価できるのは<span class=\"gold\">「" + AXES[p.top] + "」</span>です。" + AX_MEAN_HIGH[p.top] + "。";
  if (p.roleAsked) p3 += "周囲からAIについて聞かれることが増えているのは、その証拠です。周りは「AIならこの人」と見始めています。本人が思うより早く。";
  else if (p.roleAssigned) p3 += "推進を任されている（任されそう）というのは、周りがすでにその力を見ている、ということです。";
  else if (p.askGoal || p.askDesign) p3 += "AIへの頼み方が整理されているのは、AIの技術ではなく仕事の設計力です。ここは、教えても身につきにくい力です。";
  else if (p.leader) p3 += p.posLabel + "という立場で得てきた「現場を動かす感覚」は、AI活用をチームに広げるときにそのまま効きます。";
  else if (p.outUnsorted || p.outYes) p3 += "外でも通用する実績を、すでに持っています。あとは、その見せ方です。";
  else if (p.alone || p.web) p3 += "相談相手がいない中でここまで進めてきた、調べる力と続ける力もあります。";
  else p3 += "ここを土台にすれば、次の力は積み上がります。";

  /* P4 伸びしろ（積み上げ順の2つ） */
  var idx = [0,1,2,3,4];
  idx.sort(function(a,b){ return S[a] - S[b]; });
  var ax1 = idx[0], ax2 = idx[1];
  var p4 = "次に伸ばすと効くのは、AIを「もっと使えるようになること」ではありません。<span class=\"gold\">「" + AXES[ax1] + "」</span>と<span class=\"gold\">「" + AXES[ax2] + "」</span>。" +
    AX_MEAN_LOW[ax1] + "。" + esc(td.redefine);

  /* P5 90日で動いたとき、最初に変わること */
  var first = p.wantEval ? "評価面談で語れる材料が手元にできること"
            : p.wantTime ? "浮いた時間が、自分のために残るようになること"
            : p.wantValue || p.hopeOuter ? "職務経歴書やプロフィールに書ける1行ができること"
            : p.wantEnv ? "環境に左右されない、自分の手札が1枚増えること"
            : p.wantPrep ? "「いざという時の名刺」が1枚できること"
            : "「何から始めるか」で迷わなくなること";
  var second = p.evalNext ? "浮いた時間の使い道を、自分で決められるようになります"
             : p.evalSame ? "「使えている」が、周りに見える形になります"
             : p.aiFar || p.aiSome ? "AIとの距離が、一気に縮まります"
             : p.alone || p.web ? "調べる時間が、形になる時間に変わります"
             : "次の一手が、自然に見えてきます";
  var p5 = "90日で語れる実績を1本作ると、最初に変わるのは" + first + "です。そしてもう1つ、" + second + "。" +
    (p.lifeNo || p.life10 ? "「この先も続けられるか」という問いに、自分の手で答えを出せるようになります。" : "");
  if (WALL_MSG[p.wall]) p5 += WALL_MSG[p.wall];

  var kw = buildKeywords(p);
  var kwHtml = '<p class="kw"><span>KEYWORDS</span>' + kw.map(function(k){ return "「" + esc(k) + "」"; }).join("") + '</p>';
  return {
    top: kwHtml + "<p>" + p1 + "</p><p>" + p2 + "</p><p>" + p3 + "</p>",
    rest: "<p>" + p4 + "</p><p>" + p5 + "</p>"
  };
}

/* 6つの力の読み解き */
function buildAxisReading(p, stackWeak){
  return "<b>いちばん高いのは「" + AXES[p.top] + "」（" + p.S[p.top].toFixed(1) + "）。</b>" + AX_MEAN_HIGH[p.top] + "。<br>" +
    "<b>いちばん伸びしろがあるのは「" + AXES[p.low] + "」（" + p.S[p.low].toFixed(1) + "）。</b>" + AX_MEAN_LOW[p.low] + "。<br>" +
    "<b>FOCUS｜次に積み上げる力：「" + AXES[stackWeak] + "」。</b>AIをキャリアに変える力は、設計力 → AI活用 → 実装 → 巻き込みの順で積み上がります。この順番で積むほど、同じ努力が大きな成果になります。";
}

/* 2枚目：出口ごとの「あなたの場合」 */
function buildExitReason(p, exitName, rank){
  var inner = has(exitName, "昇進") || has(exitName, "DX") || has(exitName, "異動");
  if (exitName === p.hopeExit) return "ご希望と一致。いちばん近いルートです";
  if (has(exitName, "昇進")) return p.evalRelied || p.evalMoved ? "すでに周囲の評価が動いているので、次の評価面談が勝負どころ" : "いまの業務の実績を評価の言葉に変えれば、地続きで狙えます";
  if (has(exitName, "DX")) return p.roleAsked || p.roleAssigned ? "周囲から聞かれる・任される立場を、正式なポジションに変える段階" : "「AIならこの人」という社内認知を作るところから";
  if (has(exitName, "異動")) return "いまの職種の実績を、移りたい先でも再現できる形にすれば動きます";
  if (has(exitName, "転職")) return p.outUnsorted || p.outYes ? "実績はある。職務経歴書に書ける形に整えれば、市場価値は一段上がります" : "まず90日で、職務経歴書に書ける1本を作るのが現実的な準備";
  if (has(exitName, "副業")) return p.sotoYes || p.sotoMoving ? "社外展開を視野に入れている強みが、そのまま活きます" : "本業の実績を、社外の人にも伝わる言葉にしてから";
  if (has(exitName, "フリーランス")) return p.freelance ? "すでに外で働いている。AI実績を値付けの根拠にする段階" : "小さな副業で外の実績を作ってから、が現実的な順番";
  if (has(exitName, "ベンチャー")) return p.manager ? "影響範囲を持つ立場なので、チーム規模の成果が揃えば視野に入ります" : "チーム単位で成果を出す経験を積んでから";
  return "";
}

/* 3枚目：あなたの場合、こう出やすい（回答から3つ） */
function buildPersonalBullets(p){
  var c = [];
  if (p.alone || p.web) c.push({w:10, t:"相談相手がいない中で、独学でここまで進めてきました。調べる力と続ける力は、すでにあります。あとは「この順番で合っているか」を確かめられる相手が1人いれば、止まらずに進めます。"});
  if (p.t15) c.push({w:9, t:"使える時間は1日15分ほど。15分で終わる単位に業務を切り分ける設計が、あなたにいちばん合っています。まとまった時間がなくても、順番が正しければ90日で形になります。"});
  if (p.t10h) c.push({w:7, t:"時間は作れる方です。だからこそ「1つの業務・1つの成果」に絞るほど、結果が大きくなります。手を広げるより、1本を磨く方が遠くまで届きます。"});
  if (p.envLimit) c.push({w:9, t:"会社のAI環境に制約があります。自分の裁量で完結する業務から始めるのが、いちばん現実的で、いちばん速い。制約の中で作った実績は、再現性の証明として外でも通用します。"});
  if (p.askRaw) c.push({w:8, t:"AIには、思いついたことをそのまま聞いている。ここに「目的と条件を整理してから頼む」型が加わると、出力の質が一気に安定します。いちばん早く伸びる部分です。"});
  if (p.askUnknown) c.push({w:8, t:"「そもそも何を頼めるのか」を、これから見つける段階。AIの勉強から入らず、毎日やっている業務を1つ選んで当ててみると、一気に距離が縮まります。"});
  if (p.askGoal || p.askDesign) c.push({w:6, t:"AIへの頼み方は、すでに整理できています。次は「どの業務をフローごと変えるか」の選定。使い方ではなく、対象業務の選び方で差がつく段階です。"});
  if (p.roleAssigned || p.roleWill) c.push({w:8, t:"推進する立場にいる（立とうとしている）。任せる業務・判断する業務・展開する業務を先に切り分けると、自分で全部検証しなくても組織が動き始めます。"});
  if (p.outUnsorted) c.push({w:7, t:"実績はすでにあります。外向けに整理すれば、そのまま市場価値になります。「どの業務を、どれくらい変えたか」を数字で言葉にするだけです。"});
  if (p.sotoMoving) c.push({w:6, t:"すでに社外へ動き始めています。本業の実績を「外の言葉」に変換する工程を先に置くと、動きが一気に速くなります。"});
  if (p.wallConf) c.push({w:7, t:"「続けられるか」が気になるタイプ。これまで新しい仕事や資格を身につけたときも、最初は同じだったのではないでしょうか。自信は、始めてから育つものです。"});
  if (p.wallWhat) c.push({w:7, t:"「何から手をつけるか」が決まると、一気に動ける人です。これは才能ではなく順番の問題で、順番は設計で決められます。"});
  if (p.wallProof) c.push({w:6, t:"「語れる実績」は、これから作るものです。いまなくて当然で、90日あれば最初の1本は作れます。"});
  if (p.evalNext) c.push({w:8, t:"AIで速くなった分、次の仕事が乗っている。浮いた時間の一部を「実績づくり」に確保する設計ができると、同じ忙しさが評価に変わり始めます。"});
  if (p.aiFar) c.push({w:6, t:"AIとの距離はまだ遠い。だからこそ伸びしろが大きく、自分の業務1つから始めると、最初の1ヶ月で景色が変わります。"});
  if (p.lifeNo || p.life10) c.push({w:5, t:"「この先も続けられるか」という問いを持っている。小さくても外に見せられる実績が1本あると、その問いに自分で答えられるようになります。"});
  if (p.fewPeers) c.push({w:4, t:"聞ける同僚・知人がいます。それに加えて「この順番で合っているか」を確かめられる相手がいると、さらに速くなります。"});
  c.sort(function(a,b){ return b.w - a.w; });
  var out = [];
  for (var i = 0; i < c.length && out.length < 3; i++) out.push(c[i].t);
  while (out.length < 3) out.push(["あれこれ手を広げるより、「どの業務を、どれくらい改善したか」を語れる1本を作る方が、結果として遠くまで届きます。","勉強を増やすより、毎日やっている業務にAIを当てる方が、最短で成果になります。","成果は「なんとなく楽になった」で止めず、数字で残す。ここで実績になります。"][out.length]);
  return out;
}

/* 4枚目：本人向けの90日 */
function buildRoadmap(p){
  var jobLabel = p.jobLabel ? p.jobLabel + "の" : "いまの";
  var m1 = jobLabel + "業務の中から、AIで改善しやすいテーマを1つ選びます。" +
    (p.envLimit ? "会社の制約があるので、自分の裁量で完結する業務に限定します。" : "") +
    (p.t15 ? "1日15分で回る単位に切り分けるのが前提です。" : p.t60 ? "1日1時間以内で回る単位に切り分けます。" : "");
  var m2 = (p.askRaw || p.askUnknown ? "まず「目的・条件を整理してから頼む」型を作ります。" : "") +
    "業務の流れを分解し、AIに任せる部分と人が判断する部分を設計し直して、" +
    (p.noChange || p.evalNone ? "小さな変化でも作業時間・品質・量を数字で残します。" : "改善した業務の変化を作業時間・品質・量の数字で棚卸しします。");
  var m3 = has(p.hopeExit, "昇進") ? "評価面談で語れる形に仕上げます。「どの業務を、どれくらい改善したか」の1本です。"
         : has(p.hopeExit, "転職") ? "職務経歴書に書ける形に仕上げます。外の人が読んで再現性が伝わる1本です。"
         : has(p.hopeExit, "副業") || has(p.hopeExit, "フリーランス") ? "商談・プロフィールで語れる形に仕上げます。値付けの根拠になる1本です。"
         : has(p.hopeExit, "DX") ? "社内で提案・共有できる形に仕上げます。チームで再現できる型としての1本です。"
         : has(p.hopeExit, "異動") ? "移りたい先でも再現できる、と示せる形に仕上げます。"
         : "評価面談・職務経歴書・商談のどこでも語れる1本に仕上げます。";
  return [
    {m:"MONTH 1", h:"対象業務を1つ決めて、小さく実装する", t:m1},
    {m:"MONTH 2", h:"業務フローを再設計して、変化を記録する", t:m2},
    {m:"MONTH 3", h:"成果を「評価される言葉」に変換する", t:m3}
  ];
}

/* 4枚目：締めの一言（温度感×1年後） */
function buildClosing(name, p){
  var when = p.honkiNow ? "いま動き出せば、年内には" : p.honki3m ? "1〜3ヶ月以内に動き出せば、半年後には"
           : p.honki6m ? "半年以内に動き出すなら、1年後には" : "急ぐ必要はありません。ただ方向だけ先に決めておけば、動きたくなったときに";
  var goal = p.year1 && !has(p.year1, "模索") ? "「" + esc(p.year1) + "」" : "「いまより一歩先の状態」";
  var tail = p.honkiLater ? "迷わず進めます。" : "射程に入ります。";
  var mood = p.honkiNow || p.honki3m ? "動き出すなら、勢いのあるいまがいちばんです。"
           : "いきなり大きく動く必要はありません。";
  return esc(name) + "さんが描いた" + goal + "。" + when + tail + mood;
}

function openReport(rowNum){
  var r = rows[rowNum - 1];
  if (!r) { alert("その行のデータが見つかりません（行番号: " + rowNum + "）"); return; }
  var name = r[1] || "（未入力）";
  var lv = parseInt(String(r[2]).replace(/[^0-9]/g, ""), 10) || 1;
  var stage = r[3] || "";
  var phaseObj = PHASES_BY_LV[lv - 1];
  var phase = r[4] || (phaseObj.en + "（" + phaseObj.ja + "）");
  var typeName = r[5] || "";
  var exits = [r[6], r[7], r[8]];
  var S = [];
  for (var i = 0; i < 6; i++) S.push(parseFloat(r[9 + i]) || 0);
  var ans = [];
  for (var q = 0; q < 18; q++) ans.push(r[15 + q] || "");
  var td = TYPE_DATA[typeName] || TYPE_DATA["実務エンジン型"];

  var stackWeak = 0;
  for (var sw = 1; sw < 4; sw++) if (S[sw] < S[stackWeak]) stackWeak = sw;
  var allWeak = 0;
  for (var aw = 1; aw < 6; aw++) if (S[aw] < S[allWeak]) allWeak = aw;

  var barsHtml = "";
  for (var b = 0; b < 6; b++) {
    barsHtml += '<div class="br' + (b === allWeak ? " weak" : "") + '">' +
      '<span class="bn">' + AXES[b] + '</span>' +
      '<span class="bt"><i style="width:' + (S[b] / 4 * 100) + '%"></i></span>' +
      '<span class="bv">' + S[b].toFixed(1) + '</span></div>';
  }

  var prof = buildProfile(ans, S, lv, typeName);

  var strengthsHtml = "", stumblesHtml = "", mindsHtml = "";
  for (var st = 0; st < td.strengths.length; st++) strengthsHtml += "<li>" + esc(td.strengths[st]) + "</li>";
  var personal = buildPersonalBullets(prof);
  for (var sm = 0; sm < personal.length; sm++) stumblesHtml += "<li>" + esc(personal[sm]) + "</li>";
  for (var mi = 0; mi < td.minds.length; mi++) {
    mindsHtml += '<div class="rp-mind"><p class="mh" data-n="0' + (mi + 1) + '">' + esc(td.minds[mi].h) + '</p><p>' + esc(td.minds[mi].t) + '</p></div>';
  }
  var exitsHtml = "";
  for (var ex = 0; ex < 3; ex++) {
    if (!exits[ex]) continue;
    var reason = buildExitReason(prof, exits[ex], ex);
    exitsHtml += '<div class="rp-exit' + (ex === 0 ? " first" : "") + '">' +
      '<span class="rk">' + (ex === 0 ? "BEST MATCH" : (ex + 1) + "位") + '</span>' +
      '<div><p class="en">' + esc(exits[ex]) + '</p>' + (reason ? '<p class="why">' + esc(reason) + '</p>' : '') + '</div></div>';
  }
  var road = buildRoadmap(prof);
  var roadHtml = "";
  for (var rd = 0; rd < road.length; rd++) {
    roadHtml += '<div class="rp-rstep"><span class="rm">' + road[rd].m + '</span>' +
      '<p class="rh">' + esc(road[rd].h) + '</p><p>' + esc(road[rd].t) + '</p></div>';
  }
  var closingHtml = buildClosing(name, prof);

  var dateStr = String(r[0] || "").split(" ")[0];
  var msg = buildMessage(name, lv, stage, typeName, td, S, exits, ans);
  var nmShort = esc(name) + 'さん｜' + esc(typeName);

  /* ---------- 1枚目：表紙＋総合診断 ---------- */
  var page1 =
    '<div class="a4 on-navy">' +
    '<div class="cv-head bp">' +
      '<div class="cv-toprow"><span class="cv-brand">LEVANCE｜AI CAREER DIAGNOSIS</span>' +
      '<span class="cv-date">診断日 ' + esc(dateStr) + '</span></div>' +
      '<p class="cv-sub">4タイプ別 AIレベル＆キャリアタイプ診断｜結果レポート</p>' +
      '<p class="cv-name">' + esc(name) + '<span>さん</span></p>' +
      '<div class="cv-main">' +
        '<div class="cv-ring">' + ringSVG(lv) +
          '<div class="cv-ring-c"><span class="p">LEVEL</span><span class="n">' + lv + '</span><span class="d">of 5</span></div></div>' +
        '<div class="cv-lvtext"><p class="l">あなたのAIレベル</p><p class="s">' + esc(stage) + '</p>' +
        '<span class="cv-phase">' + esc(phase) + '</span></div>' +
      '</div>' +
      '<div class="cv-typebar"><span class="lb">YOUR TYPE</span><p class="tn">' + esc(typeName) + '</p>' +
      '<p class="tt">' + esc(td.tag) + '</p></div>' +
    '</div>' +
    '<div class="cv-body">' +
      '<p class="rp-k">DIAGNOSIS MESSAGE</p><p class="rp-h">' + esc(name) + 'さんへの総合診断</p>' +
      '<div class="rp-msg">' + msg.top + '</div>' +
    '</div>' +
    '<span class="pgnum">LEVANCE AI CAREER REPORT｜1 / 4</span>' +
    '</div>';

  /* ---------- 2枚目：6つの力＋総合診断つづき＋出口 ---------- */
  var page2 =
    '<div class="a4">' +
    '<div class="pg-head"><p class="t"><span>SKILL BALANCE</span>6つの力と、これから</p>' +
    '<span class="nm">' + nmShort + '</span></div>' +
    '<div class="pg-body">' +
      '<div class="rp-radarwrap">' + radarSVG(S) + '</div>' +
      '<div class="rp-focus">' + buildAxisReading(prof, stackWeak) + '</div>' +
      '<div class="rp-msg cont">' + msg.rest + '</div>' +
      '<div class="rp-sec" style="margin-top:10px"><p class="rp-k">CAREER EXITS</p><p class="rp-h">狙いやすい出口 トップ3</p>' + exitsHtml + '</div>' +
    '</div>' +
    '<span class="pgnum">LEVANCE AI CAREER REPORT｜2 / 4</span>' +
    '</div>';

  /* ---------- 3枚目：タイプ ---------- */
  var page3 =
    '<div class="a4">' +
    '<div class="pg-head"><p class="t"><span>YOUR TYPE</span>あなたのキャリアタイプ</p>' +
    '<span class="nm">' + nmShort + '</span></div>' +
    '<div class="pg-body">' +
      '<p class="tp-name">' + esc(typeName) + '</p><p class="tp-tag">' + esc(td.tag) + '</p>' +
      '<div class="rp-sec"><p class="rp-k">STRENGTHS</p><p class="rp-h">このタイプの強み</p>' +
      '<ul class="rp-list">' + strengthsHtml + '</ul></div>' +
      '<div class="rp-sec"><p class="rp-k">IN YOUR CASE</p><p class="rp-h">' + esc(name) + 'さんの場合、こう出やすい</p>' +
      '<ul class="rp-list">' + stumblesHtml + '</ul></div>' +
      '<div class="rp-sec"><p class="rp-k">MINDSET</p><p class="rp-h">いま必要な考え方</p>' + mindsHtml + '</div>' +
    '</div>' +
    '<span class="pgnum">LEVANCE AI CAREER REPORT｜3 / 4</span>' +
    '</div>';

  /* ---------- 4枚目：道筋とご案内 ---------- */
  var page4 =
    '<div class="a4 on-navy">' +
    '<div class="pg-head"><p class="t"><span>NEXT 90 DAYS</span>これからの道筋</p>' +
    '<span class="nm">' + nmShort + '</span></div>' +
    '<div class="pg-body">' +
      '<div class="rp-sec"><p class="rp-k">90 DAYS ROADMAP</p><p class="rp-h">最初の90日で「語れる実績」を1本作る</p>' +
      roadHtml +
      '<div class="rp-roadextra">' + esc(td.road) + '</div>' +
      '<div class="rp-closing"><span class="ck">LAST WORDS</span>' + closingHtml + '</div></div>' +
    '</div>' +
    '<div class="rp-cta bp"><div class="rp-cta-in">' +
      '<p class="ck">NEXT STEP｜' + esc(name) + 'さんへのご案内</p>' +
      '<p class="ch">あなたの業務・環境に基づいた<span>「進め方」</span>を、<br>一緒に設計する体験セッションをご用意しています。</p>' +
      '<p class="cp">このレポートでお渡しできるのは、共通の地図までです。実際の業務内容・職場環境・使える時間に基づいて、どこを目指し、まず何から始めればいいか。その方向づけを行う<b>AI特化・個別キャリアコーチングの体験セッション</b>を、1回無料でご用意しています。</p>' +
      '<p class="rp-cta-meta">約60〜90分｜オンライン（Zoom）｜マンツーマン｜<span>体験1回・無料</span></p>' +
      '<p class="rp-cta-cap">※専任コーチの稼働枠に限りがあるため、定員に達し次第、受付を終了いたします。</p>' +
      '<p class="rp-cta-link">お申し込み・詳細：<a href="' + CONSULT_URL + '">' + CONSULT_URL + '</a>（公式LINEからもご案内しています）</p>' +
      '<p class="dis">※本レポートの内容は現時点での目安であり、成果を保証するものではありません。｜レバンス（LEVANCE）</p>' +
    '</div></div>' +
    '<span class="pgnum">LEVANCE AI CAREER REPORT｜4 / 4</span>' +
    '</div>';

  document.getElementById("pages").innerHTML = page1 + page2 + page3 + page4;

  document.title = (name && name !== "（未入力）")
    ? "レバンス_AI診断レポート_" + name + "様"
    : "レバンス_AI診断レポート";
  show("adminBar", false);
  show("listCard", false);
  show("reportView", true);
  location.hash = "row=" + rowNum;
  window.scrollTo(0, 0);
}

document.getElementById("backBtn").addEventListener("click", function(){
  show("reportView", false);
  show("adminBar", true);
  show("listCard", true);
  document.title = "診断レポート管理｜LEVANCE";
  if (history.replaceState) history.replaceState(null, "", location.pathname);
});
document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
document.getElementById("reloadBtn").addEventListener("click", loadRows);
document.getElementById("keySubmit").addEventListener("click", function(){
  var k = document.getElementById("keyInput").value.trim();
  if (!k) return;
  setKey(k);
  document.getElementById("keyErr").style.display = "none";
  show("keyBox", false);
  loadRows();
});
document.getElementById("keyInput") && document.getElementById("keyInput").addEventListener("keydown", function(e){
  if (e.key === "Enter") document.getElementById("keySubmit").click();
});

/* 初期化 */
if (getKey()) {
  loadRows();
} else {
  show("keyBox", true);
}
</script>
</body>
</html>
