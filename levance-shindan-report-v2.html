<!doctype html>
<!-- 最終更新 2026.9.9 -->
<!-- 2026-09-08 レポート本文を本人の回答から生成する「言い当て」型に刷新（KEYWORDS／5段落の総合診断／6つの力の読み解き／出口ごとの理由／あなたの場合こう出やすい／本人向け90日／LAST WORDS） -->
<!-- 4タイプ別 AIレベル＆キャリアタイプ診断（旧v2）レポート管理ページ（運営専用・非公開運用） -->
<!-- 正本。公開は repo saori421/ai-career-shindan に levance-shindan-report-v2.html としてコピーしてpush（2026-09-08〜。v3公開に伴い退避） -->
<!-- 旧診断v2（〜2026-09-07）の回答＝記録シートのタブ「シート1」専用。旧Chatwork通知のリンク #row= はこのページで開く。現行v3は levance-shindan-report -->
<!-- 診断ページからはリンクしない。データ表示には合言葉キー（Worker側REPORT_KEY）が必要 -->
<!-- 2026-09-09 スマホ閲覧前提へ全面調整：本文を約1.75倍（17→29.8px。A4を390px幅で見ると約0.49倍に縮むため実質14.6px相当を確保）
     ／ページを縦長（794×1400px）にして全7枚に集約／挿絵は入れない（文字と図解のみ）
     ／ネガティブな決めつけを排除、未来は断定、ネガは主語を大きく（「このタイプの方は」）
     ／6軸のスコア数値表示は廃止（0.0が欠如の宣告に見えるため）／差し色にブランドのオレンジ -->
<!-- 構成（7枚）
     1 表紙＝レベル・タイプ・KEYWORDS＋総合診断 / 2 強みと伸びしろ / 3 6つの力（レーダー＋バー＋読み解き）
     4 狙えるキャリアの出口＋タイプの強み / 5 あなたの場合＋いま必要な考え方
     6 90日ロードマップ＋締めの言葉 / 7 ご案内
     ※1セクション＝1ページ。溢れた場合のみ shrinkToFit が該当ページの中身を縮めて収める
     ※レイアウト確定後(rAF×2)に測る。DOM構築直後は高さが未確定で誤判定する -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>診断レポート管理｜LEVANCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1D3A; --navy2:#143A6B; --navy3:#1D4E8F;
  --gold:#C9A24B; --gold-soft:#E3D3A8; --gold-deep:#B08A2E;
  --orange:#E8731E; --orange-soft:#F5A45E; --orange-deep:#C25A0F;
  --ink:#1C2733; --sub:#5B6B7B; --line:#E6EBF2; --bg:#EEF1F5;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7;font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 60px}

/* ---------- 管理UI ---------- */
.adminbar{
  background:linear-gradient(150deg,var(--navy),var(--navy2));color:#fff;
  border-radius:12px;padding:20px 22px;margin-bottom:18px;
}
.adminbar .b{font-size:10px;letter-spacing:.24em;color:var(--gold-soft);font-weight:700}
.adminbar h1{font-size:18px;font-weight:900;margin-top:4px}
.adminbar p{font-size:12px;color:#C6D2E2;margin-top:4px}
.keybox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.keybox label{font-size:13px;font-weight:700;color:var(--navy);display:block;margin-bottom:8px}
.keybox input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:15px;font-family:inherit}
.keybox button{margin-top:10px;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:11px 24px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.keybox .err{color:#C0392B;font-size:12.5px;margin-top:8px}
.listcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.listhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.listhead b{font-size:14px;color:var(--navy)}
.listhead button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--sub);font-size:12px;padding:6px 14px;cursor:pointer;font-family:inherit}
.rowitem{display:flex;gap:12px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rowitem:last-child{border-bottom:none}
.rowitem .d{font-size:11.5px;color:var(--sub);flex:0 0 118px}
.rowitem .nm{font-size:14px;font-weight:900;color:var(--navy);flex:1;min-width:100px}
.rowitem .meta{font-size:11.5px;color:var(--sub)}
.rowitem .lvchip{font-size:11px;font-weight:700;color:var(--gold-deep);border:1px solid var(--gold);border-radius:4px;padding:1px 8px}
.rowitem a{
  margin-left:auto;background:var(--navy);color:#fff;text-decoration:none;
  font-size:12px;font-weight:700;border-radius:6px;padding:8px 16px;border:1px solid var(--gold);
}
.loading{padding:30px;text-align:center;color:var(--sub);font-size:13px}

/* ---------- レポート画面 ---------- */
#reportView{display:none}
.report-actions{max-width:794px;margin:0 auto 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.report-actions button{
  border-radius:8px;padding:11px 22px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
}
#printBtn{background:#FF7A00;color:#fff;border:1px solid var(--gold)}
#backBtn{background:#fff;color:var(--sub);border:1px solid var(--line)}
.report-actions .hint{font-size:11.5px;color:var(--sub)}

/* A4本体（794×1123px ≒ A4 96dpi）×4枚・スマホ閲覧前提の大きめ文字 */
.a4{
  width:794px;height:1400px;margin:0 auto 26px;background:#fff;position:relative;
  box-shadow:0 10px 40px rgba(11,29,58,.18);overflow:hidden;
  display:flex;flex-direction:column;
}
.a4 *{line-height:1.65}
.pgnum{position:absolute;right:36px;bottom:12px;font-size:14px;color:#9AA7B6;letter-spacing:.1em;z-index:5}
.on-navy .pgnum{color:#8FA0B8}
/* ご案内の帯が下端に来るページは、ページ番号が濃紺に乗るので明るくする */
.a4:has(.rp-cta) .pgnum{color:#8FA0B8}

.bp{position:relative;overflow:hidden}
.bp::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 46px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 46px);
}
.bp > *{position:relative;z-index:2}

/* ----- 1枚目（表紙＋総合診断） ----- */
.cv-head{
  background:linear-gradient(150deg,var(--navy) 0%,var(--navy2) 100%);
  color:#fff;padding:30px 34px 28px;flex:0 0 auto;
}
.cv-toprow{display:flex;justify-content:space-between;align-items:center}
.cv-brand{font-size:16.6px;letter-spacing:.26em;color:var(--gold-soft);font-weight:500;border:1px solid rgba(201,162,75,.55);padding:6px 16px;border-radius:2px}
.cv-date{font-size:16.6px;color:#A9B7CB;letter-spacing:.06em}
.cv-sub{font-size:18px;color:#C6D2E2;margin-top:14px;letter-spacing:.03em}
.cv-name{font-size:45.4px;font-weight:900;margin-top:2px;line-height:1.3}
.cv-name span{font-size:25.8px;font-weight:700;color:#C6D2E2;margin-left:8px}
.cv-lvbox{margin-top:18px}
.cv-lvbox .l{font-size:18px;color:#A9B7CB;letter-spacing:.08em}
.cv-lvbox .s{font-size:36.1px;font-weight:900;margin-top:2px;line-height:1.25}
.cv-lvbox .s em{display:inline-block;font-style:normal;font-size:18px;font-weight:700;color:var(--gold-soft);margin-left:14px;vertical-align:middle}
.cv-ring{position:relative;width:184px;height:184px;flex:0 0 184px}
.cv-ring svg{transform:rotate(-90deg)}
.cv-ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cv-ring-c .p{font-size:14px;letter-spacing:.26em;color:var(--gold-soft);font-weight:700}
.cv-ring-c .n{font-size:52.1px;font-weight:900}
.cv-ring-c .d{font-size:15.3px;color:#A9B7CB}
.cv-lvtext .l{font-size:20.1px;color:#A9B7CB;letter-spacing:.08em}
.cv-lvtext .s{font-size:38.1px;font-weight:900;margin-top:2px}
.lv-steps{display:flex;align-items:center;margin-top:18px}
.lv-steps .st{
  width:44px;height:44px;border-radius:50%;flex:0 0 44px;
  border:2px solid rgba(201,162,75,.45);background:rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;
}
.lv-steps .st i{font-style:normal;font-size:16.4px;font-weight:900;color:#8FA0B8}
.lv-steps .st.on{background:var(--orange);border-color:var(--orange)}
.lv-steps .st.on i{color:#fff}
.lv-steps .ln{flex:1 1 auto;height:4px;background:rgba(201,162,75,.25)}
.lv-steps .ln.on{background:var(--orange)}
.cv-phase{display:inline-block;margin-top:10px;font-size:16.6px;font-weight:700;letter-spacing:.06em;color:var(--gold-soft);border:1px solid rgba(201,162,75,.55);border-radius:4px;padding:5px 13px}
.cv-typebar{
  margin-top:20px;background:rgba(255,255,255,.07);border:1px solid rgba(201,162,75,.45);
  border-radius:12px;padding:12px 20px;
}
.cv-typebar .lb{font-size:14.6px;letter-spacing:.24em;color:var(--gold-soft);font-weight:700}
.cv-typebar .tn{font-size:33.2px;font-weight:900;margin-top:1px}
.cv-typebar .tt{font-size:20.8px;color:#C6D2E2;margin-top:1px}
.cv-body{padding:18px 34px 56px;flex:1 1 auto;min-height:0}

/* 表紙：あなたを表す3つの言葉 */
.cv-kw{margin-top:20px}
.cv-kw .lb{font-size:15.6px;letter-spacing:.24em;color:var(--gold-soft);font-weight:700;margin-bottom:8px}
.cv-kw ul{list-style:none}
.cv-kw li{
  font-size:23.8px;font-weight:900;color:#fff;line-height:1.45;
  padding:7px 0 7px 32px;position:relative;
}
.cv-kw li::before{
  content:"";position:absolute;left:0;top:20px;width:12px;height:12px;
  border:3px solid var(--gold);border-radius:50%;
}

.rp-k{font-size:16.6px;letter-spacing:.2em;color:var(--gold-deep);font-weight:700;margin-bottom:5px}
.rp-h{font-size:27.1px;font-weight:900;color:var(--navy);border-left:6px solid var(--gold);padding-left:16px;margin-bottom:16px;line-height:1.45}
.rp-msg{
  border:1px solid var(--gold-soft);border-radius:12px;background:#FDFBF5;
  padding:20px 24px;
}
.rp-msg p{font-size:24.4px;line-height:1.72;color:#26313E;margin-bottom:16px}
.rp-msg.cont{margin-top:0;padding:20px 24px}
.rp-msg.cont p{font-size:23px;line-height:1.72;margin-bottom:16px}
.rp-msg p:last-child{margin-bottom:0}
.rp-msg b{color:var(--navy)}
.rp-msg .gold{color:var(--orange-deep);font-weight:700}
/* 中面の段落。表紙のリード文だけ枠で見せ、本文ページは枠なしで詰める */
.rp-para{font-size:24.4px;line-height:1.72;color:#26313E}
.rp-para b{color:var(--navy)}
.rp-para .gold{color:var(--orange-deep);font-weight:700}

/* ----- 2〜4枚目共通ヘッダー ----- */
.pg-head{
  background:linear-gradient(150deg,var(--navy) 0%,var(--navy2) 100%);
  color:#fff;padding:16px 34px 18px;flex:0 0 auto;
}
.pg-head .t{font-size:27.2px;font-weight:900;display:block;line-height:1.35}
.pg-head .t span{color:var(--gold-soft);font-size:15.3px;letter-spacing:.22em;display:block;font-weight:700;margin-bottom:2px}
.pg-head .nm{font-size:16.4px;color:#AEBFD4;display:block;margin-bottom:6px;letter-spacing:.02em}
.pg-body{position:relative;padding:24px 34px 56px;flex:1 1 auto;min-height:0;overflow:hidden}
.pg-inner{transform-origin:top left}
.rp-sec{margin-bottom:22px}
.pg-fig{margin-top:30px;padding:0 12px}
.pg-fig svg{display:block;width:100%;max-width:580px;height:auto;margin:0 auto}
.rp-sec2{margin-top:34px;padding-top:26px;border-top:1px solid var(--line)}

/* 2枚目：スキルバランス */
.rp-radarwrap{text-align:center;margin:-8px 0 0}
.rp-bars{margin-top:6px}
.rp-bars .br{display:flex;align-items:center;gap:18px;padding:7px 0}
.rp-bars .bn{flex:0 0 190px;font-size:20.5px;font-weight:700;color:var(--navy)}
.rp-bars .bt{flex:1;height:20px;background:#EDF1F6;border-radius:10px;overflow:hidden}
.rp-bars .bt i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),var(--navy3));border-radius:10px}
.rp-bars .br.weak .bt i{background:linear-gradient(90deg,var(--orange-deep),var(--orange-soft))}
.rp-bars .br.weak .bn{color:var(--orange-deep)}
.rp-bars .bv{flex:0 0 46px;text-align:right;font-size:23px;font-weight:900;color:var(--navy)}
.rp-focus{border:1px solid var(--gold-soft);background:#FCF9F0;border-radius:12px;padding:20px 24px;font-size:22.2px;line-height:1.7;margin-top:10px}
.rp-focus b{color:var(--navy)}

/* 3枚目：タイプ */
.tp-name{font-size:38.1px;font-weight:900;color:var(--navy);line-height:1.4}
.tp-tag{font-size:21.5px;color:var(--sub);margin-top:2px;margin-bottom:10px}
.rp-list{list-style:none}
.rp-list li{position:relative;padding:9px 0 9px 34px;font-size:23.7px;line-height:1.6}
.rp-list li::before{content:"";position:absolute;left:2px;top:24px;width:12px;height:12px;border:3px solid var(--gold);border-radius:50%}
.rp-mind{border:1px solid var(--line);border-radius:12px;padding:16px 22px;margin-bottom:12px;background:#FBFCFE}
.rp-mind .mh{font-size:25.1px;font-weight:900;color:var(--navy);line-height:1.5}
.rp-mind .mh::before{content:attr(data-n);color:var(--gold-deep);font-size:16.6px;margin-right:9px;letter-spacing:.08em}
.rp-mind p{font-size:22.2px;color:#3D4B5C;margin-top:3px;line-height:1.65}

/* 4枚目：出口・90日・CTA */
.rp-exit{
  border:1px solid var(--line);border-radius:12px;padding:16px 20px;background:#FBFCFE;
  margin-bottom:14px;display:flex;align-items:center;gap:16px;
}
.rp-exit.first{border:2px solid var(--orange);background:#FFF8F1}
.rp-exit .rk{flex:0 0 auto;font-size:15.3px;font-weight:900;letter-spacing:.05em;color:var(--navy2);border:1px solid var(--navy2);border-radius:4px;padding:3px 10px}
.rp-exit.first .rk{background:var(--orange);color:#fff;border-color:var(--orange)}
.rp-exit .en{font-size:25.8px;font-weight:900;color:var(--navy);line-height:1.45}
.rp-exit .why{font-size:20.8px;color:#3D4B5C;line-height:1.45;margin-top:1px}
.rp-msg .kw{font-size:22.2px;color:var(--navy);font-weight:700;margin-bottom:18px;padding-bottom:14px;border-bottom:1px dashed var(--gold-soft);line-height:1.6}
.rp-msg .kw span{font-size:14px;letter-spacing:.22em;color:var(--gold-deep);margin-right:10px}
.rp-closing{margin-top:18px;border-left:6px solid var(--gold);background:#FCF9F0;padding:20px 24px;font-size:23.7px;line-height:1.68;color:var(--navy);font-weight:700}
.rp-closing .ck{display:block;font-size:14px;letter-spacing:.24em;color:var(--gold-deep);font-weight:700;margin-bottom:4px}
.rp-rstep{position:relative;border:1px solid var(--line);border-radius:12px;padding:16px 22px 16px 26px;background:#FBFCFE;margin-bottom:30px}
.rp-rstep::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:6px;background:var(--orange);border-radius:0 4px 4px 0}
/* 矢印はステップ同士のあいだにだけ出す（最後のステップの下は締めの文なので出さない） */
.rp-rstep:has(+ .rp-rstep)::after{
  content:"";position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);
  width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;
  border-top:14px solid var(--orange-soft);
}
.rp-rstep .rm{font-size:15.9px;letter-spacing:.16em;color:var(--orange-deep);font-weight:700}
.rp-rstep .rh{font-size:27.2px;font-weight:900;color:var(--navy);margin-top:2px;line-height:1.5}
.rp-rstep p{font-size:22.7px;color:#3D4B5C;margin-top:3px;line-height:1.6}
.rp-roadextra{margin-top:10px;background:#F2F6FB;border-radius:10px;padding:18px 24px;font-size:22.2px;color:#33455C;line-height:1.65}

/* ご案内は1ページ使わず、最終ページの下端に帯として置く */
.pg-inner:has(> .rp-cta){display:flex;flex-direction:column;min-height:100%}
.pg-inner > .rp-cta{margin:26px -34px -56px;border-radius:0}
.rp-cta{
  position:relative;margin-top:auto;flex:0 0 auto;
  background:linear-gradient(150deg,var(--navy) 0%,#123D63 100%);color:#fff;
  padding:18px 34px 16px;overflow:hidden;
}
.rp-cta-in{position:relative;z-index:2}
.rp-cta .ck{font-size:15px;letter-spacing:.24em;color:var(--gold-soft);font-weight:700}
.rp-cta .ch{font-size:23px;font-weight:900;margin-top:3px;line-height:1.45}
.rp-cta .ch span{color:var(--gold-soft)}
.rp-cta .cp{font-size:18.5px;color:#DCE4EF;margin-top:6px;line-height:1.6}
.rp-cta .cp b{color:#fff}
.rp-cta-meta{margin-top:8px;font-size:19px;color:#E4EAF3;font-weight:700}
.rp-cta-meta span{color:var(--gold-soft)}
.rp-cta-link{margin-top:5px;font-size:17.5px;color:#DCE4EF}
.rp-cta-link a{color:var(--gold-soft);font-weight:700;text-decoration:none}
.rp-cta .dis{font-size:11.5px;color:#8FA0B8;margin-top:7px;border-top:1px solid rgba(255,255,255,.14);padding-top:5px;line-height:1.5}

/* ---------- 印刷 ---------- */
@media print{
  @page{size:210mm 370mm;margin:0}
  body{background:#fff}
  .noprint{display:none !important}
  .wrap{max-width:none;padding:0}
  .a4{width:210mm;height:370mm;box-shadow:none;margin:0;transform:none !important;page-break-after:always}
  .a4:last-child{page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media screen and (max-width:820px){
  .a4{transform-origin:top left;transform:scale(0.44);margin-bottom:-600px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="adminbar noprint" id="adminBar">
    <span class="b">LEVANCE｜ADMIN</span>
    <h1>診断レポート管理（v2・旧診断）</h1>
    <p>2026年9月7日までの旧診断（AIレベル＆キャリアタイプ診断v2）を受けた方の一覧です。レポートを開き、「PDFとして保存」でA4・4枚のレポートを出力できます。このページは運営専用です。<br>現行の診断（v3）を受けた方の一覧は <a href="levance-shindan-report" style="color:#E3D3A8;font-weight:700">診断レポート管理（v3）</a> へ。</p>
  </div>

  <div class="keybox noprint" id="keyBox" style="display:none">
    <label for="keyInput">アクセスキーを入力してください（初回のみ・この端末に保存されます）</label>
    <input type="password" id="keyInput" placeholder="アクセスキー" autocomplete="off">
    <button type="button" id="keySubmit">表示する</button>
    <p class="err" id="keyErr" style="display:none">キーが違うようです。もう一度確認してください。</p>
  </div>

  <div class="listcard noprint" id="listCard" style="display:none">
    <div class="listhead"><b>回答一覧（新しい順）</b><button type="button" id="reloadBtn">再読み込み</button></div>
    <div id="listBody"><div class="loading">読み込み中...</div></div>
  </div>

  <div id="reportView">
    <div class="report-actions noprint">

function ringSVG(lv){
  var R = 78, SW = 10, SZ = 184, CT = SZ / 2;
  var C = 2 * Math.PI * R;
  var off = C * (1 - lv / 5);
  return '<svg width="' + SZ + '" height="' + SZ + '" viewBox="0 0 ' + SZ + ' ' + SZ + '">' +
    '<circle cx="' + CT + '" cy="' + CT + '" r="' + R + '" fill="none" stroke="rgba(201,162,75,.22)" stroke-width="' + SW + '"/>' +

    'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg>';
}

function levelStepsHTML(lv){
  var h = '<div class="lv-steps">';
  for (var i = 1; i <= 5; i++){
    h += '<span class="st' + (i <= lv ? " on" : "") + '"><i>' + i + '</i></span>';
    if (i < 5) h += '<span class="ln' + (i < lv ? " on" : "") + '"></span>';
  }
  return h + '</div>';
}

function radarSVG(S){
  var cx = 320, cy = 200, R = 140, n = 6;
  var weak = 0;
  for (var w = 1; w < n; w++) if (S[w] < S[weak]) weak = w;
  function pt(idx, val){
    var ang = -Math.PI / 2 + idx * 2 * Math.PI / n;
    var rr = R * val / 4;
    return [cx + rr * Math.cos(ang), cy + rr * Math.sin(ang)];
  }
  var svg = '<svg width="392" height="245" viewBox="0 0 640 400" style="max-width:100%">';
  for (var ring = 1; ring <= 4; ring++) {
    var pts = [];
    for (var i = 0; i < n; i++) pts.push(pt(i, ring).join(","));
    svg += '<polygon points="' + pts.join(" ") + '" fill="none" stroke="#C9A24B" stroke-opacity="' + (ring === 4 ? 0.6 : 0.22) + '" stroke-width="' + (ring === 4 ? 1.6 : 1.1) + '"/>';
  }
  for (var a = 0; a < n; a++) {
    var p = pt(a, 4);
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="#C9A24B" stroke-opacity="0.22" stroke-width="1.1"/>';
  }
  var poly = [];
  for (var v = 0; v < n; v++) poly.push(pt(v, Math.max(0.25, S[v])).join(","));
  svg += '<polygon points="' + poly.join(" ") + '" fill="rgba(20,58,107,.2)" stroke="#143A6B" stroke-width="3" stroke-linejoin="round"/>';
  for (var d = 0; d < n; d++) {
    var dp = pt(d, Math.max(0.25, S[d]));
    svg += '<circle cx="' + dp[0] + '" cy="' + dp[1] + '" r="6" fill="#fff" stroke="#C9A24B" stroke-width="2.5"/>';
  }
  for (var l = 0; l < n; l++) {
    var lp = pt(l, 5.05);
    var anchor = "middle";
    if (lp[0] < cx - 50) anchor = "end";
    if (lp[0] > cx + 50) anchor = "start";
    svg += '<text x="' + lp[0] + '" y="' + (lp[1] + 7) + '" text-anchor="' + anchor + '" font-size="20" font-weight="700" fill="' + (l === weak ? "#B08A2E" : "#1C2733") + '">' + AXES[l] + '</text>';
  }
  svg += '</svg>';
  return svg;
}

  "個人の時短で終わらせず、業務の流れに組み込めている。ここまで来ている人は多くない",
  "自分の業務の外に半歩出て、周囲を動かせている。これはAIスキルではなく信頼の力",
  "成果を「どの業務をどれくらい変えたか」の言葉にできる。評価と単価を動かすのはこの力",
  "続けられる環境と時間の設計ができている。伸びる人は、意志ではなく環境で続けている"
];
var AX_MEAN_LOW = [
  "業務を分解して言葉にする工程。ここが加わると、AIの出力が安定して「使える」が「成果」に変わります",
  "AIに触れる頻度。学習からではなく、毎日の業務の1作業から始めると、いちばん早く上がります",
  "個人の時短を業務フローに組み込む力。「作業が速くなった」の一歩先に、実績になる領域があります",
  "自分の業務の外に半歩出る力。やり方を周りに渡した経験が加わると、評価される範囲が一段広がります",
  "成果を評価の言葉に変換する力。ここが加わると、同じ成果が評価と単価を動かし始めます",
  "続けられる環境の力。相談できる相手が1人いるだけで、遠回りが消えます"
];

/* あなたを表す3つの言葉（前向きな言い当て） */
function buildKeywords(p){
  var kw = [];
  if (p.evalNext || p.evalSame) kw.push("成果を言葉にすれば、評価が動く人");
  else if (p.evalRelied) kw.push("周りが先に気づき始めている人");
  else if (p.evalMoved) kw.push("すでに評価が動き始めた人");
  else if (p.aiFar || p.aiSome) kw.push("これから伸びしろが大きい人");
  else kw.push("実績1本で景色が変わる人");
  if (p.wantPrep || p.lifeNo || p.life10) kw.push("先を読んで、備えられる人");
  else if (p.wantValue || (p.hopeOuter && (p.outNo || p.outVague))) kw.push("外に見せる1本で、道が開く人");
  else if (p.wantTime) kw.push("時間の使い方を変えたい人");
  else if (p.wantEnv) kw.push("環境に左右されない手札を持ちたい人");
  else if (p.wantEval) kw.push("評価と役割を、取りにいく人");
  else kw.push("目指す姿が見えている人");
  if (p.alone || p.web) kw.push("独学でここまで来た人");
  else if (p.t15) kw.push("短い時間を、積み上げられる人");
  else if (p.roleAssigned || p.roleWill) kw.push("組織を動かす側に立つ人");
  else if (p.askGoal || p.askDesign) kw.push("仕事を設計できる人");
  else if (p.mentor) kw.push("相談できる環境を持っている人");
  else kw.push("順番が決まれば速い人");
  return kw.slice(0, 3);
}

/* 1枚目：総合診断（5段落） */
function buildMessage(name, lv, stage, typeName, td, S, exits, ans){
  var p = buildProfile(ans, S, lv, typeName);
  var n = "<b>" + esc(name) + "さん</b>";

  /* P1 現在地の言い当て（事実の反射） */
  var where = "";
  if (p.freelance) where = "会社に属さず働く";
  else if (p.jobLabel && p.posLabel) where = p.jobLabel + "の現場で、" + p.posLabel + "という立場で働く";
  else if (p.jobLabel) where = p.jobLabel + "の現場で働く";
  else if (p.posLabel) where = p.posLabel + "という立場で働く";
  var ai = p.aiFar ? "AIはこれから本格的に使っていく段階"
         : p.aiSome ? "AIは調べ物や文章づくりで、たまに使う程度"
         : p.aiDaily ? "AIは資料作成や壁打ちで日常的に使っている"
         : p.aiFlow ? "AIをすでに業務の一部のフローに組み込んでいる"
         : p.aiAuto ? "自動化・仕組み化まで自分で作り込んでいる" : "AIと日々向き合っている";
  var change = p.noChange ? "目に見える変化が出てくるのは、ちょうどここから"
             : p.faster ? "自分の作業が少し速くなった手応えが出てきている"
             : p.quality ? "成果物の質が上がった実感も出てきている"
             : p.flowDone ? "業務フローを1つ改善するところまで来ている"
             : p.teamDone ? "チーム・部署の業務まで変えている" : "";
  /* 「フローに組み込んでいる」の直後に「フローを1つ改善するところまで来ている」が続くと、
     同じことを2度言っているように読める */
  if ((p.aiFlow || p.aiAuto) && p.flowDone) change = "";
  var emp = EMPATHY_BY_Q5[ans[4]] || "AIとの距離を、これからキャリアの力に変えていく位置にいます。";
  if (p.evalNone && change) emp = "この段階で自分の現在地を確かめている方は、実はそれほど多くありません。ここから90日で、景色は変わります。";
  var p1 = where + n + "。" + ai + "。" + (change ? change + "。" : "") + emp;

  /* P2 いま感じていること（2つの回答の組み合わせを、決めつけずに映す） */
  var p2 = "";
  if (p.hopeOuter && (p.outNo || p.outVague)) {
    p2 = "「" + esc(p.hope) + "」という方向が、すでに見えています。そのうえで「外で通用する力を、まだ言葉にできていない」とも感じている。動く気持ちと、確かめたい気持ち。この2つが同時にあるのは自然なことで、外に見せられる実績が1本あれば、両方が同時に解けます。";
  } else if ((p.evalNext || p.evalSame) && p.wantEval) {
    p2 = "いちばん変えたいのは、評価と役割。AIはすでに使えている。だからこそ、次に必要なのはスキルの上乗せではなく、出している成果を「評価される言葉」に変換する工程です。ここが加わるだけで、同じ仕事が実績に変わり始めます。";
  } else if ((p.lifeNo || p.life10) && p.wantPrep) {
    p2 = "大きな不満があるわけではない。ただ「この働き方を、この先も続けられるか」という問いを持っている。人に話すほどのことではなくても、ふとした瞬間に戻ってくる問いではないでしょうか。この感覚を持てていること自体が、備えられる人の証拠です。";
  } else if (p.wantTime && (p.t15 || p.t60)) {
    p2 = "変えたいのは働き方と時間。使える時間は" + (p.t15 ? "1日15分ほど" : "1日1時間まで") + "。時間がないからこそ、時間の使い方を変えたい。この順番です。まとまった時間を待たずに始められる設計なら、いまの時間のままで前に進めます。";
  } else if (p.wantEnv && p.envLimit) {
    p2 = "変えたいのは環境。会社のAI活用にも制約がある。ただ、制約の中で作った実績は、環境に左右されない自分の手札になります。環境が整うのを待たずに、いまの裁量の範囲で始められることがあります。そこに目が向いている時点で、動き出せる位置にいます。";
  } else if (p.wantValue) {
    p2 = "変えたいのは、自分の市場価値。いまの会社での評価とは別に「外に出たとき、自分は何者か」を確かめたい気持ちがある。" + (p.outUnsorted ? "実績はすでにあります。あとは整理して見せる形にするだけです。" : "その答えは、これから作る実績の中にあります。作れる位置に、すでにいます。");
  } else if (p.lifeNo || p.life10) {
    p2 = "いまの働き方を「ずっと続ける」とは考えていない。目の前の仕事は回っているからこそ、この問いは後回しになりやすい。ただ、こうして診断を受けている時点で、すでに向き合い始めています。その一歩が、いちばん大きい一歩です。";
  } else if (p.wantPrep) {
    p2 = "いま大きく困っているわけではない。ただ「備えておきたい」と感じている。この感覚を持てていること自体が、実は少数派です。多くの人は必要に迫られてから動きます。あなたはその前に動ける位置にいます。";
  } else if (p.roleAssigned || p.roleWill) {
    p2 = (p.roleAssigned ? "AI推進を任される側にいます。" : "自分から推進の旗を振ろうとしている。") +
      "自分がAIを使えることと、組織で成果を出すことは、別の仕事です。その違いに目が向いている方ほど、任せる・判断する・展開するの切り分けが早く身につきます。ここは、後から追いつくのが難しい差になります。";
  } else if (p.year1 && !has(p.year1, "模索")) {
    p2 = "1年後に「" + esc(p.year1) + "」。目指す姿が見えているのは、それだけで前提が整っているということです。あとは、そこへ届く順番を決めるだけです。";
  } else {
    /* 1年後の姿を「まだ模索している」と答えた方に、見えている前提で書くと嘘になる */
    p2 = "1年後にどうなっていたいかは、いま決めきらなくて大丈夫です。方向は、動き出してから見えてくることのほうが多いからです。先に決めるのは目的地ではなく、最初に手をつける業務のほうです。そこさえ決まれば、あとは順番の問題になります。";
  }

  /* P3 本人が気づいていない強み（最も高い軸＋立ち位置） */
  /* 6軸がどれも低い方に「ここが強い」と書くと、事実と食い違う。
     数字が伸びていないことは、伸びしろが手つかずで残っている、と受け止める */
  var p3 = (S[p.top] < 0.8)
    ? "6つの力は、いまはまだどれも数字として大きくは出ていません。これは弱さではなく、伸びしろがそのまま残っているということです。中でも土台になるのが<span class=\"gold\">「" + AXES[p.top] + "」</span>。" + AX_MEAN_LOW[p.top] + "。"
    : "ご自身で思っている以上に強いのは<span class=\"gold\">「" + AXES[p.top] + "」</span>です。" + AX_MEAN_HIGH[p.top] + "。";
  if (p.roleAsked) p3 += "周囲からAIについて聞かれることが増えているのは、その証拠です。周りは思っているより早く「AIならこの人」と見始めています。";
  else if (p.roleAssigned) p3 += "推進を任されている（任されそう）というのは、周りがすでにその力を見ている、ということです。";
  else if (p.askGoal || p.askDesign) p3 += "AIへの頼み方が整理されているのは、AIの技術ではなく仕事の設計力です。ここは、教えても身につきにくい力です。";
  else if (p.leader) p3 += p.posLabel + "という立場で積んできた、仕事の全体を見る目があります。これは、どの業務にAIを当てるかを決めるときにそのまま効きます。";
  else if (p.outUnsorted || p.outYes) p3 += "外でも通用する実績を、すでに持っています。あとは、その見せ方です。";
  /* 独学でここまで来たことは、後ろの「あなたの場合」で触れるので、ここでは繰り返さない */
  else p3 += "ここを土台にすれば、次の力は積み上がります。";

  /* P4 伸びしろ（積み上げ順の2つ）
     直前のP3で挙げた最強軸は候補から外す。同じ軸を「強み」と「伸びしろ」の両方に出すと矛盾して見える */
  var idx = [0,1,2,3,4].filter(function(i){ return i !== p.top; });
  idx.sort(function(a,b){ return S[a] - S[b]; });
  var ax1 = idx[0], ax2 = idx[1];
  /* 伸びしろ自体が「AI活用力」のときに「AIをもっと使えるように、ではない」と書くと自己矛盾になる */
  var lead = (ax1 === 1 || ax2 === 1) ? "次に伸ばすと効くのは、"
           : "次に伸ばすと効くのは、AIを「もっと使えるようになること」ではありません。";
  /* ここで AX_MEAN_LOW を使うと、次ページの「6つの力」の読み解きと同じ文が2度出る。
     軸名だけを挙げ、意味づけはタイプ別の一文（redefine）に任せる */
  var p4 = lead + "<span class=\"gold\">「" + AXES[ax1] + "」</span>と<span class=\"gold\">「" + AXES[ax2] + "」</span>。先に手をつけるのは「" + AXES[ax1] + "」のほうです。" +
    esc(td.redefine) +
    "AIを使える人はこの2年で増えましたが、ここまで踏み込んでいる人は、まだ多くありません。<b>いま手をつけた分が、そのまま差になります。</b>";

  /* P5 90日で動いたとき、最初に変わること */
  var first = p.wantEval ? "評価面談で語れる材料が手元にできること"
            : p.wantTime ? "浮いた時間が、自分のために残るようになること"
            : p.wantValue || p.hopeOuter ? "職務経歴書やプロフィールに書ける1行ができること"
            : p.wantEnv ? "環境に左右されない、自分の手札が1枚増えること"
            : p.wantPrep ? "「これができます」と言える材料が手元にできること"
            : "「何から始めるか」で迷わなくなること";
  var second = p.evalNext ? "浮いた時間の使い道を、自分で決められるようになります"
             : p.evalSame ? "「使えている」が、周りに見える形になります"
             : p.aiFar || p.aiSome ? "AIとの距離が、一気に縮まります"
             : p.alone || p.web ? "調べる時間が、形になる時間に変わります"
             : "次の一手が、自然に見えてきます";
  var p5 = "90日で、語れる実績を1つ作る。そうすると最初に変わるのは、" + first + "です。そしてもう1つ、" + second + "。" +
    (p.lifeNo || p.life10 ? "「この先も続けられるか」という問いに、自分の手で答えを出せるようになります。" : "");
  if (WALL_MSG[p.wall]) p5 += WALL_MSG[p.wall];
  p5 += "<b>語れる実績があるかないかで、選べる道の数は変わります。" + esc(name) + "さんには、それを作れる土台がすでにあります。</b>";

  var kw = buildKeywords(p);
  return {
    kwList: kw,
    paras1: [p1, p2],   /* 表紙 */
    paras2: [p3, p4, p5] /* 2ページ目 */
  };
}

/* 6つの力の読み解き */
function buildAxisReading(p, stackWeak){
  /* 全軸が同点だと top と low が同じ番号になり、
     「最も強いのは設計力／伸ばせる余地が大きいのも設計力」という文になってしまう */
  var low = p.low;
  if (low === p.top){
    low = (p.top + 1) % 6;
    for (var i = 0; i < 6; i++) if (i !== p.top && p.S[i] < p.S[low]) low = i;
  }
  /* 積み上げ順の弱点が「最も強い力」と同じになると、直後の行と矛盾する */
  var focus = stackWeak;
  if (focus === p.top){
    focus = (p.top + 1) % 4;
    for (var k = 0; k < 4; k++) if (k !== p.top && p.S[k] < p.S[focus]) focus = k;
  }
  return "<b>いま最も強いのは「" + AXES[p.top] + "」。</b>" + AX_MEAN_HIGH[p.top] + "。<br>" +
    "<b>これから伸ばせる余地がいちばん大きいのは「" + AXES[low] + "」。</b>" + AX_MEAN_LOW[low] + "。<br>" +
    "<b>FOCUS｜次に積み上げる力：「" + AXES[focus] + "」。</b>AIをキャリアに変える力は、設計力 → AI活用 → 実装 → 巻き込みの順で積み上がります。この順番で積むほど、同じ努力が大きな成果になります。";
}

/* 2枚目：出口ごとの「あなたの場合」 */
function buildExitReason(p, exitName, rank){
  /* 1位でないのに「いちばん近い道」と書くと、上位の出口と矛盾して見える */
  if (exitName === p.hopeExit) return rank === 0 ? "ご希望と一致しています。いちばん近い道です" : "ご希望と一致しています";
  if (has(exitName, "昇進")) return p.evalRelied || p.evalMoved ? "すでに周囲の評価が動いているので、次の評価面談が動かしどころです" : "いまの業務の実績を評価の言葉に変えれば、地続きで狙えます";
  if (has(exitName, "DX")) return p.roleAsked || p.roleAssigned ? "聞かれる・任される立場を、正式なポジションに変える段階です" : "まず「AIならこの人」という認知を社内に作るところからです";
  if (has(exitName, "異動")) return "いまの職種の実績を、移りたい先でも再現できる形にすれば動きます";
  if (has(exitName, "転職")) return p.outUnsorted || p.outYes ? "実績はすでにあります。職務経歴書に書ける形に整えれば、市場価値は一段上がります" : "まず90日で、職務経歴書に書ける実績を作るのが現実的な準備です";
  if (has(exitName, "副業")) return p.sotoYes || p.sotoMoving ? "社外展開を視野に入れている強みが、そのまま活きます" : "本業の実績を、社外の人にも伝わる言葉に変えるところからです";
  if (has(exitName, "フリーランス")) return p.freelance ? "すでに外で働いている方なので、AI実績を値付けの根拠にする段階です" : "まず小さな副業で外の実績を作るのが、現実的な順番です";
  if (has(exitName, "ベンチャー")) return p.manager ? "影響範囲を持つ立場なので、チーム規模の成果が揃えば視野に入ります" : "チーム単位で成果を出した経験が加わると、視野に入ってきます";
  return "";
}

  if (p.wallWhat) c.push({w:7, t:"「何から手をつけるか」さえ決まれば、一気に動ける方です。決め方はシンプルで、いま最も時間を取られている作業から選べば外れません。"});
  if (p.wallProof) c.push({w:6, t:"語れる実績がない、と感じているときは、手元にある改善がまだ数字になっていないだけ、ということがよくあります。まずは1つ、いまかかっている時間を測るところからです。"});
  if (p.evalNext) c.push({w:8, t:"AIで速くなった分、次の仕事が乗ってくる。このタイプの方がいちばん多く通る場面です。浮いた時間の一部を「実績づくり」に確保する設計ができると、同じ忙しさが評価に変わり始めます。"});
  /* askUnknown の項目と内容がほぼ重なるので、両方は出さない */
  if (p.aiFar && !p.askUnknown) c.push({w:6, t:"AIはこれから本格的に使う段階。ここがいちばん伸びしろの大きい位置で、自分の業務を1つ選んで始めれば、最初の1ヶ月で景色が変わります。"});
  if (p.lifeNo || p.life10) c.push({w:5, t:"「この先も続けられるか」という問いを持っている。小さくても外に見せられる実績が1つあると、その問いに自分で答えられるようになります。"});
  if (p.fewPeers) c.push({w:4, t:"聞ける同僚・知人がいます。それに加えて「この順番で合っているか」を確かめられる相手がいると、さらに速くなります。"});
  c.sort(function(a,b){ return b.w - a.w; });
  var out = [];
  for (var i = 0; i < c.length && out.length < 3; i++) out.push(c[i].t);
  while (out.length < 3) out.push(["あれこれ手を広げるより、「どの業務を、どれくらい改善したか」を語れるものを1つ作る方が、結果として遠くまで届きます。","勉強を増やすより、毎日やっている業務にAIを当てる方が、最短で成果になります。","成果は「なんとなく楽になった」で止めず、数字で残す。ここで実績になります。"][out.length]);
  return out;
}

/* 4枚目：本人向けの90日 */
function buildRoadmap(p){
  var jobLabel = p.jobLabel ? p.jobLabel + "の" : "いまの";
  var m1 = jobLabel + "業務の中から、AIで改善しやすいテーマを1つ選びます。" +
    (p.envLimit ? "会社の制約があるので、自分の裁量で完結する業務に限定します。" : "") +
    (p.t15 ? "使える時間が限られる分、対象は小さく絞ります。" : p.t60 ? "1日1時間以内で終わる範囲に絞って進めます。" : "");
  var m2 = (p.askRaw || p.askUnknown ? "まず「目的・条件を整理してから頼む」型を作ります。" : "") +
    "業務の流れを分解し、AIに任せる部分と人が判断する部分を設計し直して、" +
    (p.noChange || p.evalNone ? "小さな変化でも作業時間・品質・量を数字で残します。" : "改善した業務の変化を作業時間・品質・量の数字で棚卸しします。");
  var m3 = has(p.hopeExit, "昇進") ? "評価面談で語れる形に仕上げます。「どの業務を、どれくらい改善したか」が伝わる形です。"
         : has(p.hopeExit, "転職") ? "職務経歴書に書ける形に仕上げます。外の人が読んで再現性が伝わる書き方にします。"
         : has(p.hopeExit, "副業") || has(p.hopeExit, "フリーランス") ? "商談・プロフィールで語れる形に仕上げます。値付けの根拠になる材料にします。"
         : has(p.hopeExit, "DX") ? "社内で提案・共有できる形に仕上げます。チームで再現できる型として残します。"
         : has(p.hopeExit, "異動") ? "異動先でも同じことができる、と示せる形に仕上げます。"
         : "評価面談・職務経歴書・商談のどこでも語れる形に仕上げます。";
  return [
    {m:"MONTH 1", h:"対象業務を1つ決めて、小さく実装する", t:m1},
    {m:"MONTH 2", h:"業務フローを再設計して、変化を記録する", t:m2},
    {m:"MONTH 3", h:"成果を「評価される言葉」に変換する", t:m3}
  ];
}

/* 4枚目：締めの一言（温度感×1年後） */
function buildClosing(name, p){
  var when = p.honkiNow ? "いま動き出せば、年内には" : p.honki3m ? "1〜3ヶ月以内に動き出せば、半年後には"
           : p.honki6m ? "半年以内に動き出すなら、1年後には" : "急ぐ必要はありません。ただ方向だけ先に決めておけば、動きたくなったときに";
  /* 「まだ模索している」と答えた方に「描いた姿」と書くと噛み合わない */
  var hasGoal = p.year1 && !has(p.year1, "模索");
  var goal = hasGoal ? "「" + esc(p.year1) + "」" : "";
  var tail = p.honkiLater ? "迷わず進めます。" : "射程に入ります。";
  /* 「急ぐ必要はありません」と「大きく動かなくていい」を重ねて言わない */
  var mood = p.honkiNow || p.honki3m ? "動き出すなら、勢いのあるいまがいちばんです。"
           : p.honki6m ? "大きく構える必要はありません。最初の1つを決めるところからで十分です。"
           : "";
  return (hasGoal ? esc(name) + "さんが描いた" + goal + "。" : esc(name) + "さんの1年後について。") + when + tail + mood;
}

/* ------------------------------------------------------------------
   自動ページ組み
   1) まずセクション全体を1枚に入れてみる（収まればそれが最良）
   2) 少しだけ溢れるなら、そのページを縮めて1枚に収める
      → ここが効かないと「2段落だけで次ページ送り」になり、余白だらけになる
   3) 大きく溢れるときだけ、ブロック単位で次ページへ送る
------------------------------------------------------------------ */
function renderSections(host, sections, nmShort){
  function addPage(sec, idx){
    var pg = document.createElement("div");
    pg.className = "a4";
    pg.setAttribute("data-sec", idx);
    pg.innerHTML =
      '<div class="pg-head"><span class="nm">' + nmShort + '</span>' +
      '<p class="t"><span>' + sec.kicker + '</span>' + sec.title + '</p></div>' +
      '<div class="pg-body"><div class="pg-inner"></div></div>';
    host.appendChild(pg);
    var body = pg.querySelector(".pg-body");
    var inner = pg.querySelector(".pg-inner");
    var target = inner;
    if (sec.wrap){
      var w = document.createElement("div");
      w.className = sec.wrap;
      inner.appendChild(w);
      target = w;
    }
    return { page: pg, body: body, target: target };
  }

  /* セクションはあらかじめ1ページ分の量に切ってある。
     ここでは分割せず「1セクション＝1ページ」で組み、
     溢れた分だけ後段の reflowOverflow が次ページへ送る。 */
  for (var i = 0; i < sections.length; i++){
    var sec = sections[i];
    if (!sec.blocks || !sec.blocks.length) continue;
    var cur = addPage(sec, i);
    for (var j = 0; j < sec.blocks.length; j++){
      var tmp = document.createElement("div");
      tmp.innerHTML = sec.blocks[j];
      var node = tmp.firstElementChild;
      if (node) cur.target.appendChild(node);
    }
  }
}

/* 外枠(.pg-body)の使える高さと、中身(.pg-inner)の実寸の差。
   zoom は内側の座標系ごと縮むので、外枠に直接かけると clientHeight も一緒に変わり
   いくら縮めても差が埋まらない。必ず「固定の外枠」と「縮む中身」を分けて測る。 */
function gapOf(body){
  var inner = body.querySelector(":scope > .pg-inner");
  if (!inner) return body.clientHeight;
  var cs = getComputedStyle(body);
  var avail = body.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
  /* getBoundingClientRect は親の transform(プレビュー用の縮小表示)を拾ってしまい、
     clientHeight と単位が食い違う。offsetHeight ならレイアウト値なので揃う。 */
  return avail - inner.offsetHeight;
}

/* 溢れたページの末尾ブロックを、同じセクションの次ページへ送る。
   縮小（zoom）で押し込むと本文が小さくなり、スマホで読めなくなる。
   まずページを分けて解決し、それでも収まらないものだけ shrinkToFit に回す。 */
function reflowOverflow(host){
  var guard = 0;
  while (guard++ < 16){
    var pages = host.querySelectorAll(".a4[data-sec]");
    var moved = false;
    for (var i = 0; i < pages.length; i++){
      var pg = pages[i];
      var body = pg.querySelector(".pg-body");
      if (!body || gapOf(body) >= 0) continue;
      var target = pg.querySelector(".pg-inner > .rp-msg") || pg.querySelector(".pg-inner");
      /* ブロックが1つしかないページは、これ以上分けられない */
      if (!target || target.children.length < 2) continue;

      var sec = pg.getAttribute("data-sec");
      var next = pg.nextElementSibling;
      if (!next || next.getAttribute("data-sec") !== sec){
        next = document.createElement("div");
        next.className = "a4";
        next.setAttribute("data-sec", sec);
        next.innerHTML = pg.querySelector(".pg-head").outerHTML +
          '<div class="pg-body"><div class="pg-inner">' +
          (target.className ? '<div class="' + target.className + '"></div>' : "") +
          '</div></div>';
        pg.parentNode.insertBefore(next, pg.nextSibling);
      }
      var nt = next.querySelector(".pg-inner > .rp-msg") || next.querySelector(".pg-inner");
      var node = target.lastElementChild;
      target.removeChild(node);
      nt.insertBefore(node, nt.firstChild);
      moved = true;
      break; /* DOMが変わったので、測り直しから再開する */
    }
    if (!moved) break;
  }
}

/* 単体で1ページに収まらないブロック用の最後の砦 */
/* はみ出したページを、収まるまで少しずつ縮める。
   transform は見た目だけ変えてレイアウトに反映されず、測り直しが噛み合わない。
   zoom はレイアウトごと縮むので、縮めては測り直す方式が確実に効く。 */
function shrinkToFit(body){
  var inner = body.querySelector(":scope > .pg-inner");
  if (!inner) return;
  inner.style.zoom = "";
  if (gapOf(body) >= 0) return;
  var z = 1, guard = 0;
  while (gapOf(body) < 0 && guard < 24){
    z -= 0.02;
    if (z < 0.7) break;
    inner.style.zoom = z.toFixed(3);
    guard++;
  }
}

/* 全ページ確定後に通し番号を振る */
function numberPages(host){
  var pages = host.querySelectorAll(".a4");
  for (var i = 0; i < pages.length; i++){
    var old = pages[i].querySelector(".pgnum");
    if (old) old.parentNode.removeChild(old);
    var s = document.createElement("span");
    s.className = "pgnum";
    s.textContent = "LEVANCE AI CAREER REPORT｜" + (i + 1) + " / " + pages.length;
    pages[i].appendChild(s);
  }
}


/* 残った余白は、ブロックの間隔に均等に散らす。下端だけが空く見え方を避ける */
function spreadGaps(host){
  var pages = host.querySelectorAll(".a4[data-sec]");
  for (var i = 0; i < pages.length; i++){
    var body = pages[i].querySelector(".pg-body");
    var inner = body && body.querySelector(":scope > .pg-inner");
    if (!body || !inner || inner.style.zoom) continue;
    var target = inner.querySelector(":scope > .rp-msg") || inner;
    /* 90日ロードマップは、カード間の矢印が間隔ありきの位置に置かれているので触らない */
    if (target.querySelector(".rp-rstep")) continue;
    var n = target.children.length;
    if (n < 2) continue;
    var room = gapOf(body) - 16;   /* 端まで詰めきらず、少し残す */
    if (room < 60) continue;
    target.style.display = "flex";
    target.style.flexDirection = "column";
    target.style.rowGap = Math.min(room / (n - 1), 88).toFixed(1) + "px";
    /* flex化でマージンの相殺がなくなり、想定より伸びることがある */
    if (gapOf(body) < 0){
      target.style.rowGap = "";
      target.style.display = "";
      target.style.flexDirection = "";
    }
  }
}

function openReport(rowNum){
  /* Webフォント確定後に組む。先に組むとフォールバックの字幅で高さを測ってしまい、
     実際の描画で行が増えてページ下端が切れる。 */
  if (document.fonts && !openReport._fontsReady){
    document.fonts.ready.then(function(){ openReport._fontsReady = true; openReport(rowNum); });
    return;
  }
  var r = rows[rowNum - 1];
  if (!r) { alert("その行のデータが見つかりません（行番号: " + rowNum + "）"); return; }
  var name = r[1] || "（未入力）";
  var lv = parseInt(String(r[2]).replace(/[^0-9]/g, ""), 10) || 1;
  var stage = r[3] || "";
  var phaseObj = PHASES_BY_LV[lv - 1];
  var phase = r[4] || (phaseObj.en + "（" + phaseObj.ja + "）");
  var typeName = r[5] || "";
  var exits = [r[6], r[7], r[8]];
  var S = [];
  for (var i = 0; i < 6; i++) S.push(parseFloat(r[9 + i]) || 0);
  var ans = [];
  for (var q = 0; q < 18; q++) ans.push(r[15 + q] || "");
  var td = TYPE_DATA[typeName] || TYPE_DATA["実務エンジン型"];

  var stackWeak = 0;
  for (var sw = 1; sw < 4; sw++) if (S[sw] < S[stackWeak]) stackWeak = sw;
  var allWeak = 0;
  for (var aw = 1; aw < 6; aw++) if (S[aw] < S[allWeak]) allWeak = aw;

  /* 6軸の棒グラフはレーダーと同じことを2度見せることになるので置かない */
  var prof = buildProfile(ans, S, lv, typeName);

  var strengthsHtml = "";
  for (var st = 0; st < td.strengths.length; st++) strengthsHtml += "<li>" + esc(td.strengths[st]) + "</li>";
  /* 1項目ずつ独立したブロックにしておく。まとめて1つのulにすると、
     溢れたときにページを分けられず、ページごと縮小するしかなくなる */
  var personal = buildPersonalBullets(prof);
  var stumbleBlocks = personal.map(function(t){ return '<ul class="rp-list"><li>' + esc(t) + '</li></ul>'; });

  var mindBlocks = [];
  for (var mi = 0; mi < td.minds.length; mi++) {
    mindBlocks.push('<div class="rp-mind"><p class="mh" data-n="0' + (mi + 1) + '">' + esc(td.minds[mi].h) + '</p><p>' + esc(td.minds[mi].t) + '</p></div>');
  }
  var exitBlocks = [];
  for (var ex = 0; ex < 3; ex++) {
    if (!exits[ex]) continue;
    var reason = buildExitReason(prof, exits[ex], ex);
    exitBlocks.push('<div class="rp-exit' + (ex === 0 ? " first" : "") + '">' +
      '<span class="rk">' + (ex === 0 ? "BEST MATCH" : (ex + 1) + "位") + '</span>' +
      '<div><p class="en">' + esc(exits[ex]) + '</p>' + (reason ? '<p class="why">' + esc(reason) + '</p>' : '') + '</div></div>');
  }
  var road = buildRoadmap(prof);
  var roadBlocks = [];
  for (var rd = 0; rd < road.length; rd++) {
    roadBlocks.push('<div class="rp-rstep"><span class="rm">' + road[rd].m + '</span>' +
      '<p class="rh">' + esc(road[rd].h) + '</p><p>' + esc(road[rd].t) + '</p></div>');
  }
  var closingHtml = buildClosing(name, prof);

  var dateStr = String(r[0] || "").split(" ")[0];
  var msg = buildMessage(name, lv, stage, typeName, td, S, exits, ans);
  var nmShort = esc(name) + 'さん｜' + esc(typeName);

  var host = document.getElementById("pages");
  host.innerHTML = "";

  /* ---------- 表紙 ---------- */
  var cover = document.createElement("div");
  cover.className = "a4 on-navy";
  cover.innerHTML =
    '<div class="cv-head bp">' +
      '<div class="cv-toprow"><span class="cv-brand">LEVANCE｜AI CAREER DIAGNOSIS</span>' +
      '<span class="cv-date">診断日 ' + esc(dateStr) + '</span></div>' +
      '<p class="cv-sub">AIレベル＆キャリアタイプ診断 結果レポート</p>' +
      '<p class="cv-name">' + esc(name) + '<span>さん</span></p>' +
      '<div class="cv-lvbox"><p class="l">あなたのAIレベル</p>' +
      '<p class="s">' + esc(stage) + '<em>LEVEL ' + lv + ' / 5</em></p>' +
      '<span class="cv-phase">' + esc(phase) + '</span></div>' +
      levelStepsHTML(lv) +
      '<div class="cv-typebar"><span class="lb">YOUR TYPE</span><p class="tn">' + esc(typeName) + '</p>' +
      '<p class="tt">' + esc(td.tag) + '</p></div>' +
      '<div class="cv-kw"><p class="lb">KEYWORDS</p><ul>' +
        msg.kwList.map(function(k){ return '<li>「' + esc(k) + '」</li>'; }).join("") +
      '</ul></div>' +
    '</div>' +
    '<div class="pg-body"><div class="pg-inner"><div class="rp-msg">' +
      msg.paras1.map(function(t){ return "<p>" + t + "</p>"; }).join("") +
    '</div></div></div>';
  host.appendChild(cover);

  /* ---------- 本編（表紙を含めて5ページに収める配分） ---------- */
  function para(t){ return '<p class="rp-para">' + t + '</p>'; }
  var ctaHtml =
    '<div class="rp-cta bp"><div class="rp-cta-in">' +
      '<p class="ck">NEXT STEP｜' + esc(name) + 'さんへのご案内</p>' +
      '<p class="ch">この先の進め方を、<span>一緒に設計します</span></p>' +
      '<p class="cp">このレポートでお渡しできるのは、共通の地図までです。実際の業務・環境・使える時間に基づいて「どこを目指し、何から始めるか」を一緒に決めるのが、<b>AI特化・個別キャリアコーチングの体験セッション</b>です。</p>' +
      '<p class="rp-cta-meta">約60〜90分｜オンライン（Zoom）｜マンツーマン｜<span>体験1回・無料</span></p>' +
      '<p class="rp-cta-link">お申し込み・詳細：<a href="' + CONSULT_URL + '">' + CONSULT_URL + '</a></p>' +
      '<p class="dis">※専任コーチの稼働枠に限りがあるため、定員に達し次第、受付を終了いたします。本レポートの内容は現時点での目安であり、成果を保証するものではありません。｜レバンス（LEVANCE）</p>' +
    '</div></div>';

  renderSections(host, [
    { kicker:"DIAGNOSIS MESSAGE", title:"強みと伸びしろ",
      blocks: msg.paras2.map(para)
              .concat([ '<div class="rp-radarwrap">' + radarSVG(S) + '</div>' ]) },

    { kicker:"CAREER EXITS", title:"6つの力と、キャリアの出口",
      blocks:[ '<div class="rp-focus">' + buildAxisReading(prof, stackWeak) + '</div>' ]
             .concat(exitBlocks)
             .concat([ '<div class="rp-sec2"><p class="rp-k">STRENGTHS</p><p class="rp-h">' + esc(typeName) + 'の強み</p>' +
                       '<ul class="rp-list">' + strengthsHtml + '</ul></div>' ]) },

    { kicker:"YOUR TYPE", title: esc(name) + "さんの場合",
      blocks: stumbleBlocks
              /* 見出しだけがページ末尾に取り残されないよう、最初の1つと一体で送る */
              .concat([ '<div><div class="rp-sec2"><p class="rp-k">MINDSET</p><p class="rp-h">いま必要な考え方</p></div>' + mindBlocks[0] + '</div>' ])
              .concat(mindBlocks.slice(1)) },

    /* タイプ別の締め（td.road）は、LAST WORDS と役割が重なるので置かない */
    { kicker:"NEXT 90 DAYS", title:"最初の90日でやること",
      blocks: roadBlocks
              .concat([ '<div class="rp-closing"><span class="ck">LAST WORDS</span>' + closingHtml + '</div>' ])
              .concat([ ctaHtml ]) }
  ], nmShort);

  /* 仕上げは「レイアウトが確定してから」行う。
     DOMを組んだ直後は高さがまだ確定しておらず、溢れていないページまで
     縮小してしまう（実測で全ページが誤って縮んでいた）。
     2フレーム待つと確定した実寸が取れる。 */
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      reflowOverflow(host);
      var allPages = host.querySelectorAll(".a4");
      for (var vp = 0; vp < allPages.length; vp++){
        var vb = allPages[vp].querySelector(".pg-body");
        if (vb && gapOf(vb) < 0) shrinkToFit(vb);
      }
      spreadGaps(host);
      numberPages(host);
    });
  });

  document.title = (name && name !== "（未入力）")
    ? "レバンス_AI診断レポート_" + name + "様"
    : "レバンス_AI診断レポート";
  show("adminBar", false);
  show("listCard", false);
  show("reportView", true);
  location.hash = "row=" + rowNum;
  window.scrollTo(0, 0);
}

document.getElementById("backBtn").addEventListener("click", function(){
  show("reportView", false);
  show("adminBar", true);
  show("listCard", true);
  document.title = "診断レポート管理｜LEVANCE";
  if (history.replaceState) history.replaceState(null, "", location.pathname);
});
document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
document.getElementById("reloadBtn").addEventListener("click", loadRows);
document.getElementById("keySubmit").addEventListener("click", function(){
  var k = document.getElementById("keyInput").value.trim();
  if (!k) return;
  setKey(k);
  document.getElementById("keyErr").style.display = "none";
  show("keyBox", false);
  loadRows();
});
document.getElementById("keyInput") && document.getElementById("keyInput").addEventListener("keydown", function(e){
  if (e.key === "Enter") document.getElementById("keySubmit").click();
});

/* 初期化 */
if (getKey()) {
  loadRows();
} else {
  show("keyBox", true);
}
