<!doctype html>
<!-- 最終更新 2026.10.29 -->
<!-- 4タイプ別 AIキャリアタイプ診断 v4 レポート管理ページ（運営専用・非公開運用）。正本。公開は repo saori421/ai-career-shindan に levance-shindan-report-v4.html としてPUT -->
<!-- 記録シートの「v4」タブを読み、診断ページv4と同じ判定・文章でレポートを組む（診断ページの判定部分を取り込んでいるので、診断ページを直したらこのファイルも作り直す：scratchpad の build 手順） -->
<!-- レポートは5ページ固定の簡略版（1=表紙と人物像／2=人物像と仕事での力／3=回答から見えたこと＋3つの傾向／4=進み方と活躍のヒント／5=90日とご案内）。溢れたときはページを増やさず縮めて収める。コーチ専用プロファイルは印刷対象外 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>診断レポート管理 v4｜LEVANCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 2026-10-12 診断ページと同じブルー〜バイオレットの配色に変更（寸法・余白・文字サイズは変えていない） */
  --head:#141A5C; --blue:#2546F0; --violet:#9A5CFF;
  --accent:#6F5BFF; --accent-soft:#CFE9FF; --accent-deep:#5B4BE0;
  /* ブランドカラーのオレンジは、お申し込みリンクと印刷ボタンだけに使う */
  --orange:#E8731E; --orange-soft:#FFB36B; --orange-deep:#C25A0F;
  --ink:#171C40; --sub:#5A6389; --line:#DFE4FA; --bg:#EEF0FF;
  --grad:linear-gradient(120deg,#2546F0 0%,#6A5BFF 55%,#B46CFF 100%);
  --aurora:
    radial-gradient(110% 85% at 100% 0%,rgba(196,112,255,.78) 0%,rgba(196,112,255,0) 58%),
    radial-gradient(95% 80% at 0% 100%,rgba(64,170,255,.55) 0%,rgba(64,170,255,0) 60%),
    linear-gradient(135deg,#161B78 0%,#2340E0 50%,#4A3FE6 100%);
  --aurora-deep:
    radial-gradient(110% 85% at 100% 0%,rgba(168,96,255,.62) 0%,rgba(168,96,255,0) 58%),
    radial-gradient(95% 80% at 0% 100%,rgba(52,140,255,.45) 0%,rgba(52,140,255,0) 60%),
    linear-gradient(135deg,#10145C 0%,#1C2FB8 55%,#3A2FC8 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7;font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 60px}

/* ---------- 管理UI ---------- */
.adminbar{
  background:var(--aurora);color:#fff;
  border-radius:12px;padding:20px 22px;margin-bottom:18px;
}
.adminbar .b{font-size:10px;letter-spacing:.24em;color:var(--accent-soft);font-weight:700}
.adminbar h1{font-size:18px;font-weight:900;margin-top:4px}
.adminbar p{font-size:12px;color:#E6EBFF;margin-top:4px}
.keybox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.keybox label{font-size:13px;font-weight:700;color:var(--head);display:block;margin-bottom:8px}
.keybox input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:15px;font-family:inherit}
.keybox button{margin-top:10px;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:11px 24px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.keybox .err{color:#C0392B;font-size:12.5px;margin-top:8px}
.listcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.listhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.listhead b{font-size:14px;color:var(--head)}
.listhead button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--sub);font-size:12px;padding:6px 14px;cursor:pointer;font-family:inherit}
.rowitem{display:flex;gap:10px 12px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rowitem:last-child{border-bottom:none}
.rowitem .d{font-size:11.5px;color:var(--sub);flex:0 0 118px}
.rowitem .nm{font-size:14px;font-weight:900;color:var(--head);min-width:120px}
.rowitem .nm small{font-size:11.5px;font-weight:500;color:var(--sub);margin-left:4px}
.rowitem .tpchip{font-size:11px;font-weight:700;color:var(--accent-deep);border:1px solid var(--accent);border-radius:4px;padding:1px 8px;white-space:nowrap}
.rowitem .axes{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:4px 6px}
.rowitem .axchip{font-size:10.5px;color:#33455C;background:#EEF1FF;border:1px solid var(--line);border-radius:4px;padding:1px 7px;line-height:1.6;white-space:nowrap}
.rowitem .axchip i{font-style:normal;color:var(--sub);margin-right:3px}
.rowitem a{
  margin-left:auto;background:var(--grad) border-box;color:#fff;text-decoration:none;
  font-size:12px;font-weight:700;border-radius:6px;padding:8px 16px;border:1px solid transparent;white-space:nowrap;
}
.loading{padding:30px;text-align:center;color:var(--sub);font-size:13px}

/* ---------- レポート画面 ---------- */
#reportView{display:none}
.report-actions{max-width:794px;margin:0 auto 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.report-actions button{
  border-radius:8px;padding:11px 22px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
}
#printBtn{background:#FF7A00;color:#fff;border:1px solid #FF7A00}
#backBtn{background:#fff;color:var(--sub);border:1px solid var(--line)}
.report-actions .hint{font-size:11.5px;color:var(--sub)}

/* ---------- コーチ専用プロファイル（印刷対象外） ---------- */
.coach{max-width:794px;margin:0 auto 22px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.coach-head{background:var(--aurora);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.coach-head b{font-size:14px}
.coach-head span{font-size:11px;color:var(--accent-soft);letter-spacing:.12em}
.coach-body{padding:14px 18px 16px}
.cp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px}
.cp-item .k{display:block;font-size:10.5px;color:var(--sub);letter-spacing:.08em}
.cp-item .v{font-size:13.5px;font-weight:700;color:var(--head);line-height:1.5;word-break:break-all}
.cp-item .v a{color:var(--blue)}
.cp-sec{margin-top:16px;margin-bottom:6px;font-size:11px;letter-spacing:.18em;color:var(--accent-deep);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px}
.cp-ax{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.cp-ax:last-child{border-bottom:none}
.cp-ax .an{flex:0 0 108px;font-size:12.5px;font-weight:700;color:var(--head)}
.cp-ax .al{flex:0 0 200px;font-size:12.5px;font-weight:700;color:var(--accent-deep)}
.cp-ax .ar{flex:1;font-size:12px;color:#3D4B5C;line-height:1.7}
.cp-q{margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#FAFBFF}
.cp-q summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--blue)}
.cp-q table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
.cp-q th,.cp-q td{text-align:left;vertical-align:top;padding:5px 6px;border-top:1px solid var(--line);line-height:1.6}
.cp-q th{width:42px;color:var(--accent-deep);font-weight:700;white-space:nowrap}
.cp-q td.qt{width:44%;color:var(--sub)}
.cp-q td.qa{font-weight:700;color:var(--head)}
.cp-q tr.step td,.cp-q tr.step th{background:#EEF1FF;color:var(--head);font-size:11px;letter-spacing:.12em;font-weight:700}
@media screen and (max-width:640px){
  .cp-grid{grid-template-columns:1fr 1fr}
  .cp-ax{flex-wrap:wrap}
  .cp-ax .al{flex:1 1 auto}
  .cp-ax .ar{flex:1 1 100%}
  .cp-q td.qt{width:40%}
}

/* スマホで読む前提（v4もv3と同じ寸法）。本文を約1.75倍に上げたぶん、A4より縦に長いページ（794×1400px）にしている */
.a4{
  width:794px;height:1400px;margin:0 auto 26px;background:#fff;position:relative;
  box-shadow:0 10px 40px rgba(11,29,58,.18);overflow:hidden;
  display:flex;flex-direction:column;
}
.a4 *{line-height:1.65}
.pgnum{position:absolute;right:36px;bottom:16px;font-size:14px;color:#9AA7B6;letter-spacing:.1em;z-index:5}
.on-navy .pgnum{color:#9AA3CF}
/* ご案内の帯が下端に来るページは、ページ番号が濃紺に乗るので明るくする */
.a4:has(.rp-cta) .pgnum{color:#9AA3CF}

.bp{position:relative;overflow:hidden}
.bp::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.26) 1.4px,transparent 2px);
  background-size:20px 20px;
  -webkit-mask-image:radial-gradient(70% 75% at 0% 0%,#000 0%,transparent 72%);
          mask-image:radial-gradient(70% 75% at 0% 0%,#000 0%,transparent 72%);
}
.bp > *{position:relative;z-index:2}

/* ----- 1枚目（表紙＋総合診断） ----- */
.cv-head{
  background:var(--aurora);
  color:#fff;padding:54px 44px 76px;flex:0 0 auto;
}
.cv-toprow{display:flex;justify-content:space-between;align-items:center}
.cv-brand{font-size:16.6px;letter-spacing:.26em;color:var(--accent-soft);font-weight:500;border:1px solid rgba(255,255,255,.45);padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.12)}
.cv-date{font-size:16.6px;color:#D5DEFF;letter-spacing:.06em}
.cv-sub{font-size:23px;color:#E6EBFF;margin-top:50px;letter-spacing:.04em}
.cv-name{font-size:42.1px;font-weight:900;margin-top:2px;line-height:1.3}
.cv-name span{font-size:28.7px;font-weight:700;color:#E6EBFF;margin-left:8px}
.cv-type{
  margin-top:50px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.36);
  border-radius:12px;padding:36px 34px 40px;
}
.cv-type .lb{font-size:14.6px;letter-spacing:.24em;color:var(--accent-soft);font-weight:700}
.cv-type .tn{font-size:44.3px;font-weight:900;margin-top:2px;line-height:1.3;color:#BFE9FF}
.cv-type .te{font-size:16.6px;letter-spacing:.24em;color:var(--accent-soft);font-weight:700;margin-top:2px}
.cv-type .tt{font-size:23px;color:#E6EBFF;margin-top:4px}
.cv-lvrow{margin-top:52px}
/* リングだと「5段階のどこか」が伝わらないので、段階を並べて現在地を示す */
.lv-steps{display:flex;align-items:flex-start;margin-top:24px}
.lv-st{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto}
.lv-st .n{
  width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.42);
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#D5DEFF;
}
.lv-st.on .n{background:#fff;border-color:#fff;color:var(--blue)}
.lv-st.cur .n{box-shadow:0 0 0 6px rgba(138,226,255,.42)}
.lv-st .t{font-size:14px;color:#C8D1F7;white-space:nowrap;letter-spacing:.02em}
.lv-st.cur .t{color:#fff;font-weight:700}
.lv-ln{flex:1 1 auto;height:2px;background:rgba(255,255,255,.26);margin:17px 8px 0}
.lv-ln.on{background:linear-gradient(90deg,#8AE2FF,#E6BEFF)}
.cv-ring{position:relative;width:150px;height:150px;flex:0 0 150px}
.cv-ring svg{transform:rotate(-90deg)}
.cv-ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
/* リングの内側に収まる幅にする（大きくすると文字が円周に重なる） */
.cv-ring-c .p{font-size:7.8px;letter-spacing:.06em;color:var(--accent-soft);font-weight:700}
.cv-ring-c .n{font-size:39.4px;font-weight:900}
.cv-ring-c .d{font-size:11.5px;color:#D5DEFF}
.cv-lvtext .l{font-size:16.6px;color:#D5DEFF;letter-spacing:.08em}
.cv-lvtext .s{font-size:30.7px;font-weight:900;margin-top:1px}
.cv-phase{display:inline-block;margin-top:6px;font-size:15.3px;font-weight:700;letter-spacing:.06em;color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:4px;padding:4px 12px}
/* 中身は .pg-inner に入れる。外枠を固定したまま中身だけ測る／縮めるため */
.cv-body{padding:38px 44px 56px;flex:1 1 auto;min-height:0;overflow:hidden;position:relative}

.rp-k{font-size:16.6px;letter-spacing:.2em;color:var(--accent-deep);font-weight:700;margin-bottom:5px}
.rp-h{font-size:27.1px;font-weight:900;color:var(--head);border-left:4px solid var(--accent);padding-left:12px;margin-bottom:11px;line-height:1.45}
.rp-msg{
  border:1px solid #D5DAFA;border-radius:12px;background:#F6F5FF;
  padding:16px 20px;
}
.rp-msg p{font-size:23.7px;line-height:1.85;color:#26313E;margin-bottom:10px}
.rp-msg p:last-child{margin-bottom:0}
.rp-msg p.lead{font-size:26.6px;font-weight:900;color:var(--head);line-height:1.7}
.rp-lvnote{margin-top:14px;background:#EEF1FF;border-radius:10px;padding:13px 18px}
.rp-lvnote .k{display:block;font-size:15.3px;letter-spacing:.14em;color:var(--accent-deep);font-weight:700;margin-bottom:3px}
.rp-lvnote p{font-size:21.5px;color:#33455C;line-height:1.75}
.rp-lvnote .nx{margin-top:8px;font-size:21.5px;color:var(--head);font-weight:700}
.rp-lvnote .nx b{color:var(--blue)}
.lv-list{margin-top:12px;border-top:1px solid var(--line)}
.lv-li{display:flex;align-items:baseline;gap:14px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:20.5px;color:#5B6B7B;line-height:1.5}
.lv-li .lv{flex:0 0 auto;font-size:18px;font-weight:900;color:#8B99A9;letter-spacing:.04em}
.lv-li .nm{flex:0 0 92px;font-weight:900;color:var(--head)}
.lv-li .ds{flex:1 1 auto}
.lv-li.cur{background:#EEF1FF}
.lv-li.cur .lv,.lv-li.cur .nm{color:var(--blue)}
.lv-li .now{flex:0 0 auto;font-size:16px;font-weight:900;color:#fff;background:var(--grad);border-radius:4px;padding:3px 11px;letter-spacing:.04em}

/* ----- 2〜4枚目共通ヘッダー ----- */
/* 横並びにすると、名前の長い方で見出しが折り返されるので縦積みにする */
.pg-head{
  background:linear-gradient(110deg,#161B78 0%,#2340E0 55%,#8A5CFF 100%);
  color:#fff;padding:16px 44px 18px;flex:0 0 auto;
}
.pg-head .t{font-size:27.2px;font-weight:900;display:block;line-height:1.35}
.pg-head .t span{color:var(--accent-soft);font-size:15.3px;letter-spacing:.22em;display:block;font-weight:700;margin-bottom:2px}
.pg-head .nm{font-size:16.4px;color:#DCE3FF;display:block;margin-bottom:6px;letter-spacing:.02em}
.pg-body{padding:24px 44px 56px;flex:1 1 auto;min-height:0;overflow:hidden;position:relative}
.pg-inner{transform-origin:top left}
.pg-fig{margin-top:30px;padding:0 12px}
.pg-fig svg{display:block;width:100%;max-width:580px;height:auto;margin:0 auto}
.rp-sec{margin-bottom:14px}

/* 2枚目：6つの傾向（両極スライダー） */
.ax-note{font-size:16.6px;color:var(--sub);margin:-4px 0 4px;line-height:1.6}
.ax-row{padding:5px 0 6px;border-bottom:1px dashed var(--line)}
.ax-row:last-child{border-bottom:none}
.ax-name{font-size:23px;font-weight:900;color:var(--head);line-height:1.5}
.ax-name .en{font-size:13.4px;letter-spacing:.2em;color:var(--accent-deep);margin-left:8px;font-weight:700}
.ax-track{position:relative;height:16px;background:#E7EAFB;border-radius:8px;margin:10px 0 7px}
.ax-track::before{content:"";position:absolute;left:50%;top:-5px;bottom:-5px;width:2px;background:#B9C1E6}
.ax-fill{position:absolute;top:0;height:100%;background:linear-gradient(90deg,var(--blue),var(--violet));border-radius:8px}
.ax-dot{position:absolute;top:50%;width:28px;height:28px;border-radius:50%;background:#fff;border:3.5px solid var(--accent);transform:translate(-50%,-50%);box-shadow:0 3px 10px rgba(84,84,255,.35)}
.ax-poles{display:flex;justify-content:space-between;font-size:19.4px;color:var(--sub);line-height:1.5}
.ax-poles b{color:var(--head);font-weight:900}
.ax-read{font-size:16.6px;color:#33455C;margin-top:4px;line-height:1.55;background:#EEF1FF;border-radius:8px;padding:4px 11px}
/* 横3列だと文字を大きくしたときに読めないので、縦に積んで理由を添える */
.ex-sec{margin-top:12px}
.ex-card{border:1px solid var(--line);border-radius:12px;padding:14px 20px 16px;background:#FAFBFF;margin-bottom:14px}
.ex-card.first{border:2px solid transparent;background:linear-gradient(180deg,#F6F5FF,#FFFFFF) padding-box,var(--grad) border-box}
.ex-card .rk{display:inline-block;font-size:14px;font-weight:900;letter-spacing:.06em;color:var(--blue);border:1px solid var(--blue);border-radius:4px;padding:2px 12px;line-height:1.5}
.ex-card.first .rk{background:var(--grad) border-box;color:#fff;border-color:transparent}
.ex-card .en{font-size:24.4px;font-weight:900;color:var(--head);margin-top:6px;line-height:1.4}
.ex-card .why{font-size:20.1px;color:#3D4B5C;margin-top:4px;line-height:1.65}

/* 3枚目：タイプ */
.tp-name{font-size:34.4px;font-weight:900;color:var(--head);line-height:1.4}
.tp-name .tp-en{font-size:15.3px;letter-spacing:.22em;color:var(--accent-deep);font-weight:700;margin-left:10px}
.tp-tag{font-size:20.8px;color:var(--sub);margin-top:1px}
.tg-axes{font-size:15.9px;color:var(--sub);margin-top:6px;line-height:1.6}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.tg-cell{border:1px solid var(--line);border-radius:10px;padding:8px 13px;background:#FAFBFF;position:relative}
.tg-cell .n{font-size:20.1px;font-weight:900;color:#8B99A9;line-height:1.5}
.tg-cell .t{font-size:14px;color:#A5B1BF;margin-top:1px;line-height:1.5}
.tg-cell.on{background:linear-gradient(135deg,#1C2496 0%,#3D4BEA 55%,#8A5CFF 100%) border-box;border:1px solid transparent;box-shadow:0 6px 18px rgba(52,64,200,.28)}
.tg-cell.on .n{color:#fff}
.tg-cell.on .t{color:#E6EBFF}
.tg-badge{position:absolute;top:-9px;right:12px;background:#fff;color:var(--blue);box-shadow:0 3px 10px rgba(52,64,200,.28);font-size:11.5px;font-weight:900;letter-spacing:.16em;border-radius:3px;padding:2px 9px;line-height:1.5}
.rp-list{list-style:none}
.rp-list li{position:relative;padding:8px 0 8px 34px;font-size:22.2px;line-height:1.6}
.rp-list li::before{content:"";position:absolute;left:2px;top:23px;width:12px;height:12px;border:3px solid var(--accent);border-radius:50%}
.rp-mind{border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:7px;background:#FAFBFF}
.rp-mind .mh{font-size:23.7px;font-weight:900;color:var(--head);line-height:1.5}
.rp-mind .mh::before{content:attr(data-n);color:var(--accent-deep);font-size:15.9px;margin-right:9px;letter-spacing:.08em}
.rp-mind p{font-size:20.3px;color:#3D4B5C;margin-top:3px;line-height:1.65}
.rp-detour{margin-top:2px;background:#EEF1FF;border-radius:10px;padding:11px 16px;font-size:20.1px;color:#33455C;line-height:1.7}

/* 90日ロードマップ・締め・CTA */
.rp-rstep{position:relative;border:1px solid var(--line);border-radius:12px;padding:16px 22px 16px 26px;background:#FAFBFF;margin-bottom:22px}
.rp-rstep::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:6px;background:linear-gradient(180deg,#3D6BFF,#B46CFF);border-radius:0 4px 4px 0}

/* 自分自身の設問（5段階）。dir＝「そう思う」が軸のどちら向きか（+1/-1）。value＝回答の強さ（+2〜-2） */
var LK_LABELS = ["とてもそう思う","ややそう思う","どちらとも言えない","あまりそう思わない","まったくそう思わない"];
function LK(id, text, axis, dir){
  var opts = [];
  for (var i = 0; i < 5; i++) { var d = {}; d[axis] = (2 - i) * dir; opts.push({t:LK_LABELS[i], d:d, value:2 - i}); }
  return {id:id, sec:1, title:text, likert:true, axis:axis, dir:dir, opts:opts};
}
/* AとBを比べる設問。A＝軸のプラス側 */
function AB(id, axis, a, b){
  var labels = ["Aに近い","ややAに近い","どちらとも言えない","ややBに近い","Bに近い"];

  for (var i = 0; i < 5; i++) { var d = {}; d[axis] = 2 - i; opts.push({t:labels[i] + (i < 2 ? "（" + a + "）" : i > 2 ? "（" + b + "）" : ""), d:d, value:2 - i}); }

/* テイスト
   badge：グラデーションの丸バッジに白いシルエット（アプリのアイコン風）
   fill ：動物そのものをグラデーションで塗る（背景なし）
   line ：線画（細い線・1色。色は周りの文字色に合わせる） */
function animalSVG(key, style, size, uid){
  var s = ANIMAL_SHAPES[key]; if (!s) return "";
  size = size || 96; uid = uid || (key + "_" + style);
  var g = 'g_' + uid;
  var defs = '<defs><linearGradient id="' + g + '" x1="0" y1="0" x2="1" y2="1">' +
             '<stop offset="0" stop-color="#2546F0"/><stop offset=".55" stop-color="#6A5BFF"/><stop offset="1" stop-color="#B46CFF"/></linearGradient></defs>';
  var body = s.body.join(""), soft = s.soft.join(""), det = s.detail.join("");
  var tf = s.tf ? ' transform="' + s.tf + '"' : '';
  var out = '<svg class="animal animal-' + style + '" viewBox="0 0 120 120" width="' + size + '" height="' + size + '" aria-hidden="true">' + defs;
  if (style === "badge") {
    out += '<circle cx="60" cy="60" r="58" fill="url(#' + g + ')"/>' +
           '<circle cx="60" cy="60" r="56.5" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/>' +
           '<g transform="translate(13 13) scale(.78)"><g' + tf + '>' +
           '<g fill="#fff">' + body + '</g>' +
           '<g fill="#5B5FEF" opacity=".18">' + soft + '</g>' +
           '<g fill="#4A4FE6" stroke="#4A4FE6">' + det + '</g></g></g>';
  } else if (style === "light") {  /* 濃い背景の上：明るいグラデーション */
    out = out.replace('stop-color="#2546F0"', 'stop-color="#A9BBFF"').replace('stop-color="#6A5BFF"', 'stop-color="#C9BFFF"').replace('stop-color="#B46CFF"', 'stop-color="#F3DBFF"');
    out += '<g' + tf + '><g fill="url(#' + g + ')">' + body + '</g>' +
           '<g fill="#fff">' + soft + '</g>' +
           '<g fill="#3B3FC8" stroke="#3B3FC8">' + det + '</g></g>';
  } else if (style === "white") {
    out += '<g' + tf + '><g fill="#fff">' + body + '</g>' +
           '<g fill="#5B5FEF" opacity=".22">' + soft + '</g>' +
           '<g fill="#5B5FEF" stroke="#5B5FEF">' + det + '</g></g>';
  } else if (style === "fill") {
    out += '<g' + tf + '><g fill="url(#' + g + ')">' + body + '</g>' +
           '<g fill="#fff">' + soft + '</g>' +
           '<g fill="#fff" stroke="#fff">' + det + '</g></g>';
  } else {
    out += '<g' + tf + ' fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">' + body + soft + '</g>' +
           '<g' + tf + ' fill="currentColor" stroke="currentColor">' + det + '</g>';
  }
  return out + '</svg>';
}

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  var decision = "", anx = "", deadline = "", hopeText = "", honkiText = "";
  var hintDecision = null, hintAnx = null, deadlineSelf = 0;

  for (var i = 0; i < QUESTIONS.length; i++) {
    var q = QUESTIONS[i];
    var opt = q.opts[ans[q.id]];
    if (!opt) continue;
    for (var k in opt.d) raw[k] += opt.d[k];
    if (opt.flag) flags[opt.flag] = true;
    if (opt.flag2) flags[opt.flag2] = true;
    if (opt.away) flags.away = true;
    if (typeof opt.dir === "string") { dir = opt.dir || null; hopeText = opt.t; }
    if (typeof opt.honki === "number") { honki = opt.honki; honkiText = opt.t; }
    if (opt.job) job = opt.job;
    if (typeof opt.pos === "number") pos = opt.pos;
    if (opt.decision) decision = opt.decision;
    if (opt.anx) anx = opt.anx;
    if (opt.deadline) deadline = opt.deadline;
    if (opt.hintDecision) hintDecision = opt.hintDecision;
    if (opt.hintAnx) hintAnx = opt.hintAnx;
    if (opt.hintDeadline) deadlineSelf += opt.hintDeadline;
  }

  /* 軸を -1〜1 に正規化 */
  var ax = {};
  for (var a = 0; a < AXES.length; a++) {
    var key = AXES[a].k;
    ax[key] = Math.round(clamp(raw[key] / AXES[a].scale, -1, 1) * 100) / 100;
  }

  /* AIレベル：使い方（Q3）で土台を決め、出ている変化（Q4）で引き上げる。
     Lv5（組織展開）は「仕事の流れに組み込み済み」かつ「周りの仕事・数字・新しい役割に効いている」ときだけ */
  var lv = [1,2,2,3,4][raw.S2] || 1;
  if (raw.S3 >= 2) lv = Math.max(lv, 2);
  if (raw.S3 >= 3) lv = Math.max(lv, 3);
  if (raw.S3 >= 4 && raw.S2 >= 2) lv = Math.max(lv, 4);
  if (raw.S3 >= 4 && raw.S2 >= 3) lv = 5;

  var typeKey = attack ? (self ? "driver" : "leap") : (self ? "architect" : "builder");

  return {ans:ans, ax:ax, raw:raw, flags:flags, dir:dir, honki:honki, job:job, pos:pos, lv:lv, typeKey:typeKey,
          decision:decision, anx:anx, deadline:deadline, hopeText:hopeText, honkiText:honkiText,
          hintDecision:hintDecision, hintAnx:hintAnx, deadlineSelf:deadlineSelf,
          isEmployee:!flags.notEmployee};
}

      if ((ex.id === "fukugyo" || ex.id === "freelance") && H <= 1) notes.push("確保できる時間が少なめのため、到達目安は長めに見ています。");
    }

    /* 到達目安（現状の準備度: AIレベル・時間・希望の一致） */
    /* 到達目安はAIレベルで決める（説明文と同じ基準。時間の設問は削除済み） */
    var curTier = r.lv >= 4 ? 0 : r.lv === 3 ? 1 : r.lv === 2 ? 2 : 3;
    if (!dirMatch && curTier < 3 && r.lv < 5) curTier = curTier + 1 > 3 ? 3 : curTier + 1;
    if ((ex.id === "fukugyo" || ex.id === "freelance") && r.isEmployee && r.lv < 3) curTier = Math.min(3, curTier + 1);
    var levTier = Math.max(0, curTier - 2);
    if (ex.id === "venture" && r.pos < 2) curTier = Math.min(3, curTier + 1);
    levTier = Math.min(levTier, curTier);

    var band = r.lv >= 4 ? "high" : (r.lv === 3 ? "mid" : "low");
    out.push({ex:ex, score:score, band:band, curTier:curTier, levTier:levTier, notes:notes, selfEmp:!!r.flags.selfEmp, awayNE:!!(r.flags.away && r.flags.notEmployee), away:!!r.flags.away});
  }
  out.sort(function(a,b){ return b.score - a.score; });
  return out;
}

/* =========================================================
   回答データの送信（シート記録＋通知。失敗しても結果表示は止めない）
========================================================= */
/* 本番は同一ドメインの /api/collect（Pages Functions経由でWorkerへ中継）。ローカルで開いたときだけWorker直接 */
var COLLECT_URL = (location.protocol === "file:")
  ? "https://levance-shindan-collect.saori421work.workers.dev/"
  : "/api/collect";

function buildPayload(ans, r){
  var lvData = LEVELS[r.lv - 1];
  var evals = evaluateExits(r);
  var answers = [];
  for (var i = 0; i < QUESTIONS.length; i++) {
    var opt = QUESTIONS[i].opts[ans[QUESTIONS[i].id]];
    answers.push(opt ? opt.t : "");
  }
  var axisLabels = {}, axes = {};
  for (var a = 0; a < AXES.length; a++) {
    axisLabels[AXES[a].k] = axisCoachLabel(AXES[a], r.ax[AXES[a].k]);
    axes[AXES[a].k] = r.ax[AXES[a].k];
  }
  var t = TYPES[r.typeKey];
  return {
    v: 4,
    name: document.getElementById("userName").value.trim(),
    age: getAgeBand(),
    email: document.getElementById("userEmail").value.trim(),
    lv: "Lv." + r.lv,
    stage: lvData.name,
    type: t.name,
    typeKey: r.typeKey,
    typeAxes: t.d + "×" + t.e,
    axes: axes,
    axisLabels: axisLabels,
    work: txtOf(r, "tachiba"),
    aiConcern: txtOf(r, "ai_nayami"),
    careerConcern: txtOf(r, "career_nayami"),
    anxiety: r.anx + (r.flags.lowVerbal ? "／言語化に不慣れ" : ""),
    hope: r.hopeText,
    honki: r.honkiText,
    exits: [evals[0].ex.name, evals[1].ex.name, evals[2].ex.name],
    answers: answers
  };
}

function sendResult(ans, r){
  if (typeof PREVIEW !== "undefined" && PREVIEW) return;   /* 確認用ファイルでは送信しない */
  try {
    var payload = buildPayload(ans, r);
    fetch(COLLECT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      keepalive: true
    }).catch(function(){});
  } catch (e) { /* 送信失敗しても診断体験は止めない */ }
}

  var ex = item.ex;

function renderTendency(r){
  var out = "";
  for (var a = 0; a < AXES.length; a++) {
    var axis = AXES[a];
    if (PUBLIC_AXES.indexOf(axis.k) < 0) continue;   /* 決め方・本音の出し方・課題の捉え方はコーチ欄のみ */
    var v = r.ax[axis.k];
    var pct = 50 + v * 50;
    var left = v >= 0 ? 50 : pct;
    var width = Math.abs(v) * 50;
    var side = axisSide(v);
    var lean = Math.round(50 + Math.abs(v) * 50);
    var leanLabel = (v >= 0 ? axis.pos : axis.neg).replace(/（.*?）/g, "");
    var pctTag = v === 0 ? '<span class="tend-lean">ちょうど中間</span>' : '<span class="tend-lean">' + leanLabel + '<b>' + lean + '%</b></span>';
    var negTxt = side === "neg" ? "<b>" + axis.neg + "</b>" : axis.neg;
    var posTxt = side === "pos" ? "<b>" + axis.pos + "</b>" : axis.pos;
    out += '<div class="tend-row">' +
      '<p class="tend-name"><span>' + axis.name + '<span class="en">' + axis.en + '</span></span>' + pctTag + '</p>' +
      '<div class="tend-track"><div class="tend-fill ' + (v >= 0 ? "pos" : "neg") + '" style="left:' + left + '%;width:' + width + '%"></div>' +
      '<div class="tend-dot" style="left:' + pct + '%"></div></div>' +
      '<div class="tend-poles"><span>' + negTxt + '</span>' +
      '<span>' + posTxt + '</span></div>' +
      '<p class="tend-read">' + esc(axisReadText(axis, v)) + '</p></div>';
  }
  document.getElementById("tendList").innerHTML = out;
}

/* =========================================================
   v3.1 言い当て：回答の組み合わせから、その人だけの文章を組み立てる
   - 受診者に見せるのは本人の役に立つ内容だけ（決め方・本音の出し方・課題の捉え方はコーチ欄のみ。9/10 FB）
   - ネガティブな決めつけはしない。事実の反射＋問いかけ＋前向きな言い換え（9/8 FB）
========================================================= */
var PREVIEW = false;   /* 本番：回答を送信する（確認用ファイルでは true） */
var PUBLIC_AXES = ["A","D","E"];

var QMAP = {};
for (var qi = 0; qi < QUESTIONS.length; qi++) QMAP[QUESTIONS[qi].id] = QUESTIONS[qi];

function optOf(r, id){ var q = QMAP[id]; var i = r.ans[id]; return (q && i !== null && i !== undefined) ? q.opts[i] : null; }
function idxOf(r, id){ var i = r.ans[id]; return (i === null || i === undefined) ? -1 : i; }
function noneOf(r, id){ var o = optOf(r, id); return !o || !!o.none; }
function txtOf(r, id){ var o = optOf(r, id); return o ? o.t : ""; }
function qt(s){ return '<span class="qt">「' + esc(s) + '」</span>'; }
function inSet(v, arr){ return arr.indexOf(v) >= 0; }

/* 自分自身の設問の回答の強さ（+2〜-2）と、引用用の文 */
function lkv(r, id){ var o = optOf(r, id); return (o && typeof o.value === "number") ? o.value : 0; }
function st(r, id){ var q = QMAP[id]; return q ? q.title : ""; }
function lkQuote(r, id){
  var q = QMAP[id], o = optOf(r, id);
  if (!q || !o) return "";
  if (q.ab) return qt(o.value > 0 ? q.ab.a : q.ab.b) + "に近い";
  return qt(q.title) + "に" + qt(o.t);
}

function subSide(r){
  var s = axisSide(r.ax.A);
  if (s !== "mid") return s;
  var v = lkv(r,"p_a3") - lkv(r,"p_a2");
  if (v !== 0) return v > 0 ? "pos" : "neg";
  return r.ax.A >= 0 ? "pos" : "neg";
}

/* 面談で4人に共通していた二面性。ルールが1つ以下しか当てはまらないときに使う */
var GAP_UNIVERSAL = "人から頼られたり、相談されたりすることはあるのに、自分の強みを一言で言おうとすると少し迷う。そんな感覚はありませんか。仕事で頼られている人ほど、この「できているのに、言葉になっていない」状態にいることが多いです。";

function strengthText(r, t){
  if (idxOf(r,"s_result") === 0) return "うまくいかないとき、まず" + qt("自分のやり方の、どこを変えるか") + "を考えられること。これは、AIの成果を「再現できる実績」に変えるときに、いちばん効く力です。";
  if (idxOf(r,"s_result") === 4) return "原因を決めつけず、まず数字や事実を確かめられること。AIをどの業務に入れるべきかを外さない力です。";
  if (lkv(r,"p_a2") === 2) return "背景と理由を押さえてから動けること。業務にAIを組み込むとき、どこに使うべきかを外さない力です。";
  if (idxOf(r,"s_stop") === 4) return "一度始めたことを、止めずに続けられること。成果は、続けた人のところにしか残りません。";
  if (lkv(r,"p_e1") === 2) return "困ったとき、まず自分で調べて試せること。AIを業務に組み込むとき、いちばん差がつく力です。";
  if (lkv(r,"p_d2") === 2) return "うまくいかなかったときのことを、先に考えられること。新しいことを、大きく外さずに進められる力です。";
  if (lkv(r,"p_e2") === 2) return "人と一緒に進めると、力が出ること。相談できる相手を持てる人は、一人で抱え込む人より遠くまで進めます。";
  return qt(t.strengths[0]) + "。このタイプの方が、自分では当たり前だと思っていることが多い強みです。";
}

function buildReading(r){
  var t = TYPES[r.typeKey];
  var side = subSide(r);
  var out = "";

  /* 1. 二つ名の説明 */
  var p1 = esc(t.name) + "の中でも、" + qt(t.nick[side]) + "。" + esc(t.nickNote[side]) + "です。";
  var want = {D: t.d === "攻め" ? 1 : -1, E: t.e === "自走" ? 1 : -1};
  var picks = [];
  for (var pi = 0; pi < QUESTIONS.length && picks.length < 2; pi++) {
    var pq = QUESTIONS[pi];
    if (!pq.likert || !want[pq.axis]) continue;
    var pv = lkv(r, pq.id) * pq.dir;
    if (pv === 2 * want[pq.axis] && !(picks.length && QMAP[picks[0]].axis === pq.axis)) picks.push(pq.id);
  }
  if (picks.length) {
    p1 += "とくに、" + lkQuote(r, picks[0]) + (picks[1] ? "、" + lkQuote(r, picks[1]) : "") + "と答えているところに、このタイプらしさがはっきり出ています。";
  }
  out += '<p class="rd"><span class="rd-h">あなたのタイプ</span>' + p1 + "</p>";

  /* 2. 現在地の反射 */
  var jobO = optOf(r,"shokushu");
  var tb = optOf(r,"tachiba");
  var notWorking = !!(tb && tb.away);
  var jobPhrase = (!jobO || jobO.none) ? (notWorking ? "直近のお仕事で" : "いまのお仕事で")
                : (notWorking ? "直近の" : "") + esc(jobO.t.replace(/（.*?）/g, "")) + "のお仕事で";
  var lvNext = r.lv === 1 ? "まずは、毎日の業務のどこか1か所でAIを使ってみるところからです。使い方を広く学ぶより、1つの業務で試す方が、早く手応えが出ます。"
             : r.lv === 2 ? "ここから先は、使う量を増やすより、毎日の業務のどこに組み込むかで差がつく段階です。"
             : r.lv === 3 ? "使いこなす段階は越えています。次に問われるのは、その成果をどう見せるかです。"
             : "使う側から、仕組みを作る側に入っています。あとは、それをキャリアの言葉に変えられるかどうかです。";
  var p2 = jobPhrase + "、AIの使い方は" + qt(txtOf(r,"katsuyo")) + "。";
  if (!noneOf(r,"seika") && idxOf(r,"seika") > 0) p2 += "AIを活用して出ている変化は" + qt(txtOf(r,"seika")) + "。";
  p2 += ctxText(r, lvNext);
  out += '<p class="rd"><span class="rd-h">いまの現在地</span>' + p2 + "</p>";

  /* 3. 回答の組み合わせ（二面性） */
  /* AI・キャリアの回答から1つ、自分自身の回答から1つ。片方が無ければもう片方から2つ */
  var hits = {career:[], self:[]};
  for (var i = 0; i < GAP_RULES.length; i++) {
    var rule = GAP_RULES[i];
    var all = hits.career.concat(hits.self), skipped = false;
    if (rule.skip) for (var s2 = 0; s2 < rule.skip.length; s2++) if (all.indexOf(rule.skip[s2]) >= 0) skipped = true;
    if (!skipped && rule.when(r)) hits[rule.group || "career"].push(rule.id);
  }
  var used = hits.career.slice(0, 1).concat(hits.self.slice(0, 1));
  var rest = hits.career.slice(1).concat(hits.self.slice(1));
  while (used.length < 2 && rest.length) used.push(rest.shift());
  var gaps = [];
  for (var g = 0; g < GAP_RULES.length; g++) if (used.indexOf(GAP_RULES[g].id) >= 0) gaps.push(GAP_RULES[g].text(r));
  if (gaps.length < 2) gaps.push(GAP_UNIVERSAL);
  for (var k = 0; k < gaps.length; k++) {
    out += '<p class="rd">' + (k === 0 ? '<span class="rd-h">回答の組み合わせから</span>' : "") + gaps[k] + "</p>";
  }

  /* 4. 気づきにくい強み */
  out += '<div class="rd-strength"><p class="rd"><span class="rd-h">自分では気づきにくい強み</span>' + strengthText(r, t) + "</p></div>";

  r.readingRules = used;
  return out;
}

function rowToAnswers(r){
  var ans = {}, miss = 0;
  for (var i = 0; i < QUESTIONS.length; i++) {
    var q = QUESTIONS[i], t = cell(r, COL.q1 + i), idx = -1;
    for (var j = 0; j < q.opts.length; j++) if (q.opts[j].t === t) { idx = j; break; }

    if (idx < 0) miss++;
  }
  return {ans:ans, miss:miss};
}

function loadRows(){

  fetch(WORKER + ROWS_PATH, { headers: { "X-Report-Key": getKey() } })
    .then(function(res){ if (res.status === 403) throw new Error("forbidden"); return res.json(); })
    .then(function(j){
      if (!j.ok) throw new Error("api");
      rows = j.values || [];
      renderList();
      var m = location.hash.match(/^#r=(\d+)$/);
      if (m) openReport(parseInt(m[1], 10));
    })
    .catch(function(e){
      if (String(e.message) === "forbidden") {
        try { localStorage.removeItem(KEY_STORE); } catch(_){}

/* ---------- ページ組み（1セクション＝1ページ。溢れたら縮めて収め、5ページを超えない） ---------- */
function gapOf(body){
  var inner = body.querySelector(":scope > .pg-inner");
  if (!inner) return body.clientHeight;
  var cs = getComputedStyle(body);
  var avail = body.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
  return avail - inner.offsetHeight;
}
function shrinkToFit(body){
  var inner = body.querySelector(":scope > .pg-inner");
  if (!inner) return;
  inner.style.zoom = "";
  var z = 1, guard = 0;
  while (gapOf(body) < 0 && guard < 30){ z -= 0.02; if (z < 0.66) break; inner.style.zoom = z.toFixed(3); guard++; }
}
function spreadGaps(host){
  var pages = host.querySelectorAll(".a4");
  for (var i = 0; i < pages.length; i++){
    var body = pages[i].querySelector(".pg-body") || pages[i].querySelector(".cv-body");
    var inner = body && body.querySelector(":scope > .pg-inner");
    if (!body || !inner || inner.style.zoom) continue;
    if (inner.querySelector(".rp-rstep") || inner.querySelector(".rp-cta")) continue;
    var n = inner.children.length;
    if (n < 2) continue;
    var room = gapOf(body) - 16;
    if (room < 60) continue;
    inner.style.display = "flex"; inner.style.flexDirection = "column";
    inner.style.rowGap = Math.min(room / (n - 1), 72).toFixed(1) + "px";
    if (gapOf(body) < 0) { inner.style.rowGap = ""; inner.style.display = ""; inner.style.flexDirection = ""; }
  }
}
function numberPages(host){
  var pages = host.querySelectorAll(".a4");
  for (var i = 0; i < pages.length; i++){
    var s = document.createElement("span");
    s.className = "pgnum";
    s.textContent = "LEVANCE AI CAREER REPORT｜" + (i + 1) + " / " + pages.length;
    pages[i].appendChild(s);
  }
}
function addPage(host, nmShort, kicker, title, blocks){
  var pg = document.createElement("div");
  pg.className = "a4";
  pg.innerHTML = '<div class="pg-head"><span class="nm">' + nmShort + '</span><p class="t"><span>' + kicker + '</span>' + title + '</p></div>' +
    '<div class="pg-body"><div class="pg-inner">' + blocks.join("") + '</div></div>';
  host.appendChild(pg);
}

function openReport(rowNum){
  if (document.fonts && !openReport._fontsReady){
    document.fonts.ready.then(function(){ openReport._fontsReady = true; openReport(rowNum); });
    return;
  }
  var r = rows[rowNum - 1];
  if (!r) { alert("その行のデータが見つかりません（行番号: " + rowNum + "）"); return; }
  var conv = rowToAnswers(r);
  var res = compute(conv.ans);
  var k = res.typeKey, t = TYPES[k], c = CHARACTER[k];
  var name = cell(r, COL.name) || "（未入力）";
  var dateStr = cell(r, COL.date).split(" ")[0];
  var lvData = LEVELS[res.lv - 1];
  var side = subSide(res);
  var nmShort = esc(name) + 'さん｜' + esc(t.name);

  /* 進み方トップ3（診断ページと同じ選び方・同じ文面） */
  var evals = evaluateExits(res), exitHtml = "";
  for (var e = 0; e < 3 && e < evals.length; e++) {
    var it = evals[e], ex = it.ex;
    var nm = (it.awayNE && ex.nameAway) || (it.selfEmp && ex.nameSelf) || ex.name;
    var et = (it.awayNE && ex.textAway) ? ex.textAway[it.band] : (it.selfEmp && ex.textSelf) ? ex.textSelf[it.band] : ex.text[it.band];
    if (it.away) et = et.replace(/いまの業務/g, "直近のお仕事").replace(/自分の業務/g, "直近のお仕事");
    exitHtml += '<div class="ex-card' + (e === 0 ? " first" : "") + '"><span class="rk">' + (e === 0 ? "BEST MATCH" : (e + 1) + "位") + '</span>' +
      '<p class="en">' + esc(nm) + '</p><p class="why">' + esc(et) + '</p></div>';
  }
  var mset = lvPick(res, "mindset"), mindHtml = "";
  for (var mi = 0; mi < mset.length; mi++) mindHtml += '<div class="rp-mind"><p class="mh" data-n="0' + (mi + 1) + '">' + esc(mset[mi].h) + '</p><p>' + esc(mset[mi].t) + '</p></div>';
  var steps = roadmapSteps(res);
  if (res.flags.selfEmp) steps = steps.map(function(s){ return [s[0], s[1].replace("評価面談・職務経歴書・提案や商談の場", "提案や商談、発信の場")]; });
  var roadHtml = "";
  for (var si = 0; si < steps.length; si++) roadHtml += '<div class="rp-rstep"><span class="rm">MONTH ' + (si + 1) + '</span><p class="rh">' + esc(steps[si][0]) + '</p><p>' + esc(steps[si][1]) + '</p></div>';
  var aru = "";
  for (var ai = 0; ai < c.aru.length; ai++) aru += "<li>" + esc(c.aru[ai]) + "</li>";
  var axHtml = "";
  for (var a = 0; a < AXES.length; a++) if (PUBLIC_AXES.indexOf(AXES[a].k) >= 0) axHtml += axisRowHTML(AXES[a], res.ax[AXES[a].k]);
  var aiText = ctxText(res, lvTier(res) === "adv" ? AI_ADV[k] : c.ai);

  var host = document.getElementById("pages");
  host.innerHTML = "";

  /* 1枚目：表紙＋人物像 */
  var cover = document.createElement("div");
  cover.className = "a4 on-navy";
  cover.innerHTML =
    '<div class="cv-head bp">' +
      '<div class="cv-toprow"><span class="cv-brand">LEVANCE｜AI CAREER DIAGNOSIS</span><span class="cv-date">診断日 ' + esc(dateStr) + '</span></div>' +
      '<p class="cv-sub">4タイプ別 AIキャリアタイプ診断｜結果レポート</p>' +
      '<p class="cv-name">' + esc(name) + '<span>さん</span></p>' +
      '<div class="cv-type"><div class="cv-ani">' + animalSVG(k, "light", 132, "cv" + k) + '</div><div class="cv-tx">' +
        '<span class="lb">YOUR TYPE</span><p class="tn">' + typeNameHTML(t) + '</p><p class="te">' + esc(t.en) + '</p>' +
        '<p class="tt">' + esc(t.tag) + '</p><span class="nick">' + esc(t.nick[side]) + '</span></div></div>' +
      '<div class="cv-lvrow"><div class="cv-lvtext"><p class="l">あなたのAIレベル（5段階）</p><p class="s">Lv.' + res.lv + '　' + esc(lvData.name) + '</p></div>' +
        levelStepsHTML(res.lv) + '<p class="cv-lvnote">' + esc(ctxText(res, lvData.note)) + '</p></div>' +
    '</div>' +
    '<div class="cv-body"><div class="pg-inner">' +
      '<div><p class="rp-k">YOUR CHARACTER</p><p class="rp-h">' + esc(name) + 'さんの人物像</p><p class="ch-lead">' + esc(c.lead) + '</p></div>' +
      '<div class="ch-step good"><p class="ch-h">あなたの持ち味</p><p>' + esc(c.good) + '</p></div>' +
    '</div></div>';
  host.appendChild(cover);

  addPage(host, nmShort, "YOUR CHARACTER", "あなたの人物像と、仕事での力", [
    '<div><p class="ch-sub">こんなところ、ありませんか？</p><ul class="aru">' + aru + '</ul></div>',
    '<div class="ch-step aspect"><p class="ch-h">こんな傾向も</p><p>' + esc(c.aspect) + '</p></div>',
    '<div class="ch-step more"><p class="ch-h">さらに力を伸ばすなら</p><p>' + esc(c.more) + '</p></div>',
    '<div class="ai-box"><p class="ai-h">AIと組み合わせると、こんなことができる</p><p>' + esc(aiText) + '</p></div>'
  ]);
  addPage(host, nmShort, "READING", esc(name) + "さんの回答から見えたこと", [
    '<div class="rd">' + buildReading(res) + '</div>',
    '<div class="ax-box"><p class="ax-h">3つの傾向（どちらが良い・悪いではありません）</p>' + axHtml + '</div>'
  ]);
  addPage(host, nmShort, "CAREER PATHS", "相性の良い進み方と、活躍のヒント", [
    '<div>' + exitHtml + '</div>',
    '<div><p class="rp-k">MINDSET</p><p class="rp-h">もっと活躍するために</p>' + mindHtml + '</div>'
  ]);
  addPage(host, nmShort, "NEXT 90 DAYS", "最初の90日でやること", [
    roadHtml,
    '<div class="rp-closing"><span class="ck">LAST WORDS</span>' + esc(lvPick(res, "road")) + '</div>',
    '<div class="rp-cta bp"><div class="rp-cta-in">' +
      '<p class="ck">NEXT STEP｜' + esc(name) + 'さんへのご案内</p>' +
      '<p class="ch">これからの評価を分けるのは、AIの<span>「実装力」</span>です</p>' +
      '<p class="cp">「使える」だけでは差がつかない時代です。どの業務にどう実装すれば成果になるかを、一人ひとりに合わせて設計するのが<b>AI特化・個別キャリアコーチング</b>です。</p>' +
      '<p class="rp-cta-meta">約60分｜オンライン（Zoom）｜マンツーマン｜<span>体験1回・無料</span></p>' +
      '<p class="rp-cta-link">お申し込み・詳細：<a href="' + CONSULT_URL + '">' + CONSULT_URL + '</a></p>' +
      '<p class="dis">※専任コーチの稼働枠に限りがあるため、定員に達し次第、受付を終了いたします。本レポートの内容は現時点での目安であり、成果を保証するものではありません。｜レバンス（LEVANCE）</p>' +
    '</div></div>'
  ]);

  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    var pages = host.querySelectorAll(".a4");
    for (var p = 0; p < pages.length; p++){
      var b = pages[p].querySelector(".pg-body") || pages[p].querySelector(".cv-body");
      if (b && gapOf(b) < 0) shrinkToFit(b);
    }
    spreadGaps(host);
    numberPages(host);
  }); });

  document.getElementById("coachBox").innerHTML = buildCoachProfile(r, res, conv.miss);
  document.title = (name && name !== "（未入力）") ? "レバンス_AI診断レポート_" + name + "様" : "レバンス_AI診断レポート";
  show("adminBar", false); show("listCard", false); show("reportView", true);
  location.hash = "r=" + rowNum;
  window.scrollTo(0, 0);
}

/* ---------- イベント・初期化 ---------- */
document.getElementById("backBtn").addEventListener("click", function(){
  show("reportView", false); show("adminBar", true); show("listCard", true);
  document.title = "診断レポート管理 v4｜LEVANCE";
  if (history.replaceState) history.replaceState(null, "", location.pathname);
});
document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
document.getElementById("reloadBtn").addEventListener("click", loadRows);
document.getElementById("keySubmit").addEventListener("click", function(){
  var kk = document.getElementById("keyInput").value.trim();
  if (!kk) return;
  setKey(kk); document.getElementById("keyErr").style.display = "none"; show("keyBox", false); loadRows();
});
document.getElementById("keyInput").addEventListener("keydown", function(e){ if (e.key === "Enter") document.getElementById("keySubmit").click(); });
if (getKey()) loadRows(); else show("keyBox", true);

</script>
