<!doctype html>
<!-- 最終更新 2026.9.7 -->
<!-- 4タイプ別 AIキャリアタイプ診断 v3 レポート管理ページ（運営専用・非公開運用） -->
<!-- 正本。公開は repo saori421/ai-career-shindan に levance-shindan-report.html としてコピーしてpush -->
<!-- 診断ページからはリンクしない。データ表示には合言葉キー（Worker側REPORT_KEY）が必要。旧 #row= リンクは levance-shindan-report-v2 へ転送 -->
<!-- レポートはA4×4枚・スマホ閲覧前提の大きめ文字（1=表紙と総合診断/2=6つの傾向と進み方/3=タイプ詳細/4=90日とご案内）。コーチ専用プロファイルは印刷対象外 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>診断レポート管理 v3｜LEVANCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1D3A; --navy2:#143A6B; --navy3:#1D4E8F;
  --gold:#C9A24B; --gold-soft:#E3D3A8; --gold-deep:#B08A2E;
  --ink:#1C2733; --sub:#5B6B7B; --line:#E6EBF2; --bg:#EEF1F5;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7;font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 60px}

/* ---------- 管理UI ---------- */
.adminbar{
  background:linear-gradient(150deg,var(--navy),var(--navy2));color:#fff;
  border-radius:12px;padding:20px 22px;margin-bottom:18px;
}
.adminbar .b{font-size:10px;letter-spacing:.24em;color:var(--gold-soft);font-weight:700}
.adminbar h1{font-size:18px;font-weight:900;margin-top:4px}
.adminbar p{font-size:12px;color:#C6D2E2;margin-top:4px}
.keybox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.keybox label{font-size:13px;font-weight:700;color:var(--navy);display:block;margin-bottom:8px}
.keybox input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:15px;font-family:inherit}
.keybox button{margin-top:10px;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:11px 24px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.keybox .err{color:#C0392B;font-size:12.5px;margin-top:8px}
.listcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.listhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.listhead b{font-size:14px;color:var(--navy)}
.listhead button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--sub);font-size:12px;padding:6px 14px;cursor:pointer;font-family:inherit}
.rowitem{display:flex;gap:10px 12px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rowitem:last-child{border-bottom:none}
.rowitem .d{font-size:11.5px;color:var(--sub);flex:0 0 118px}
.rowitem .nm{font-size:14px;font-weight:900;color:var(--navy);min-width:120px}
.rowitem .nm small{font-size:11.5px;font-weight:500;color:var(--sub);margin-left:4px}
.rowitem .tpchip{font-size:11px;font-weight:700;color:var(--gold-deep);border:1px solid var(--gold);border-radius:4px;padding:1px 8px;white-space:nowrap}
.rowitem .axes{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:4px 6px}
.rowitem .axchip{font-size:10.5px;color:#33455C;background:#F2F5F9;border:1px solid var(--line);border-radius:4px;padding:1px 7px;line-height:1.6;white-space:nowrap}
.rowitem .axchip i{font-style:normal;color:var(--sub);margin-right:3px}
.rowitem a{
  margin-left:auto;background:var(--navy);color:#fff;text-decoration:none;
  font-size:12px;font-weight:700;border-radius:6px;padding:8px 16px;border:1px solid var(--gold);white-space:nowrap;
}
.loading{padding:30px;text-align:center;color:var(--sub);font-size:13px}

/* ---------- レポート画面 ---------- */
#reportView{display:none}
.report-actions{max-width:794px;margin:0 auto 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.report-actions button{
  border-radius:8px;padding:11px 22px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
}
#printBtn{background:#FF7A00;color:#fff;border:1px solid var(--gold)}
#backBtn{background:#fff;color:var(--sub);border:1px solid var(--line)}
.report-actions .hint{font-size:11.5px;color:var(--sub)}

/* ---------- コーチ専用プロファイル（印刷対象外） ---------- */
.coach{max-width:794px;margin:0 auto 22px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.coach-head{background:linear-gradient(150deg,var(--navy),var(--navy2));color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.coach-head b{font-size:14px}
.coach-head span{font-size:11px;color:var(--gold-soft);letter-spacing:.12em}
.coach-body{padding:14px 18px 16px}
.cp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px}
.cp-item .k{display:block;font-size:10.5px;color:var(--sub);letter-spacing:.08em}
.cp-item .v{font-size:13.5px;font-weight:700;color:var(--navy);line-height:1.5;word-break:break-all}
.cp-item .v a{color:var(--navy2)}
.cp-sec{margin-top:16px;margin-bottom:6px;font-size:11px;letter-spacing:.18em;color:var(--gold-deep);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px}
.cp-ax{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.cp-ax:last-child{border-bottom:none}
.cp-ax .an{flex:0 0 108px;font-size:12.5px;font-weight:700;color:var(--navy)}
.cp-ax .al{flex:0 0 200px;font-size:12.5px;font-weight:700;color:var(--gold-deep)}
.cp-ax .ar{flex:1;font-size:12px;color:#3D4B5C;line-height:1.7}
.cp-q{margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#FBFCFE}
.cp-q summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--navy2)}
.cp-q table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
.cp-q th,.cp-q td{text-align:left;vertical-align:top;padding:5px 6px;border-top:1px solid var(--line);line-height:1.6}
.cp-q th{width:42px;color:var(--gold-deep);font-weight:700;white-space:nowrap}
.cp-q td.qt{width:44%;color:var(--sub)}
.cp-q td.qa{font-weight:700;color:var(--navy)}
.cp-q tr.step td,.cp-q tr.step th{background:#F2F5F9;color:var(--navy);font-size:11px;letter-spacing:.12em;font-weight:700}
@media screen and (max-width:640px){
  .cp-grid{grid-template-columns:1fr 1fr}
  .cp-ax{flex-wrap:wrap}
  .cp-ax .al{flex:1 1 auto}
  .cp-ax .ar{flex:1 1 100%}
  .cp-q td.qt{width:40%}
}

/* A4本体（794×1123px ≒ A4 96dpi）×4枚・スマホ閲覧前提の大きめ文字 */
.a4{
  width:794px;height:1123px;margin:0 auto 26px;background:#fff;position:relative;
  box-shadow:0 10px 40px rgba(11,29,58,.18);overflow:hidden;
  display:flex;flex-direction:column;
}
.a4 *{line-height:1.65}
.pgnum{position:absolute;right:36px;bottom:12px;font-size:11px;color:#9AA7B6;letter-spacing:.1em;z-index:5}
.on-navy .pgnum{color:#8FA0B8}

.bp{position:relative;overflow:hidden}
.bp::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 46px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 46px);
}
.bp > *{position:relative;z-index:2}

/* ----- 1枚目（表紙＋総合診断） ----- */
.cv-head{
  background:linear-gradient(150deg,var(--navy) 0%,var(--navy2) 100%);
  color:#fff;padding:30px 44px 26px;flex:0 0 auto;
}
.cv-toprow{display:flex;justify-content:space-between;align-items:center}
.cv-brand{font-size:13px;letter-spacing:.26em;color:var(--gold-soft);font-weight:500;border:1px solid rgba(201,162,75,.55);padding:6px 16px;border-radius:2px}
.cv-date{font-size:13px;color:#A9B7CB;letter-spacing:.06em}
.cv-sub{font-size:16px;color:#C6D2E2;margin-top:16px;letter-spacing:.04em}
.cv-name{font-size:38px;font-weight:900;margin-top:2px;line-height:1.3}
.cv-name span{font-size:20px;font-weight:700;color:#C6D2E2;margin-left:8px}
.cv-type{
  margin-top:16px;background:rgba(255,255,255,.07);border:1px solid rgba(201,162,75,.45);
  border-radius:12px;padding:14px 22px 16px;
}
.cv-type .lb{font-size:11.5px;letter-spacing:.24em;color:var(--gold-soft);font-weight:700}
.cv-type .tn{font-size:40px;font-weight:900;margin-top:2px;line-height:1.3}
.cv-type .te{font-size:13px;letter-spacing:.24em;color:var(--gold-soft);font-weight:700;margin-top:2px}
.cv-type .tt{font-size:16px;color:#C6D2E2;margin-top:4px}
.cv-lvrow{display:flex;gap:22px;align-items:center;margin-top:16px}
.cv-ring{position:relative;width:110px;height:110px;flex:0 0 110px}
.cv-ring svg{transform:rotate(-90deg)}
.cv-ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cv-ring-c .p{font-size:9px;letter-spacing:.22em;color:var(--gold-soft);font-weight:700}
.cv-ring-c .n{font-size:34px;font-weight:900}
.cv-ring-c .d{font-size:10.5px;color:#A9B7CB}
.cv-lvtext .l{font-size:13px;color:#A9B7CB;letter-spacing:.08em}
.cv-lvtext .s{font-size:25px;font-weight:900;margin-top:1px}
.cv-phase{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--gold-soft);border:1px solid rgba(201,162,75,.55);border-radius:4px;padding:4px 12px}
.cv-body{padding:18px 44px 0;flex:1 1 auto;min-height:0}

.rp-k{font-size:13px;letter-spacing:.2em;color:var(--gold-deep);font-weight:700;margin-bottom:5px}
.rp-h{font-size:22px;font-weight:900;color:var(--navy);border-left:4px solid var(--gold);padding-left:12px;margin-bottom:11px;line-height:1.45}
.rp-msg{
  border:1px solid var(--gold-soft);border-radius:12px;background:#FDFBF5;
  padding:16px 20px;
}
.rp-msg p{font-size:16.5px;line-height:1.85;color:#26313E;margin-bottom:10px}
.rp-msg p:last-child{margin-bottom:0}
.rp-msg p.lead{font-size:18.5px;font-weight:900;color:var(--navy);line-height:1.7}
.rp-lvnote{margin-top:14px;background:#F2F6FB;border-radius:10px;padding:13px 18px}
.rp-lvnote .k{display:block;font-size:12px;letter-spacing:.14em;color:var(--gold-deep);font-weight:700;margin-bottom:3px}
.rp-lvnote p{font-size:15px;color:#33455C;line-height:1.75}

/* ----- 2〜4枚目共通ヘッダー ----- */
.pg-head{
  background:linear-gradient(150deg,var(--navy) 0%,var(--navy2) 100%);
  color:#fff;padding:16px 44px;display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;
}
.pg-head .t{font-size:19px;font-weight:900}
.pg-head .t span{color:var(--gold-soft);font-size:12px;letter-spacing:.22em;display:block;font-weight:700;margin-bottom:2px}
.pg-head .nm{font-size:14px;color:#C6D2E2}
.pg-body{padding:16px 44px 0;flex:1 1 auto;min-height:0}
.rp-sec{margin-bottom:14px}

/* 2枚目：6つの傾向（両極スライダー） */
.ax-note{font-size:13px;color:var(--sub);margin:-4px 0 4px;line-height:1.6}
.ax-row{padding:5px 0 6px;border-bottom:1px dashed var(--line)}
.ax-row:last-child{border-bottom:none}
.ax-name{font-size:16px;font-weight:900;color:var(--navy);line-height:1.5}
.ax-name .en{font-size:10.5px;letter-spacing:.2em;color:var(--gold-deep);margin-left:8px;font-weight:700}
.ax-track{position:relative;height:11px;background:#EDF1F6;border-radius:6px;margin:7px 0 5px}
.ax-track::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:#C5CFDB}
.ax-fill{position:absolute;top:0;height:100%;background:linear-gradient(90deg,var(--navy2),var(--navy3));border-radius:6px}
.ax-dot{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:#fff;border:2.5px solid var(--gold);transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(11,29,58,.2)}
.ax-poles{display:flex;justify-content:space-between;font-size:13.5px;color:var(--sub);line-height:1.5}
.ax-poles b{color:var(--navy);font-weight:900}
.ax-read{font-size:13px;color:#33455C;margin-top:4px;line-height:1.55;background:#F7F9FC;border-radius:8px;padding:4px 11px}
.ex-sec{margin-top:12px}
.ex-row{display:flex;gap:10px}
.ex-card{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;background:#FBFCFE;text-align:center}
.ex-card.first{border:1.5px solid var(--gold);background:#FFFDF6}
.ex-card .rk{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.06em;color:var(--navy2);border:1px solid var(--navy2);border-radius:4px;padding:2px 10px;line-height:1.5}
.ex-card.first .rk{background:var(--navy);color:var(--gold-soft);border-color:var(--navy)}
.ex-card .en{font-size:17px;font-weight:900;color:var(--navy);margin-top:6px;line-height:1.4}

/* 3枚目：タイプ */
.tp-name{font-size:28px;font-weight:900;color:var(--navy);line-height:1.4}
.tp-name .tp-en{font-size:12px;letter-spacing:.22em;color:var(--gold-deep);font-weight:700;margin-left:10px}
.tp-tag{font-size:14.5px;color:var(--sub);margin-top:1px}
.tg-axes{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.6}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.tg-cell{border:1px solid var(--line);border-radius:10px;padding:8px 13px;background:#FBFCFE;position:relative}
.tg-cell .n{font-size:14px;font-weight:900;color:#8B99A9;line-height:1.5}
.tg-cell .t{font-size:11px;color:#A5B1BF;margin-top:1px;line-height:1.5}
.tg-cell.on{background:linear-gradient(150deg,var(--navy),var(--navy2));border:1px solid var(--gold);box-shadow:0 6px 18px rgba(11,29,58,.2)}
.tg-cell.on .n{color:#fff}
.tg-cell.on .t{color:#C6D2E2}
.tg-badge{position:absolute;top:-9px;right:12px;background:var(--gold);color:var(--navy);font-size:9px;font-weight:900;letter-spacing:.16em;border-radius:3px;padding:2px 9px;line-height:1.5}
.rp-list{list-style:none}
.rp-list li{position:relative;padding:3px 0 3px 26px;font-size:15.5px;line-height:1.6}
.rp-list li::before{content:"";position:absolute;left:2px;top:12px;width:9px;height:9px;border:2px solid var(--gold);border-radius:50%}
.rp-mind{border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:7px;background:#FBFCFE}
.rp-mind .mh{font-size:16.5px;font-weight:900;color:var(--navy);line-height:1.5}
.rp-mind .mh::before{content:attr(data-n);color:var(--gold-deep);font-size:12.5px;margin-right:9px;letter-spacing:.08em}
.rp-mind p{font-size:14.2px;color:#3D4B5C;margin-top:3px;line-height:1.65}
.rp-detour{margin-top:2px;background:#F2F6FB;border-radius:10px;padding:11px 16px;font-size:14px;color:#33455C;line-height:1.7}

/* 4枚目：90日・CTA */
.rp-rstep{border:1px solid var(--line);border-radius:12px;padding:14px 18px;background:#FBFCFE;margin-bottom:10px}
.rp-rstep .rm{font-size:12.5px;letter-spacing:.16em;color:var(--gold-deep);font-weight:700}
.rp-rstep .rh{font-size:18.5px;font-weight:900;color:var(--navy);margin-top:2px;line-height:1.5}
.rp-rstep p{font-size:15.5px;color:#3D4B5C;margin-top:3px;line-height:1.65}
.rp-roadextra{margin-top:2px;background:#F2F6FB;border-radius:10px;padding:14px 18px;font-size:15.5px;color:#33455C;line-height:1.7}

.rp-cta{
  position:relative;margin-top:auto;flex:0 0 auto;
  background:linear-gradient(150deg,var(--navy) 0%,#123D63 100%);color:#fff;
  padding:24px 44px 26px;overflow:hidden;
}
.rp-cta-in{position:relative;z-index:2}
.rp-cta .ck{font-size:13px;letter-spacing:.24em;color:var(--gold-soft);font-weight:700}
.rp-cta .ch{font-size:22.5px;font-weight:900;margin-top:6px;line-height:1.5}
.rp-cta .ch span{color:var(--gold-soft)}
.rp-cta .cp{font-size:15.5px;color:#DCE4EF;margin-top:9px;line-height:1.75}
.rp-cta .cp b{color:#fff}
.rp-cta-meta{margin-top:13px;font-size:16.5px;color:#E4EAF3;font-weight:700}
.rp-cta-meta span{color:var(--gold-soft)}
.rp-cta-cap{font-size:14px;color:#C6D2E2;margin-top:5px}
.rp-cta-link{margin-top:10px;font-size:14.5px;color:#DCE4EF}
.rp-cta-link a{color:var(--gold-soft);font-weight:700;text-decoration:none}
.rp-cta .dis{font-size:11px;color:#8FA0B8;margin-top:12px;border-top:1px solid rgba(255,255,255,.14);padding-top:8px;line-height:1.55;max-width:66%}

/* ---------- 印刷 ---------- */
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .noprint{display:none !important}
  .coach{display:none}
  .wrap{max-width:none;padding:0}
  .a4{width:210mm;height:296mm;box-shadow:none;margin:0;transform:none !important;page-break-after:always}
  .a4:last-child{page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media screen and (max-width:820px){
  .a4{transform-origin:top left;transform:scale(0.44);margin-bottom:-600px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="adminbar noprint" id="adminBar">
    <span class="b">LEVANCE｜ADMIN</span>
    <h1>診断レポート管理（v3）</h1>
    <p>回答一覧からレポートを開き、「PDFとして保存」でA4・4枚のレポート（スマホ閲覧向け・大きめ文字）を出力できます。レポート上部のコーチ専用プロファイルは印刷・PDFに含まれません。このページは運営専用です。</p>
  </div>

  <div class="keybox noprint" id="keyBox" style="display:none">
    <label for="keyInput">アクセスキーを入力してください（初回のみ・この端末に保存されます）</label>
    <input type="password" id="keyInput" placeholder="アクセスキー" autocomplete="off">
    <button type="button" id="keySubmit">表示する</button>
    <p class="err" id="keyErr" style="display:none">キーが違うようです。もう一度確認してください。</p>
  </div>

  <div class="listcard noprint" id="listCard" style="display:none">
    <div class="listhead"><b>回答一覧（新しい順）</b><button type="button" id="reloadBtn">再読み込み</button></div>
    <div id="listBody"><div class="loading">読み込み中...</div></div>
  </div>

  <div id="reportView">
    <div class="report-actions noprint">
      <button type="button" id="backBtn">← 一覧に戻る</button>
      <button type="button" id="printBtn">PDFとして保存（印刷）</button>
      <span class="hint">A4・4枚で出力されます。印刷画面で「PDFとして保存」を選択。コーチ専用プロファイルは出力されません</span>
    </div>
    <div id="coachBox"></div>
    <div id="pages"></div>
  </div>

</div>

<script>
"use strict";

/* 旧v2の通知リンク（#row=）は旧ページへそのまま転送する */
var LEGACY = /(^#|[#&?])row=\d+/.test(location.hash);

/* 軸ごとのラベル（診断ページv3と同じ判定） */
function axisSide(v){ return v >= 0.34 ? "pos" : v <= -0.34 ? "neg" : "mid"; }
function axisCoachLabel(axis, v){
  var s = axisSide(v);
  return s === "pos" ? axis.coachPos : s === "neg" ? axis.coachNeg : axis.coachMid;
}
function axisReadText(axis, v){
  var s = axisSide(v);
  return s === "pos" ? axis.readPos : s === "neg" ? axis.readNeg : axis.readMid;
}

/* Q1の職種回答 → 90日ロードマップの呼び方（診断ページv3の opt.job と同じ対応） */
var JOB_LABELS = {
  "営業":"営業",
  "企画・マーケティング":"企画・マーケティング",
  "経営企画・事業企画":"企画",
  "IT・DX推進":"IT・DX推進",
  "管理部門（人事・総務・経理など）":"管理部門",
  "現場・技術・製造":"現場・技術",
  "カスタマーサポート・事務":"事務・サポート",
  "フリーランス・個人事業":"いま",
  "その他":"いま"
};

var rows = [];

function esc(t){ return String(t == null ? "" : t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function getKey(){ try { return localStorage.getItem(KEY_STORE) || ""; } catch(e){ return ""; } }
function setKey(k){ try { localStorage.setItem(KEY_STORE, k); } catch(e){} }
function show(id, on){ document.getElementById(id).style.display = on ? "block" : "none"; }
function cell(r, i){ return (r && r[i] != null) ? String(r[i]) : ""; }

/* =========================================================
   データ取得・一覧
========================================================= */
function loadRows(){
  document.getElementById("listBody").innerHTML = '<div class="loading">読み込み中...</div>';
  show("listCard", true);
  fetch(WORKER + ROWS_PATH, { headers: { "X-Report-Key": getKey() } })
    .then(function(res){
      if (res.status === 403) throw new Error("forbidden");
      return res.json();
    })
    .then(function(j){
      if (!j.ok) throw new Error("api");
      rows = j.values || [];
      renderList();
      var m = location.hash.match(/^#r=(\d+)$/);
      if (m) openReport(parseInt(m[1], 10));
    })
    .catch(function(e){
      if (String(e.message) === "forbidden") {
        try { localStorage.removeItem(KEY_STORE); } catch(_){}
        show("listCard", false);
        show("keyBox", true);
        document.getElementById("keyErr").style.display = "";
      } else {
        document.getElementById("listBody").innerHTML = '<div class="loading">読み込みに失敗しました。電波の良い場所で再読み込みしてください。</div>';
      }
    });
}

function renderList(){
  var html = "";
  for (var i = rows.length - 1; i >= 1; i--) {
    var r = rows[i];
    var chips = "";
    for (var a = 0; a < 6; a++) {
      var lb = cell(r, COL.axA + a);
      if (!lb) continue;
      chips += '<span class="axchip"><i>' + AX_SHORT[a] + '</i>' + esc(lb) + '</span>';
    }
    html += '<div class="rowitem">' +
      '<span class="d">' + esc(cell(r, COL.date)) + '</span>' +
      '<span class="nm">' + esc(cell(r, COL.name)) + (cell(r, COL.age) ? '<small>（' + esc(cell(r, COL.age)) + '）</small>' : '') + '</span>' +
      '<span class="tpchip">' + esc(cell(r, COL.type)) + '</span>' +
      '<a href="#r=' + (i + 1) + '" data-row="' + (i + 1) + '">レポートを開く</a>' +
      '<span class="axes">' + chips + '</span>' +
      '</div>';
  }
  if (!html) html = '<div class="loading">まだ回答がありません。</div>';
  document.getElementById("listBody").innerHTML = html;
  var links = document.querySelectorAll("#listBody a");
  for (var l = 0; l < links.length; l++) {
    links[l].addEventListener("click", function(e){
      e.preventDefault();
      openReport(parseInt(this.getAttribute("data-row"), 10));
    });
  }
}

/* =========================================================
   レポート生成の補助
========================================================= */
function ringSVG(lv){
  var C = 2 * Math.PI * 46;
  var off = C * (1 - lv / 5);
  return '<svg width="110" height="110" viewBox="0 0 110 110">' +
    '<circle cx="55" cy="55" r="46" fill="none" stroke="rgba(201,162,75,.22)" stroke-width="6"/>' +
    '<circle cx="55" cy="55" r="46" fill="none" stroke="#C9A24B" stroke-width="6" stroke-linecap="round" ' +
    'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg>';
}

/* 列22のJSON（各-1〜1）。読めない場合は列8〜13のコーチラベルから側を補う */
function parseAxes(r){
  var src = null;
  try { src = JSON.parse(cell(r, COL.axes) || "null"); } catch(e){ src = null; }
  var out = {};
  for (var a = 0; a < AXES.length; a++) {
    var k = AXES[a].k;
    var v = null;
    if (src && src[k] != null && src[k] !== "") {
      v = parseFloat(src[k]);
      if (isNaN(v)) v = null;
    }
    if (v === null) {
      var lb = cell(r, COL.axA + a);
      v = lb === AXES[a].coachPos ? 0.67 : lb === AXES[a].coachNeg ? -0.67 : 0;
    }
    out[k] = Math.max(-1, Math.min(1, v));
  }
  return out;
}

function findType(r){
  var key = cell(r, COL.typeKey).trim();
  if (TYPES[key]) return {key:key, t:TYPES[key]};
  var nm = cell(r, COL.type).trim();
  for (var i = 0; i < TYPE_ORDER.length; i++) {
    if (TYPES[TYPE_ORDER[i]].name === nm) return {key:TYPE_ORDER[i], t:TYPES[TYPE_ORDER[i]]};
  }
  return {key:"leap", t:TYPES.leap};
}

function axisRowHTML(axis, v){
  var pct = 50 + v * 50;
  var left = v >= 0 ? 50 : pct;
  var width = Math.abs(v) * 50;
  var side = axisSide(v);
  return '<div class="ax-row">' +
    '<p class="ax-name">' + esc(axis.name) + '<span class="en">' + esc(axis.en) + '</span></p>' +
    '<div class="ax-track"><div class="ax-fill" style="left:' + left.toFixed(1) + '%;width:' + width.toFixed(1) + '%"></div>' +
    '<div class="ax-dot" style="left:' + pct.toFixed(1) + '%"></div></div>' +
    '<div class="ax-poles"><span>' + (side === "neg" ? "<b>" + esc(axis.neg) + "</b>" : esc(axis.neg)) + '</span>' +
    '<span>' + (side === "pos" ? "<b>" + esc(axis.pos) + "</b>" : esc(axis.pos)) + '</span></div>' +
    '<p class="ax-read">' + esc(axisReadText(axis, v)) + '</p></div>';
}

function cpItem(k, v){
  return '<div class="cp-item"><span class="k">' + esc(k) + '</span><span class="v">' + (v || "（未記録）") + '</span></div>';
}

/* コーチ専用プロファイル（事実と傾向の列記のみ・印刷対象外） */
function buildCoachProfile(r, tp, lvNum, ax, exits){
  var email = cell(r, COL.email);
  var h = '<div class="coach">' +
    '<div class="coach-head"><b>COACH PROFILE｜面談用プロファイル</b><span>印刷・PDFには含まれません</span></div>' +
    '<div class="coach-body">' +
    '<div class="cp-grid">' +
      cpItem("お名前", esc(cell(r, COL.name))) +
      cpItem("年代", esc(cell(r, COL.age))) +
      cpItem("メール", email ? '<a href="mailto:' + esc(email) + '">' + esc(email) + '</a>' : "") +
      cpItem("受信日時", esc(cell(r, COL.date))) +
      cpItem("タイプ", esc(tp.t.name) + '（' + esc(tp.t.d) + '×' + esc(tp.t.e) + '）') +
      cpItem("AIレベル", esc(cell(r, COL.lv) || ("Lv." + lvNum)) + '｜' + esc(cell(r, COL.stage) || LEVELS[lvNum - 1].name)) +
    '</div>';

  h += '<p class="cp-sec">6軸の傾向</p>';
  for (var a = 0; a < AXES.length; a++) {
    var v = ax[AXES[a].k];
    var lb = cell(r, COL.axA + a) || axisCoachLabel(AXES[a], v);
    h += '<div class="cp-ax"><span class="an">' + esc(COACH_AX_NAMES[a]) + '</span>' +
      '<span class="al">' + esc(lb) + '</span>' +
      '<span class="ar">' + esc(axisReadText(AXES[a], v)) + '</span></div>';
  }

  var exitTxt = "";
  for (var e = 0; e < exits.length; e++) {
    if (!exits[e]) continue;
    exitTxt += (exitTxt ? "　" : "") + (e + 1) + "位 " + esc(exits[e]);
  }
  h += '<p class="cp-sec">事実タグ</p><div class="cp-grid">' +
    cpItem("決裁", esc(cell(r, COL.decision))) +
    cpItem("締切", esc(cell(r, COL.deadline))) +
    cpItem("不安の質", esc(cell(r, COL.anx))) +
    cpItem("今後の希望", esc(cell(r, COL.hope))) +
    cpItem("温度感", esc(cell(r, COL.honki))) +
    cpItem("出口トップ3", exitTxt) +
    '</div>';

  var tbl = "";
  for (var q = 0; q < Q_COUNT; q++) {
    for (var s = 0; s < Q_STEPS.length; s++) {
      if (Q_STEPS[s].from === q) tbl += '<tr class="step"><th colspan="3">' + esc(Q_STEPS[s].label) + '</th></tr>';
    }
    tbl += '<tr><th>Q' + (q + 1) + '</th><td class="qt">' + esc(Q_TITLES[q]) + '</td>' +
      '<td class="qa">' + (esc(cell(r, COL.q1 + q)) || "（未回答）") + '</td></tr>';
  }
  h += '<details class="cp-q"><summary>全20問の回答を見る</summary><table>' + tbl + '</table></details>';
  h += '</div></div>';
  return h;
}

/* =========================================================
   レポート（A4×4枚）
========================================================= */
function openReport(rowNum){
  var r = rows[rowNum - 1];
  if (!r) { alert("その行のデータが見つかりません（行番号: " + rowNum + "）"); return; }
  var name = cell(r, COL.name) || "（未入力）";
  var lvNum = parseInt(cell(r, COL.lv).replace(/[^0-9]/g, ""), 10) || 1;
  lvNum = Math.max(1, Math.min(5, lvNum));
  var lvData = LEVELS[lvNum - 1];
  var stage = cell(r, COL.stage) || lvData.name;
  var phase = PHASES[lvData.phase].en + "（" + PHASES[lvData.phase].ja + "）";
  var tp = findType(r);
  var t = tp.t;
  var typeName = cell(r, COL.type) || t.name;
  var ax = parseAxes(r);
  var exits = [cell(r, COL.exit1), cell(r, COL.exit2), cell(r, COL.exit3)];
  var dateStr = cell(r, COL.date).split(" ")[0];
  var nmShort = esc(name) + 'さん｜' + esc(typeName);
  var job = JOB_LABELS[cell(r, COL.q1)] || "いま";
  var jobLabel = job === "いま" ? "いまの" : job + "の";

  /* 6軸スライダー */
  var axesHtml = "";
  for (var a = 0; a < AXES.length; a++) axesHtml += axisRowHTML(AXES[a], ax[AXES[a].k]);

  /* 出口トップ3（横並び） */
  var exitsHtml = "";
  for (var ex = 0; ex < 3; ex++) {
    if (!exits[ex]) continue;
    exitsHtml += '<div class="ex-card' + (ex === 0 ? " first" : "") + '">' +

  /* タイプ2×2 */

/* =========================================================
   イベント・初期化
========================================================= */
document.getElementById("backBtn").addEventListener("click", function(){
  show("reportView", false);
  show("adminBar", true);
  show("listCard", true);
  document.title = "診断レポート管理 v3｜LEVANCE";
  if (history.replaceState) history.replaceState(null, "", location.pathname);
});
document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
document.getElementById("reloadBtn").addEventListener("click", loadRows);
document.getElementById("keySubmit").addEventListener("click", function(){
  var k = document.getElementById("keyInput").value.trim();
  if (!k) return;
  setKey(k);
  document.getElementById("keyErr").style.display = "none";
  show("keyBox", false);
  loadRows();
});
document.getElementById("keyInput") && document.getElementById("keyInput").addEventListener("keydown", function(e){
  if (e.key === "Enter") document.getElementById("keySubmit").click();
});

if (!LEGACY) {
  if (getKey()) {
    loadRows();
  } else {
    show("keyBox", true);
  }
}
