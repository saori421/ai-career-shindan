<!doctype html>
<!-- 最終更新 2026.9.7 -->
<!-- 4タイプ別 AIキャリアタイプ診断 v3 レポート管理ページ（運営専用・非公開運用） -->
<!-- 正本。公開は repo saori421/ai-career-shindan に levance-shindan-report.html としてコピーしてpush -->
<!-- 診断ページからはリンクしない。データ表示には合言葉キー（Worker側REPORT_KEY）が必要。旧 #row= リンクは levance-shindan-report-v2 へ転送 -->
<!-- レポートはA4×4枚・スマホ閲覧前提の大きめ文字（1=表紙と総合診断/2=6つの傾向と進み方/3=タイプ詳細/4=90日とご案内）。コーチ専用プロファイルは印刷対象外 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>診断レポート管理 v3｜LEVANCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1D3A; --navy2:#143A6B; --navy3:#1D4E8F;
  --gold:#C9A24B; --gold-soft:#E3D3A8; --gold-deep:#B08A2E;
  /* ブランドカラーのオレンジ。「これから・行動」にあたる箇所の差し色に使う */
  --orange:#E8731E; --orange-soft:#F5A45E; --orange-deep:#C25A0F;
  --ink:#1C2733; --sub:#5B6B7B; --line:#E6EBF2; --bg:#EEF1F5;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7;font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 60px}

/* ---------- 管理UI ---------- */
.adminbar{
  background:linear-gradient(150deg,var(--navy),var(--navy2));color:#fff;
  border-radius:12px;padding:20px 22px;margin-bottom:18px;
}
.adminbar .b{font-size:10px;letter-spacing:.24em;color:var(--gold-soft);font-weight:700}
.adminbar h1{font-size:18px;font-weight:900;margin-top:4px}
.adminbar p{font-size:12px;color:#C6D2E2;margin-top:4px}
.keybox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.keybox label{font-size:13px;font-weight:700;color:var(--navy);display:block;margin-bottom:8px}
.keybox input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:15px;font-family:inherit}
.keybox button{margin-top:10px;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:11px 24px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.keybox .err{color:#C0392B;font-size:12.5px;margin-top:8px}
.listcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.listhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.listhead b{font-size:14px;color:var(--navy)}
.listhead button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--sub);font-size:12px;padding:6px 14px;cursor:pointer;font-family:inherit}
.rowitem{display:flex;gap:10px 12px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rowitem:last-child{border-bottom:none}
.rowitem .d{font-size:11.5px;color:var(--sub);flex:0 0 118px}
.rowitem .nm{font-size:14px;font-weight:900;color:var(--navy);min-width:120px}
.rowitem .nm small{font-size:11.5px;font-weight:500;color:var(--sub);margin-left:4px}
.rowitem .tpchip{font-size:11px;font-weight:700;color:var(--gold-deep);border:1px solid var(--gold);border-radius:4px;padding:1px 8px;white-space:nowrap}
.rowitem .axes{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:4px 6px}
.rowitem .axchip{font-size:10.5px;color:#33455C;background:#F2F5F9;border:1px solid var(--line);border-radius:4px;padding:1px 7px;line-height:1.6;white-space:nowrap}
.rowitem .axchip i{font-style:normal;color:var(--sub);margin-right:3px}
.rowitem a{
  margin-left:auto;background:var(--navy);color:#fff;text-decoration:none;
  font-size:12px;font-weight:700;border-radius:6px;padding:8px 16px;border:1px solid var(--gold);white-space:nowrap;
}
.loading{padding:30px;text-align:center;color:var(--sub);font-size:13px}

/* ---------- レポート画面 ---------- */
#reportView{display:none}
.report-actions{max-width:794px;margin:0 auto 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.report-actions button{
  border-radius:8px;padding:11px 22px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
}
#printBtn{background:#FF7A00;color:#fff;border:1px solid var(--gold)}
#backBtn{background:#fff;color:var(--sub);border:1px solid var(--line)}
.report-actions .hint{font-size:11.5px;color:var(--sub)}

/* ---------- コーチ専用プロファイル（印刷対象外） ---------- */
.coach{max-width:794px;margin:0 auto 22px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.coach-head{background:linear-gradient(150deg,var(--navy),var(--navy2));color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.coach-head b{font-size:14px}
.coach-head span{font-size:11px;color:var(--gold-soft);letter-spacing:.12em}
.coach-body{padding:14px 18px 16px}
.cp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px}
.cp-item .k{display:block;font-size:10.5px;color:var(--sub);letter-spacing:.08em}
.cp-item .v{font-size:13.5px;font-weight:700;color:var(--navy);line-height:1.5;word-break:break-all}
.cp-item .v a{color:var(--navy2)}
.cp-sec{margin-top:16px;margin-bottom:6px;font-size:11px;letter-spacing:.18em;color:var(--gold-deep);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px}
.cp-ax{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.cp-ax:last-child{border-bottom:none}
.cp-ax .an{flex:0 0 108px;font-size:12.5px;font-weight:700;color:var(--navy)}
.cp-ax .al{flex:0 0 200px;font-size:12.5px;font-weight:700;color:var(--gold-deep)}
.cp-ax .ar{flex:1;font-size:12px;color:#3D4B5C;line-height:1.7}
.cp-q{margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#FBFCFE}
.cp-q summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--navy2)}
.cp-q table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
.cp-q th,.cp-q td{text-align:left;vertical-align:top;padding:5px 6px;border-top:1px solid var(--line);line-height:1.6}
.cp-q th{width:42px;color:var(--gold-deep);font-weight:700;white-space:nowrap}
.cp-q td.qt{width:44%;color:var(--sub)}
.cp-q td.qa{font-weight:700;color:var(--navy)}
.cp-q tr.step td,.cp-q tr.step th{background:#F2F5F9;color:var(--navy);font-size:11px;letter-spacing:.12em;font-weight:700}
@media screen and (max-width:640px){
  .cp-grid{grid-template-columns:1fr 1fr}
  .cp-ax{flex-wrap:wrap}
  .cp-ax .al{flex:1 1 auto}
  .cp-ax .ar{flex:1 1 100%}
  .cp-q td.qt{width:40%}
}

/* スマホで読む前提。本文を約1.75倍に上げたぶん、A4より縦に長いページ（794×1400px）にしている */
.a4{
  width:794px;height:1400px;margin:0 auto 26px;background:#fff;position:relative;
  box-shadow:0 10px 40px rgba(11,29,58,.18);overflow:hidden;
  display:flex;flex-direction:column;
}
.a4 *{line-height:1.65}
.pgnum{position:absolute;right:36px;bottom:16px;font-size:17.1px;color:#9AA7B6;letter-spacing:.1em;z-index:5}
.on-navy .pgnum{color:#8FA0B8}

.bp{position:relative;overflow:hidden}
.bp::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 46px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 46px);
}
.bp > *{position:relative;z-index:2}

/* ----- 1枚目（表紙＋総合診断） ----- */
.cv-head{
  background:linear-gradient(150deg,var(--navy) 0%,var(--navy2) 100%);
  color:#fff;padding:40px 44px 46px;flex:0 0 auto;
}
.cv-toprow{display:flex;justify-content:space-between;align-items:center}
.cv-brand{font-size:20.2px;letter-spacing:.26em;color:var(--gold-soft);font-weight:500;border:1px solid rgba(201,162,75,.55);padding:6px 16px;border-radius:2px}
.cv-date{font-size:20.2px;color:#A9B7CB;letter-spacing:.06em}
.cv-sub{font-size:28px;color:#C6D2E2;margin-top:30px;letter-spacing:.04em}
.cv-name{font-size:51.3px;font-weight:900;margin-top:2px;line-height:1.3}
.cv-name span{font-size:35px;font-weight:700;color:#C6D2E2;margin-left:8px}
.cv-type{
  margin-top:34px;background:rgba(255,255,255,.07);border:1px solid rgba(201,162,75,.45);
  border-radius:12px;padding:26px 30px 30px;
}
.cv-type .lb{font-size:17.8px;letter-spacing:.24em;color:var(--gold-soft);font-weight:700}
.cv-type .tn{font-size:54px;font-weight:900;margin-top:2px;line-height:1.3}
.cv-type .te{font-size:20.2px;letter-spacing:.24em;color:var(--gold-soft);font-weight:700;margin-top:2px}
.cv-type .tt{font-size:28px;color:#C6D2E2;margin-top:4px}
.cv-lvrow{display:flex;gap:26px;align-items:center;margin-top:34px}
.cv-ring{position:relative;width:150px;height:150px;flex:0 0 150px}
.cv-ring svg{transform:rotate(-90deg)}
.cv-ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
/* リングの内側に収まる幅にする（大きくすると文字が円周に重なる） */
.cv-ring-c .p{font-size:9.5px;letter-spacing:.06em;color:var(--gold-soft);font-weight:700}
.cv-ring-c .n{font-size:48px;font-weight:900}
.cv-ring-c .d{font-size:14px;color:#A9B7CB}
.cv-lvtext .l{font-size:20.2px;color:#A9B7CB;letter-spacing:.08em}
.cv-lvtext .s{font-size:37.5px;font-weight:900;margin-top:1px}
.cv-phase{display:inline-block;margin-top:6px;font-size:18.6px;font-weight:700;letter-spacing:.06em;color:var(--gold-soft);border:1px solid rgba(201,162,75,.55);border-radius:4px;padding:4px 12px}
/* 中身は .pg-inner に入れる。外枠を固定したまま中身だけ測る／縮めるため */
.cv-body{padding:22px 44px 56px;flex:1 1 auto;min-height:0;overflow:hidden;position:relative}

.rp-k{font-size:20.2px;letter-spacing:.2em;color:var(--gold-deep);font-weight:700;margin-bottom:5px}
.rp-h{font-size:33px;font-weight:900;color:var(--navy);border-left:4px solid var(--gold);padding-left:12px;margin-bottom:11px;line-height:1.45}
.rp-msg{
  border:1px solid var(--gold-soft);border-radius:12px;background:#FDFBF5;
  padding:16px 20px;
}
.rp-msg p{font-size:28.9px;line-height:1.85;color:#26313E;margin-bottom:10px}
.rp-msg p:last-child{margin-bottom:0}
.rp-msg p.lead{font-size:32.4px;font-weight:900;color:var(--navy);line-height:1.7}
.rp-lvnote{margin-top:14px;background:#F2F6FB;border-radius:10px;padding:13px 18px}
.rp-lvnote .k{display:block;font-size:18.6px;letter-spacing:.14em;color:var(--gold-deep);font-weight:700;margin-bottom:3px}
.rp-lvnote p{font-size:26.2px;color:#33455C;line-height:1.75}

/* ----- 2〜4枚目共通ヘッダー ----- */
/* 横並びにすると、名前の長い方で見出しが折り返されるので縦積みにする */
.pg-head{
  background:linear-gradient(150deg,var(--navy) 0%,var(--navy2) 100%);
  color:#fff;padding:16px 44px 18px;flex:0 0 auto;
}
.pg-head .t{font-size:33.2px;font-weight:900;display:block;line-height:1.35}
.pg-head .t span{color:var(--gold-soft);font-size:18.6px;letter-spacing:.22em;display:block;font-weight:700;margin-bottom:2px}
.pg-head .nm{font-size:20px;color:#AEBFD4;display:block;margin-bottom:6px;letter-spacing:.02em}
.pg-body{padding:24px 44px 56px;flex:1 1 auto;min-height:0;overflow:hidden;position:relative}
.pg-inner{transform-origin:top left}
.pg-fig{margin-top:30px;padding:0 12px}
.pg-fig svg{display:block;width:100%;max-width:580px;height:auto;margin:0 auto}
.rp-sec{margin-bottom:14px}

/* 2枚目：6つの傾向（両極スライダー） */
.ax-note{font-size:20.2px;color:var(--sub);margin:-4px 0 4px;line-height:1.6}
.ax-row{padding:5px 0 6px;border-bottom:1px dashed var(--line)}
.ax-row:last-child{border-bottom:none}
.ax-name{font-size:28px;font-weight:900;color:var(--navy);line-height:1.5}
.ax-name .en{font-size:16.3px;letter-spacing:.2em;color:var(--gold-deep);margin-left:8px;font-weight:700}
.ax-track{position:relative;height:16px;background:#EDF1F6;border-radius:8px;margin:10px 0 7px}
.ax-track::before{content:"";position:absolute;left:50%;top:-5px;bottom:-5px;width:2px;background:#C5CFDB}
.ax-fill{position:absolute;top:0;height:100%;background:linear-gradient(90deg,var(--navy2),var(--navy3));border-radius:8px}
.ax-dot{position:absolute;top:50%;width:28px;height:28px;border-radius:50%;background:#fff;border:3.5px solid var(--gold);transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(11,29,58,.2)}
.ax-poles{display:flex;justify-content:space-between;font-size:23.6px;color:var(--sub);line-height:1.5}
.ax-poles b{color:var(--navy);font-weight:900}
.ax-read{font-size:20.2px;color:#33455C;margin-top:4px;line-height:1.55;background:#F7F9FC;border-radius:8px;padding:4px 11px}
/* 横3列だと文字を大きくしたときに読めないので、縦に積んで理由を添える */
.ex-sec{margin-top:12px}
.ex-card{border:1px solid var(--line);border-radius:12px;padding:14px 20px 16px;background:#FBFCFE;margin-bottom:14px}
.ex-card.first{border:2px solid var(--orange);background:#FFF6EE}
.ex-card .rk{display:inline-block;font-size:17.1px;font-weight:900;letter-spacing:.06em;color:var(--navy2);border:1px solid var(--navy2);border-radius:4px;padding:2px 12px;line-height:1.5}
.ex-card.first .rk{background:var(--orange);color:#fff;border-color:var(--orange)}
.ex-card .en{font-size:29.8px;font-weight:900;color:var(--navy);margin-top:6px;line-height:1.4}
.ex-card .why{font-size:24.5px;color:#3D4B5C;margin-top:4px;line-height:1.65}

/* 3枚目：タイプ */
.tp-name{font-size:42px;font-weight:900;color:var(--navy);line-height:1.4}
.tp-name .tp-en{font-size:18.6px;letter-spacing:.22em;color:var(--gold-deep);font-weight:700;margin-left:10px}
.tp-tag{font-size:25.4px;color:var(--sub);margin-top:1px}
.tg-axes{font-size:19.4px;color:var(--sub);margin-top:6px;line-height:1.6}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.tg-cell{border:1px solid var(--line);border-radius:10px;padding:8px 13px;background:#FBFCFE;position:relative}
.tg-cell .n{font-size:24.5px;font-weight:900;color:#8B99A9;line-height:1.5}
.tg-cell .t{font-size:17.1px;color:#A5B1BF;margin-top:1px;line-height:1.5}
.tg-cell.on{background:linear-gradient(150deg,var(--navy),var(--navy2));border:1px solid var(--gold);box-shadow:0 6px 18px rgba(11,29,58,.2)}
.tg-cell.on .n{color:#fff}
.tg-cell.on .t{color:#C6D2E2}
.tg-badge{position:absolute;top:-9px;right:12px;background:var(--gold);color:var(--navy);font-size:14px;font-weight:900;letter-spacing:.16em;border-radius:3px;padding:2px 9px;line-height:1.5}
.rp-list{list-style:none}
.rp-list li{position:relative;padding:8px 0 8px 34px;font-size:27.1px;line-height:1.6}
.rp-list li::before{content:"";position:absolute;left:2px;top:23px;width:12px;height:12px;border:3px solid var(--gold);border-radius:50%}
.rp-mind{border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:7px;background:#FBFCFE}
.rp-mind .mh{font-size:28.9px;font-weight:900;color:var(--navy);line-height:1.5}
.rp-mind .mh::before{content:attr(data-n);color:var(--gold-deep);font-size:19.4px;margin-right:9px;letter-spacing:.08em}
.rp-mind p{font-size:24.8px;color:#3D4B5C;margin-top:3px;line-height:1.65}
.rp-detour{margin-top:2px;background:#F2F6FB;border-radius:10px;padding:11px 16px;font-size:24.5px;color:#33455C;line-height:1.7}

/* 90日ロードマップ・締め・CTA */
.rp-rstep{position:relative;border:1px solid var(--line);border-radius:12px;padding:16px 22px 16px 26px;background:#FBFCFE;margin-bottom:30px}
.rp-rstep::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:6px;background:var(--orange);border-radius:0 4px 4px 0}
/* 矢印はステップ同士のあいだにだけ出す */
.rp-rstep:has(+ .rp-rstep)::after{
  content:"";position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);
  width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;
  border-top:14px solid var(--orange-soft);
}
.rp-closing{margin-top:18px;border-left:6px solid var(--gold);background:#FCF9F0;padding:20px 24px;font-size:28.9px;line-height:1.68;color:var(--navy);font-weight:700}
.rp-closing .ck{display:block;font-size:17.1px;letter-spacing:.24em;color:var(--gold-deep);font-weight:700;margin-bottom:4px}
.rp-rstep .rm{font-size:19.4px;letter-spacing:.16em;color:var(--orange-deep);font-weight:700}
.rp-rstep .rh{font-size:32.4px;font-weight:900;color:var(--navy);margin-top:2px;line-height:1.5}
.rp-rstep p{font-size:27.1px;color:#3D4B5C;margin-top:3px;line-height:1.65}
.rp-roadextra{margin-top:2px;background:#F2F6FB;border-radius:10px;padding:14px 18px;font-size:27.1px;color:#33455C;line-height:1.7}

.rp-cta{
  position:relative;margin-top:auto;flex:0 0 auto;
  background:linear-gradient(150deg,var(--navy) 0%,#123D63 100%);color:#fff;
  padding:24px 44px 26px;overflow:hidden;
}
.rp-cta-in{position:relative;z-index:2}
.rp-cta .ck{font-size:20.2px;letter-spacing:.24em;color:var(--gold-soft);font-weight:700}
.rp-cta .ch{font-size:33.8px;font-weight:900;margin-top:6px;line-height:1.5}
.rp-cta .ch span{color:var(--gold-soft)}
.rp-cta .cp{font-size:27.1px;color:#DCE4EF;margin-top:9px;line-height:1.75}
.rp-cta .cp b{color:#fff}
.rp-cta-meta{margin-top:13px;font-size:28.9px;color:#E4EAF3;font-weight:700}
.rp-cta-meta span{color:var(--gold-soft)}
.rp-cta-cap{font-size:24.5px;color:#C6D2E2;margin-top:5px}
.rp-cta-link{margin-top:10px;font-size:25.4px;color:#DCE4EF}
.rp-cta-link a{color:var(--gold-soft);font-weight:700;text-decoration:none}
.rp-cta .dis{font-size:17.1px;color:#8FA0B8;margin-top:12px;border-top:1px solid rgba(255,255,255,.14);padding-top:8px;line-height:1.55;max-width:66%}

/* ---------- 印刷 ---------- */
@media print{
  @page{size:210mm 370mm;margin:0}
  body{background:#fff}
  .noprint{display:none !important}
  .coach{display:none}
  .wrap{max-width:none;padding:0}
  .a4{width:210mm;height:370mm;box-shadow:none;margin:0;transform:none !important;page-break-after:always}
  .a4:last-child{page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media screen and (max-width:820px){
  .a4{transform-origin:top left;transform:scale(0.44);margin-bottom:-600px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="adminbar noprint" id="adminBar">
    <span class="b">LEVANCE｜ADMIN</span>
    <h1>診断レポート管理（v3）</h1>

function axisSide(v){ return v >= 0.34 ? "pos" : v <= -0.34 ? "neg" : "mid"; }
function axisCoachLabel(axis, v){
  var s = axisSide(v);
  return s === "pos" ? axis.coachPos : s === "neg" ? axis.coachNeg : axis.coachMid;
}
function axisReadText(axis, v){
  var s = axisSide(v);
  return s === "pos" ? axis.readPos : s === "neg" ? axis.readNeg : axis.readMid;

/* 列22のJSON（各-1〜1）。読めない場合は列8〜13のコーチラベルから側を補う */
function parseAxes(r){
  var src = null;
  try { src = JSON.parse(cell(r, COL.axes) || "null"); } catch(e){ src = null; }
  var out = {};
  for (var a = 0; a < AXES.length; a++) {
    var k = AXES[a].k;
    var v = null;
    if (src && src[k] != null && src[k] !== "") {
      v = parseFloat(src[k]);
      if (isNaN(v)) v = null;
    }
    if (v === null) {
      var lb = cell(r, COL.axA + a);
      v = lb === AXES[a].coachPos ? 0.67 : lb === AXES[a].coachNeg ? -0.67 : 0;
    }
    out[k] = Math.max(-1, Math.min(1, v));
  }
  return out;
}

/* =========================================================
   レポート（A4×4枚）
========================================================= */
/* ------------------------------------------------------------------
   自動ページ組み
   1) まずセクション全体を1枚に入れてみる（収まればそれが最良）
   2) 少しだけ溢れるなら、そのページを縮めて1枚に収める
      → ここが効かないと「2段落だけで次ページ送り」になり、余白だらけになる
   3) 大きく溢れるときだけ、ブロック単位で次ページへ送る
------------------------------------------------------------------ */
function renderSections(host, sections, nmShort){
  function addPage(sec, idx){
    var pg = document.createElement("div");
    pg.className = "a4";
    pg.setAttribute("data-sec", idx);
    pg.innerHTML =
      '<div class="pg-head"><span class="nm">' + nmShort + '</span>' +
      '<p class="t"><span>' + sec.kicker + '</span>' + sec.title + '</p></div>' +
      '<div class="pg-body"><div class="pg-inner"></div></div>';
    host.appendChild(pg);
    var body = pg.querySelector(".pg-body");
    var inner = pg.querySelector(".pg-inner");
    var target = inner;
    if (sec.wrap){
      var w = document.createElement("div");
      w.className = sec.wrap;
      inner.appendChild(w);
      target = w;
    }
    return { page: pg, body: body, target: target };
  }

  /* セクションはあらかじめ1ページ分の量に切ってある。
     ここでは分割せず「1セクション＝1ページ」で組み、
     溢れた分だけ後段の reflowOverflow が次ページへ送る。 */
  for (var i = 0; i < sections.length; i++){
    var sec = sections[i];
    if (!sec.blocks || !sec.blocks.length) continue;
    var cur = addPage(sec, i);
    for (var j = 0; j < sec.blocks.length; j++){
      var tmp = document.createElement("div");
      tmp.innerHTML = sec.blocks[j];
      var node = tmp.firstElementChild;
      if (node) cur.target.appendChild(node);
    }
  }
}

/* 外枠(.pg-body)の使える高さと、中身(.pg-inner)の実寸の差。
   zoom は内側の座標系ごと縮むので、外枠に直接かけると clientHeight も一緒に変わり
   いくら縮めても差が埋まらない。必ず「固定の外枠」と「縮む中身」を分けて測る。 */
function gapOf(body){
  var inner = body.querySelector(":scope > .pg-inner");
  if (!inner) return body.clientHeight;
  var cs = getComputedStyle(body);
  var avail = body.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
  /* getBoundingClientRect は親の transform(プレビュー用の縮小表示)を拾ってしまい、
     clientHeight と単位が食い違う。offsetHeight ならレイアウト値なので揃う。 */
  return avail - inner.offsetHeight;
}

/* 溢れたページの末尾ブロックを、同じセクションの次ページへ送る。
   縮小（zoom）で押し込むと本文が小さくなり、スマホで読めなくなる。
   まずページを分けて解決し、それでも収まらないものだけ shrinkToFit に回す。 */
function reflowOverflow(host){
  var guard = 0;
  while (guard++ < 16){
    var pages = host.querySelectorAll(".a4[data-sec]");
    var moved = false;
    for (var i = 0; i < pages.length; i++){
      var pg = pages[i];
      var body = pg.querySelector(".pg-body");
      if (!body || gapOf(body) >= 0) continue;
      var target = pg.querySelector(".pg-inner > .rp-msg") || pg.querySelector(".pg-inner");
      /* ブロックが1つしかないページは、これ以上分けられない */
      if (!target || target.children.length < 2) continue;

      var sec = pg.getAttribute("data-sec");
      var next = pg.nextElementSibling;
      if (!next || next.getAttribute("data-sec") !== sec){
        next = document.createElement("div");
        next.className = "a4";
        next.setAttribute("data-sec", sec);
        next.innerHTML = pg.querySelector(".pg-head").outerHTML +
          '<div class="pg-body"><div class="pg-inner">' +
          (target.className ? '<div class="' + target.className + '"></div>' : "") +
          '</div></div>';
        pg.parentNode.insertBefore(next, pg.nextSibling);
      }
      var nt = next.querySelector(".pg-inner > .rp-msg") || next.querySelector(".pg-inner");
      var node = target.lastElementChild;
      target.removeChild(node);
      nt.insertBefore(node, nt.firstChild);
      moved = true;
      break; /* DOMが変わったので、測り直しから再開する */
    }
    if (!moved) break;
  }
}

/* 単体で1ページに収まらないブロック用の最後の砦 */
/* はみ出したページを、収まるまで少しずつ縮める。
   transform は見た目だけ変えてレイアウトに反映されず、測り直しが噛み合わない。
   zoom はレイアウトごと縮むので、縮めては測り直す方式が確実に効く。 */
function shrinkToFit(body){
  var inner = body.querySelector(":scope > .pg-inner");
  if (!inner) return;
  inner.style.zoom = "";
  if (gapOf(body) >= 0) return;
  var z = 1, guard = 0;
  while (gapOf(body) < 0 && guard < 24){
    z -= 0.02;
    if (z < 0.7) break;
    inner.style.zoom = z.toFixed(3);
    guard++;
  }
}

/* 全ページ確定後に通し番号を振る */
function numberPages(host){
  var pages = host.querySelectorAll(".a4");
  for (var i = 0; i < pages.length; i++){
    var old = pages[i].querySelector(".pgnum");
    if (old) old.parentNode.removeChild(old);
    var s = document.createElement("span");
    s.className = "pgnum";
    s.textContent = "LEVANCE AI CAREER REPORT｜" + (i + 1) + " / " + pages.length;
    pages[i].appendChild(s);
  }
}

var FIG_LINE = "#D5DEEA", FIG_NAVY = "#143A6B", FIG_NAVY2 = "#1D4E8F",
    FIG_GOLD = "#C9A24B", FIG_OR = "#E8731E", FIG_PALE = "#E7ECF3";

/* AI＝中心から、仕事のあらゆる接点へつながっていく
   中央のAIを起点に、業務のアイコンが円周上に並ぶ構図。線画のみで作る */
function figNetwork(){
  var CX = 300, CY = 150, RX = 246, RY = 118, R = 27;
  var ang = [-67.5, -22.5, 22.5, 67.5, 112.5, 157.5, 202.5, 247.5];
  /* 鍵／クラウド／地球／チャット／歯車／グラフ／メール／通信 */
  var ic = [
    '<rect x="-7" y="-1.4" width="14" height="10.6" rx="2.4"/><path d="M-4.1 -1.4 v-2.7 a4.1 4.1 0 0 1 8.2 0 v2.7"/>',
    '<path d="M-8.4 4.6 h13.1 a4.3 4.3 0 0 0 .3 -8.6 a6.1 6.1 0 0 0 -11.6 -1.2 a4.7 4.7 0 0 0 -1.8 9.8 Z"/>',
    '<circle cx="0" cy="0" r="8"/><path d="M-8 0 h16"/><ellipse cx="0" cy="0" rx="3.9" ry="8"/>',
    '<rect x="-8" y="-7.2" width="16" height="12" rx="3"/><path d="M-3.4 4.8 v4.4 l5.2 -4.4"/>',
    '<circle cx="0" cy="0" r="7.6" stroke-dasharray="3.1 2.9"/><circle cx="0" cy="0" r="3.4"/>',
    '<path d="M-7 6.4 v-5.6 M0 6.4 v-11 M7 6.4 v-8.2"/>',
    '<rect x="-8" y="-6" width="16" height="12" rx="2.2"/><path d="M-8 -4.2 l8 6.1 l8 -6.1"/>',
    '<path d="M-8.4 -1.2 a11.4 11.4 0 0 1 16.8 0"/><path d="M-4.6 2.9 a6.6 6.6 0 0 1 9.2 0"/>'
  ];
  var s = '<svg viewBox="0 0 600 300" width="600" height="300" xmlns="http://www.w3.org/2000/svg">';

  /* 外周の軌道 */
  s += '<ellipse cx="'+CX+'" cy="'+CY+'" rx="'+RX+'" ry="'+RY+'" fill="none" stroke="'+FIG_LINE+'" stroke-width="1.4" stroke-dasharray="2 8"/>';

  /* 中心から各接点へ伸びる線（円は後から白で塗るので、線は自然に隠れる） */
  var pos = [];
  for (var i = 0; i < ang.length; i++){
    var t = ang[i] * Math.PI / 180;
    pos.push([CX + RX * Math.cos(t), CY + RY * Math.sin(t)]);
    s += '<line x1="'+CX+'" y1="'+CY+'" x2="'+pos[i][0].toFixed(1)+'" y2="'+pos[i][1].toFixed(1)+'" stroke="'+FIG_LINE+'" stroke-width="1.6"/>';
  }
  /* 隣り合う接点どうしも、うっすらつなぐ */
  for (var j = 0; j < pos.length; j++){
    var k = (j + 1) % pos.length;
    s += '<line x1="'+pos[j][0].toFixed(1)+'" y1="'+pos[j][1].toFixed(1)+'" x2="'+pos[k][0].toFixed(1)+'" y2="'+pos[k][1].toFixed(1)+'" stroke="'+FIG_LINE+'" stroke-width="1.1" stroke-dasharray="3 5"/>';
  }

  /* 接点（2つだけオレンジにして視線の止まりどころを作る） */
  for (var m = 0; m < pos.length; m++){
    var col = (m === 1 || m === 5) ? FIG_OR : FIG_NAVY;
    s += '<circle cx="'+pos[m][0].toFixed(1)+'" cy="'+pos[m][1].toFixed(1)+'" r="'+R+'" fill="#fff" stroke="#C6D2E0" stroke-width="1.6"/>' +
      '<g transform="translate('+pos[m][0].toFixed(1)+','+pos[m][1].toFixed(1)+')" fill="none" stroke="'+col+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ic[m] + '</g>';
  }

  /* 中央のAI */
  s += '<circle cx="'+CX+'" cy="'+CY+'" r="82" fill="none" stroke="'+FIG_GOLD+'" stroke-opacity=".28" stroke-width="1.2"/>' +
    '<circle cx="'+CX+'" cy="'+CY+'" r="66" fill="none" stroke="'+FIG_OR+'" stroke-opacity=".3" stroke-width="1.6" stroke-dasharray="34 14"/>' +
    '<circle cx="'+CX+'" cy="'+CY+'" r="50" fill="#fff" stroke="'+FIG_NAVY+'" stroke-width="2.4"/>' +
    '<text x="'+CX+'" y="'+(CY + 12)+'" text-anchor="middle" font-size="34" font-weight="900" letter-spacing="1.5" fill="'+FIG_NAVY+'" font-family="Helvetica Neue, Arial, sans-serif">AI</text>';

  return s + '</svg>';
}

/* キャリア＝段階を上がっていく（積み上がるほど、届く高さが変わる） */
function figSteps(){
  var s = '<svg viewBox="0 0 600 300" width="600" height="300" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0,16)">';
  var x = [78, 190, 302, 414], y = [206, 172, 130, 80], w = 96;
  var fil = [FIG_PALE, "#CBD6E4", FIG_NAVY, FIG_OR];
  s += '<line x1="62" y1="252" x2="526" y2="252" stroke="'+FIG_LINE+'" stroke-width="1.6"/>';
  for (var i = 0; i < 4; i++){
    s += '<rect x="'+x[i]+'" y="'+y[i]+'" width="'+w+'" height="'+(252 - y[i])+'" rx="7" fill="'+fil[i]+'"/>';
  }
  s += '<path d="M126 176 C238 150 352 108 470 52" stroke="'+FIG_GOLD+'" stroke-width="2.6" fill="none" stroke-dasharray="9 8" stroke-linecap="round"/>' +
    '<path d="M456 38 L482 44 L466 64 Z" fill="'+FIG_GOLD+'"/>' +
    '<circle cx="126" cy="176" r="7" fill="#fff" stroke="'+FIG_GOLD+'" stroke-width="2.6"/>';
  return s + '</g></svg>';
}

/* 現在地と的＝どこを狙うか */
function figTarget(){
  var CX = 356, CY = 138;
  var s = '<svg viewBox="0 0 600 300" width="600" height="300" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0,16)">';
  var r = [112, 82, 52, 26], st = [FIG_PALE, "#CBD6E4", "#9FB4CC", FIG_GOLD];
  for (var i = 0; i < 4; i++){
    s += '<circle cx="'+CX+'" cy="'+CY+'" r="'+r[i]+'" fill="none" stroke="'+st[i]+'" stroke-width="2.2"/>';
  }
  s += '<circle cx="'+CX+'" cy="'+CY+'" r="11" fill="'+FIG_OR+'"/>' +
    '<path d="M62 234 C132 214 196 186 258 156" stroke="'+FIG_NAVY+'" stroke-width="2.6" fill="none" stroke-dasharray="9 8" stroke-linecap="round"/>' +
    '<circle cx="62" cy="234" r="9" fill="#fff" stroke="'+FIG_NAVY+'" stroke-width="2.8"/>' +
    '<path d="M262 142 L292 150 L272 172 Z" fill="'+FIG_NAVY+'"/>';
  return s + '</g></svg>';
}

/* 業務の流れの中にAIが入り、最後が成果になる */
function figFlow(){
  var s = '<svg viewBox="0 0 600 300" width="600" height="300" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0,14)">';
  var x = [46, 226, 406], w = 148;
  for (var i = 0; i < 3; i++){
    var isMid = (i === 1);
    s += '<rect x="'+x[i]+'" y="124" width="'+w+'" height="104" rx="12" fill="#fff" stroke="'+(isMid ? FIG_OR : "#C6D2E0")+'" stroke-width="'+(isMid ? 2.6 : 1.8)+'"/>';
    if (i < 2){
      s += '<path d="M'+(x[i]+w+10)+' 176 h26" stroke="'+FIG_LINE+'" stroke-width="2.4" stroke-linecap="round"/>' +
        '<path d="M'+(x[i]+w+38)+' 176 l-12 -7 v14 Z" fill="#C6D2E0"/>';
    }
  }
  /* 左と中央は書類、右は仕上がった成果 */
  s += '<g stroke="#C6D2E0" stroke-width="2.4" stroke-linecap="round">' +
    '<path d="M74 156 h92 M74 178 h92 M74 200 h56"/>' +
    '<path d="M254 156 h92 M254 178 h92 M254 200 h56"/></g>' +
    '<path d="M436 178 l22 22 l40 -46" stroke="'+FIG_OR+'" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  /* 中央の工程にAIが入る */
  s += '<path d="M300 124 V92" stroke="'+FIG_LINE+'" stroke-width="1.8" stroke-dasharray="4 6"/>' +
    '<circle cx="300" cy="60" r="34" fill="#fff" stroke="'+FIG_NAVY+'" stroke-width="2.4"/>' +
    '<circle cx="300" cy="60" r="45" fill="none" stroke="'+FIG_GOLD+'" stroke-opacity=".3" stroke-width="1.2"/>' +
    '<text x="300" y="72" text-anchor="middle" font-size="26" font-weight="900" letter-spacing="1.2" fill="'+FIG_NAVY+'" font-family="Helvetica Neue, Arial, sans-serif">AI</text>';
  return s + '</g></svg>';
}

var FIG_POOL = [figNetwork, figSteps, figFlow, figTarget];

/* 余白が大きく残ったページにだけ図版を置く（図版はおよそ322px使う） */
function fillGaps(host){
  var pages = host.querySelectorAll(".a4");
  var used = 0;
  for (var i = 0; i < pages.length; i++){
    /* 表紙（.cv-body）も対象にする。ここが大きく空くと未完成に見える */
    var body = pages[i].querySelector(".pg-body") || pages[i].querySelector(".cv-body");
    var inner = body && body.querySelector(":scope > .pg-inner");
    if (!body || !inner || inner.style.zoom) continue;
    if (gapOf(body) < 325) continue;
    var fig = document.createElement("div");
    fig.className = "pg-fig";
    fig.innerHTML = FIG_POOL[used % FIG_POOL.length]();
    inner.appendChild(fig);
    if (gapOf(body) < 0) inner.removeChild(fig); else used++;
  }
}

/* 図版を入れてもまだ空くページは、ブロックの間隔を広げて余白を全体に散らす。
   下端だけが大きく空いた「作りかけ」の見え方を避ける */
function spreadGaps(host){
  var pages = host.querySelectorAll(".a4[data-sec]");
  for (var i = 0; i < pages.length; i++){
    var body = pages[i].querySelector(".pg-body");
    var inner = body && body.querySelector(":scope > .pg-inner");
    if (!body || !inner || inner.style.zoom) continue;
    var target = inner.querySelector(":scope > .rp-msg") || inner;
    /* 90日ロードマップは、カード間の矢印が間隔ありきの位置に置かれているので触らない */
    if (target.querySelector(".rp-rstep")) continue;
    var n = target.children.length;
    if (n < 2) continue;
    var room = gapOf(body) - 16;   /* 端まで詰めきらず、少し残す */
    if (room < 60) continue;
    target.style.display = "flex";
    target.style.flexDirection = "column";
    target.style.rowGap = Math.min(room / (n - 1), 110).toFixed(1) + "px";
    /* flex化でマージンの相殺がなくなり、想定より伸びることがある */
    if (gapOf(body) < 0){
      target.style.rowGap = "";
      target.style.display = "";
      target.style.flexDirection = "";
    }
  }
}

function openReport(rowNum){
  /* Webフォント確定後に組む。先に組むとフォールバックの字幅で高さを測ってしまい、
     実際の描画で行が増えてページ下端が切れる。 */
  if (document.fonts && !openReport._fontsReady){
    document.fonts.ready.then(function(){ openReport._fontsReady = true; openReport(rowNum); });
    return;
  }
  var r = rows[rowNum - 1];
  if (!r) { alert("その行のデータが見つかりません（行番号: " + rowNum + "）"); return; }
  var name = cell(r, COL.name) || "（未入力）";
  var lvNum = parseInt(cell(r, COL.lv).replace(/[^0-9]/g, ""), 10) || 1;
  lvNum = Math.max(1, Math.min(5, lvNum));
  var lvData = LEVELS[lvNum - 1];
  var stage = cell(r, COL.stage) || lvData.name;
  var phase = PHASES[lvData.phase].en + "（" + PHASES[lvData.phase].ja + "）";
  var tp = findType(r);
  var t = tp.t;
  var typeName = cell(r, COL.type) || t.name;
  var ax = parseAxes(r);
  var exits = [cell(r, COL.exit1), cell(r, COL.exit2), cell(r, COL.exit3)];
  var dateStr = cell(r, COL.date).split(" ")[0];
  var nmShort = esc(name) + 'さん｜' + esc(typeName);
  var job = JOB_LABELS[cell(r, COL.q1)] || "いま";
  var jobLabel = job === "いま" ? "いまの" : job + "の";

  /* 6軸スライダー（1軸=1ブロック。溢れたページを分けられるように分割しておく） */
  var axisBlocks = [];
  for (var a = 0; a < AXES.length; a++) axisBlocks.push(axisRowHTML(AXES[a], ax[AXES[a].k]));

  /* 相性の良い進み方トップ3。理由はAIレベルに応じて出し分ける */
  var exBand = lvNum >= 4 ? "high" : lvNum === 3 ? "mid" : "low";
  var exitBlocks = [];
  for (var ex = 0; ex < 3; ex++) {
    if (!exits[ex]) continue;
    var def = null;
    for (var ei = 0; ei < EXITS.length; ei++) if (EXITS[ei].name === exits[ex]) def = EXITS[ei];
    var why = def ? def.text[exBand] : "";
    exitBlocks.push('<div class="ex-card' + (ex === 0 ? " first" : "") + '">' +
      '<span class="rk">' + (ex === 0 ? "BEST MATCH" : (ex + 1) + "位") + '</span>' +
      '<p class="en">' + esc(exits[ex]) + '</p>' +
      (why ? '<p class="why">' + esc(why) + '</p>' : '') + '</div>');
  }

  /* タイプ2×2 */
  var gridHtml = "";
  for (var tk = 0; tk < TYPE_ORDER.length; tk++) {
    var key = TYPE_ORDER[tk];
    var on = key === tp.key;
    gridHtml += '<div class="tg-cell' + (on ? " on" : "") + '">' + (on ? '<span class="tg-badge">YOU</span>' : "") +
      '<p class="n">' + esc(TYPES[key].name) + '</p>' +
      '<p class="t">' + esc(TYPES[key].d + "×" + TYPES[key].e + "｜" + TYPES[key].tag) + '</p></div>';
  }
  var strengthsHtml = "", stumblesHtml = "";
  for (var st = 0; st < t.strengths.length; st++) strengthsHtml += "<li>" + esc(t.strengths[st]) + "</li>";
  for (var sm = 0; sm < t.stumbles.length; sm++) stumblesHtml += "<li>" + esc(t.stumbles[sm]) + "</li>";
  var mindBlocks = [];
  for (var mi = 0; mi < t.mindset.length; mi++) {
    mindBlocks.push('<div class="rp-mind"><p class="mh" data-n="0' + (mi + 1) + '">' + esc(t.mindset[mi].h) + '</p><p>' + esc(t.mindset[mi].t) + '</p></div>');
  }

  /* 90日ロードマップ（診断ページv3の renderResult と同じ3項目） */
  var ROADMAP = [
    {m:"MONTH 1", h:"対象業務を1つ決めて、小さく実装する", t:jobLabel + "業務の中から、AIで改善しやすいテーマを1つ選びます。ツールの勉強からではなく、毎日やっている業務から選ぶのがポイントです。"},
    {m:"MONTH 2", h:"業務フローを再設計して、変化を記録する", t:"作業時間・品質・アウトプット量のどれが、どう変わったかを記録します。この記録が、あとで実績の材料になります。"},
    {m:"MONTH 3", h:"成果を「評価される言葉」に変換する", t:"「どの業務を、どれくらい改善したか」を、評価面談・職務経歴書・商談で語れる形に仕上げます。"}
  ];
  var roadBlocks = [];
  for (var rd = 0; rd < ROADMAP.length; rd++) {
    roadBlocks.push('<div class="rp-rstep"><span class="rm">' + ROADMAP[rd].m + '</span>' +
      '<p class="rh">' + esc(ROADMAP[rd].h) + '</p><p>' + esc(ROADMAP[rd].t) + '</p></div>');
  }

  var host = document.getElementById("pages");
  host.innerHTML = "";

  /* ---------- 表紙 ---------- */
  var cover = document.createElement("div");
  cover.className = "a4 on-navy";
  cover.innerHTML =
    '<div class="cv-head bp">' +
      '<div class="cv-toprow"><span class="cv-brand">LEVANCE｜AI CAREER DIAGNOSIS</span>' +
      '<span class="cv-date">診断日 ' + esc(dateStr) + '</span></div>' +
      '<p class="cv-sub">4タイプ別 AIキャリアタイプ診断｜結果レポート</p>' +
      '<p class="cv-name">' + esc(name) + '<span>さん</span></p>' +
      '<div class="cv-type"><span class="lb">YOUR TYPE</span>' +
        '<p class="tn">' + esc(typeName) + '</p>' +
        '<p class="te">' + esc(t.en) + '</p>' +
        '<p class="tt">' + esc(t.tag) + '</p></div>' +
      '<div class="cv-lvrow">' +
        '<div class="cv-ring">' + ringSVG(lvNum) +
          '<div class="cv-ring-c"><span class="p">AI LEVEL</span><span class="n">' + lvNum + '</span><span class="d">of 5</span></div></div>' +
        '<div class="cv-lvtext"><p class="l">あなたのAIレベル（5段階）</p><p class="s">' + esc(stage) + '</p>' +
        '<span class="cv-phase">' + esc(phase) + '</span></div>' +
      '</div>' +
    '</div>' +
    '<div class="cv-body"><div class="pg-inner">' +
      '<div class="rp-msg"><p class="lead">' + esc(t.summary) + '</p></div>' +
    '</div></div>';
  host.appendChild(cover);

  /* ---------- 本編（量に応じて自動でページを送る） ---------- */
  renderSections(host, [
    { kicker:"DIAGNOSIS MESSAGE", title: esc(name) + "さんへの総合診断",
      blocks:[ '<div class="rp-msg"><p>' + esc(t.desc) + '</p></div>',
               '<div class="rp-lvnote"><span class="k">AI LEVEL｜Lv.' + lvNum + '「' + esc(stage) + '」の現在地</span><p>' + esc(lvData.note) + '</p></div>',
               '<div class="rp-sec"><p class="rp-k">STRENGTHS</p><p class="rp-h">このタイプの強み</p>' +
               '<ul class="rp-list">' + strengthsHtml + '</ul></div>' ] },

    /* 6軸を1ページに押し込むと必ず溢れる。前半3つ・後半3つで最初から分ける */
    { kicker:"YOUR TENDENCY", title:"あなたの6つの傾向",
      blocks:[ '<p class="ax-note">どちらが良い・悪いではありません。自分の傾向に合った進め方を選ぶほど、同じ努力で遠くまで届きます。</p>' ]
             .concat(axisBlocks.slice(0, 3)) },

    { kicker:"YOUR TENDENCY", title:"動き方と、向き合い方", blocks: axisBlocks.slice(3) },

    { kicker:"CAREER PATHS", title:"相性の良い進み方", blocks: exitBlocks },

    { kicker:"YOUR TYPE", title:"あなたのキャリアタイプ",
      blocks:[ '<div><p class="tp-name">' + esc(typeName) + '<span class="tp-en">' + esc(t.en) + '</span></p>' +
               '<p class="tp-tag">' + esc(t.tag) + '</p>' +
               '<p class="tg-axes">「動機の向き（攻め・守り）」と「進め方（自走・伴走）」の組み合わせで、4つのタイプに分かれます。</p></div>',
               '<div class="type-grid">' + gridHtml + '</div>',
               '<div class="rp-sec"><p class="rp-k">ATTENTION</p><p class="rp-h">このタイプが気をつけたいこと</p>' +
               '<ul class="rp-list">' + stumblesHtml + '</ul></div>',
               '<div class="rp-detour">' + esc(t.detour) + '</div>' ] },

    { kicker:"MINDSET", title:"いま必要な考え方", blocks: mindBlocks },

    { kicker:"NEXT 90 DAYS", title:"最初の90日でやること",
      /* タイプ別の締めと共通の締めは、分けると2ページ目がほぼ空になるのでひとつにまとめる */
      blocks: roadBlocks
              .concat([ '<div class="rp-closing"><span class="ck">LAST WORDS</span>' + esc(t.road) +
                        '<br>AIを使える人はこの2年で増えましたが、業務そのものを設計し直すところまで踏み込んでいる人は、まだ多くありません。<b>いま手をつけた分が、そのまま差になります。</b></div>' ]) }
  ], nmShort);

  /* ---------- 締めとご案内 ---------- */
  var last = document.createElement("div");
  last.className = "a4 on-navy";
  last.innerHTML =
    '<div class="rp-cta bp last"><div class="rp-cta-in">' +
      '<p class="ck">NEXT STEP｜' + esc(name) + 'さんへのご案内</p>' +
      '<p class="ch">あなたの業務・環境に基づいた<span>「進め方」</span>を、<br>一緒に設計する体験セッションをご用意しています。</p>' +
      '<p class="cp">このレポートでお渡しできるのは、共通の地図までです。実際の業務内容・職場環境・使える時間に基づいて、どこを目指し、まず何から始めればいいか。その方向づけを行う<b>AI特化・個別キャリアコーチングの体験セッション</b>を、1回無料でご用意しています。</p>' +
      '<p class="rp-cta-meta">約60〜90分｜オンライン（Zoom）｜マンツーマン｜<span>体験1回・無料</span></p>' +
      '<p class="rp-cta-cap">※専任コーチの稼働枠に限りがあるため、定員に達し次第、受付を終了いたします。</p>' +
      '<p class="rp-cta-link">お申し込み・詳細：<a href="' + CONSULT_URL + '">' + CONSULT_URL + '</a>（公式LINEからもご案内しています）</p>' +
      '<p class="dis">※本レポートの内容は現時点での目安であり、成果を保証するものではありません。｜レバンス（LEVANCE）</p>' +
    '</div></div>';
  host.appendChild(last);

  /* 仕上げは「レイアウトが確定してから」行う。
     DOMを組んだ直後は高さがまだ確定しておらず、溢れていないページまで縮小してしまう。 */
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      reflowOverflow(host);
      var allPages = host.querySelectorAll(".a4");
      for (var vp = 0; vp < allPages.length; vp++){
        var vb = allPages[vp].querySelector(".pg-body") || allPages[vp].querySelector(".cv-body");
        if (vb && gapOf(vb) < 0) shrinkToFit(vb);
      }
      fillGaps(host);
      spreadGaps(host);
      numberPages(host);
    });
  });

  document.getElementById("coachBox").innerHTML = buildCoachProfile(r, tp, lvNum, ax, exits);

  document.title = (name && name !== "（未入力）")
    ? "レバンス_AI診断レポート_" + name + "様"
    : "レバンス_AI診断レポート";
  show("adminBar", false);
  show("listCard", false);
  show("reportView", true);
  location.hash = "r=" + rowNum;
  window.scrollTo(0, 0);
}

/* =========================================================
   イベント・初期化
========================================================= */
document.getElementById("backBtn").addEventListener("click", function(){
  show("reportView", false);
  show("adminBar", true);
  show("listCard", true);
  document.title = "診断レポート管理 v3｜LEVANCE";
  if (history.replaceState) history.replaceState(null, "", location.pathname);
});
document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
document.getElementById("reloadBtn").addEventListener("click", loadRows);
document.getElementById("keySubmit").addEventListener("click", function(){
  var k = document.getElementById("keyInput").value.trim();
  if (!k) return;
  setKey(k);
  document.getElementById("keyErr").style.display = "none";
  show("keyBox", false);
  loadRows();
});
document.getElementById("keyInput") && document.getElementById("keyInput").addEventListener("keydown", function(e){
  if (e.key === "Enter") document.getElementById("keySubmit").click();
});

if (!LEGACY) {
  if (getKey()) {
    loadRows();
  } else {
    show("keyBox", true);
  }
}
